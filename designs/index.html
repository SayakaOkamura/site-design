<style>
:root{ --bg:#1d0a2c; --pu:#654087; --li:#bb7eea; --wh:#fbf8ff; --ac:#d7ff3a; }
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--wh); font-family:"Zen Kaku Gothic New",sans-serif; line-height:1.6; padding:clamp(32px,7vh,72px) 16px 64px}
main{max-width:720px; margin:0 auto}
h1{font-family:"Dela Gothic One",sans-serif; font-weight:400; font-size:clamp(28px,5vw,44px); color:var(--li); margin-bottom:clamp(20px,4vh,36px)}
ol{list-style:none; counter-reset:n}
li{counter-increment:n; border-top:1px solid rgba(187,126,234,.25)}
li:last-child{border-bottom:1px solid rgba(187,126,234,.25)}
a{display:flex; align-items:baseline; gap:16px; padding:14px 4px; color:var(--wh); text-decoration:none; font-weight:700; font-size:clamp(17px,2.4vw,22px); transition:color .12s, padding-left .2s cubic-bezier(.2,.8,.2,1)}
a::before{content:counter(n, decimal-leading-zero); font-size:12px; letter-spacing:.15em; color:var(--pu); min-width:2em}
a:hover,a:focus-visible{color:var(--ac); padding-left:12px; outline:none}
a:hover::before,a:focus-visible::before{color:var(--ac)}
</style>
