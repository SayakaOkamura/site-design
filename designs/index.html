<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>デザイン案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 一覧は案の邪魔をしない：白に近い地、灰色の字、差し色なし */
:root{ --bg:#ececea; --ink:#222; --sub:#888; --line:#d6d6d2; }
*{box-sizing:border-box; margin:0; padding:0}
body{background:var(--bg); color:var(--ink); font-family:"Zen Kaku Gothic New",sans-serif; padding:clamp(24px,5vh,48px) 16px 64px}
main{max-width:1280px; margin:0 auto}
h2{font-size:13px; font-weight:700; letter-spacing:.08em; color:var(--sub); margin:0 4px 14px}
section + section{margin-top:clamp(28px,5vh,44px)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr)); gap:clamp(16px,2.4vw,28px)}
a{display:block; color:var(--ink); text-decoration:none; border-radius:10px; padding:8px; outline:none; transition:background .15s}
a:hover,a:focus-visible{background:rgba(0,0,0,.06)}
.ttl{display:block; font-size:13px; padding:0 2px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.thumb{position:relative; display:block; aspect-ratio:16/10; overflow:hidden; border-radius:6px; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.08); transition:box-shadow .15s}
a:hover .thumb,a:focus-visible .thumb{box-shadow:0 0 0 2px #666,0 6px 18px rgba(0,0,0,.12)}
.thumb iframe{position:absolute; left:0; top:0; width:1440px; height:900px; border:0; transform-origin:0 0; pointer-events:none}
</style>
<main id="list"></main>
<script>
(function(){
  /* 新しい日付を上に。日付の中は古いものから順 */
  var GROUPS = [
    { date:'11/26〜', items:[
      ['016-next/bodoge.html',  'ボードゲームの卓'],
      ['016-next/kumikae.html', '英字が組み替わる誌面'],
      ['016-next/window.html',  '時間で変わる作業部屋'],
      ['016-next/hodoku.html',  '整理できるダサいサイト'],
      ['016-next/reversible.html', '裏返せるサイト'],
      ['016-next/tabs.html',    '見た目を着替えるサイト'],
      ['016-next/bodoge3d.html', '立体のボードゲームの卓'],
      ['016-next/damashie.html', '角度が合うと読める卓'],
      ['016-next/wa.html',       'ほどけて輪になる紐'],
      ['016-next/bodoge2d.html', '手ざわりのあるボードゲームの卓']
    ]},
    { date:'11/19〜11/25', items:[
      ['015-directions/shop.html',    'ゲームのお店'],
      ['015-directions/site.html',    'ミニゲーム付きのサイト'],
      ['015-directions/ikaga.html',   'いかがでしたかブログ'],
      ['015-directions/rosen.html',   '伸びていく路線図'],
      ['015-directions/bodoge.html',  'ボードゲームの卓'],
      ['015-directions/status.html',  'RPG のステータス画面'],
      ['015-directions/kumikae.html', '英字が組み替わる誌面'],
      ['015-directions/window.html',  '時間で変わる作業部屋']
    ]}
  ];
  var list = document.getElementById('list'), thumbs = [];
  GROUPS.forEach(function(g){
    var s = document.createElement('section'), h = document.createElement('h2'), grid = document.createElement('div');
    h.textContent = g.date; grid.className = 'grid'; s.appendChild(h); s.appendChild(grid); list.appendChild(s);
    g.items.forEach(function(it){
      var a = document.createElement('a'); a.href = it[0];
      var t = document.createElement('span'); t.className = 'ttl'; t.textContent = it[1];
      var th = document.createElement('span'); th.className = 'thumb';
      var f = document.createElement('iframe'); f.src = it[0]; f.loading = 'lazy'; f.tabIndex = -1;
      f.setAttribute('aria-hidden', 'true'); f.title = it[1];
      f.addEventListener('load', function(){ try{ var st = f.contentDocument.createElement('style');
        st.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none}'; f.contentDocument.head.appendChild(st); }catch(e){} });
      th.appendChild(f); a.appendChild(t); a.appendChild(th); grid.appendChild(a); thumbs.push(th);
    });
  });
  function fit(){ thumbs.forEach(function(th){ th.firstChild.style.transform = 'scale(' + (th.clientWidth / 1440) + ')'; }); }
  new ResizeObserver(fit).observe(list); fit();
})();
</script>
