<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>デザイン案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 一覧は案の邪魔をしない：白に近い地、灰色の字、差し色なし */
:root{ --bar:#e9e9e6; --tab:#f7f7f5; --ink:#222; --sub:#888; --line:#d6d6d2; --hov:#dfdfdb; }
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{display:flex; flex-direction:column; background:var(--bar); color:var(--ink); font-family:"Zen Kaku Gothic New",sans-serif; overflow:hidden}
.strip{display:flex; align-items:flex-end; gap:2px; padding:8px 8px 0; overflow-x:auto; scrollbar-width:none; flex:none}
.strip::-webkit-scrollbar{display:none}
.grp{flex:none; align-self:center; margin:0 6px 0 10px; font-size:11px; letter-spacing:.08em; color:var(--sub); white-space:nowrap}
.grp:first-child{margin-left:4px}
.tab{position:relative; flex:none; display:flex; align-items:center; gap:8px; height:36px; padding:0 14px; max-width:220px; border:0; border-radius:8px 8px 0 0; background:transparent; color:var(--ink); font:inherit; font-size:13px; white-space:nowrap; cursor:pointer}
.tab span{overflow:hidden; text-overflow:ellipsis}
.tab:hover{background:var(--hov)}
.tab[aria-selected="true"]{background:var(--tab)}
.tab:not([aria-selected="true"]):not(:hover) + .tab:not([aria-selected="true"]):not(:hover)::before{content:""; position:absolute; left:-1px; top:10px; bottom:10px; border-left:1px solid var(--line)}
.tab:focus-visible{outline:2px solid var(--sub); outline-offset:-2px}
.bar{display:flex; align-items:center; gap:10px; height:38px; padding:0 12px; background:var(--tab); border-bottom:1px solid var(--line); flex:none}
.url{flex:1; min-width:0; height:26px; display:flex; align-items:center; padding:0 12px; border-radius:13px; background:#ececea; font-size:12px; color:var(--sub); overflow:hidden; white-space:nowrap; text-overflow:ellipsis}
.open{flex:none; font-size:12px; color:var(--sub); text-decoration:none; padding:4px 6px}
.open:hover{color:var(--ink)}
iframe{flex:1; width:100%; border:0; background:#fff}
</style>
<nav class="strip" role="tablist" aria-label="デザイン案" id="strip"></nav>
<div class="bar"><div class="url" id="url"></div><a class="open" id="open" target="_blank" rel="noopener">別のタブで開く ↗</a></div>
<iframe id="view" title="デザイン案"></iframe>
<script>
(function(){
  /* 古いものから順に。group が変わるところで区切りの見出しが入る */
  var ITEMS = [
    { group:'11/19〜11/25', items:[
      ['015-directions/shop.html',    'ゲームのお店'],
      ['015-directions/site.html',    'ミニゲーム付きのサイト'],
      ['015-directions/ikaga.html',   'いかがでしたかブログ'],
      ['015-directions/rosen.html',   '伸びていく路線図'],
      ['015-directions/bodoge.html',  'ボードゲームの卓'],
      ['015-directions/status.html',  'RPG のステータス画面'],
      ['015-directions/kumikae.html', '英字が組み替わる誌面'],
      ['015-directions/window.html',  '時間で変わる作業部屋']
    ]},
    { group:'11/26〜', items:[
      ['016-next/bodoge.html',  'ボードゲームの卓'],
      ['016-next/kumikae.html', '英字が組み替わる誌面'],
      ['016-next/window.html',  '時間で変わる作業部屋']
    ]}
  ];
  var strip = document.getElementById('strip'), view = document.getElementById('view'),
      url = document.getElementById('url'), open = document.getElementById('open'), tabs = [];
  ITEMS.forEach(function(g){
    var h = document.createElement('span'); h.className = 'grp'; h.textContent = g.group; strip.appendChild(h);
    g.items.forEach(function(it){
      var b = document.createElement('button'); b.className = 'tab'; b.setAttribute('role', 'tab');
      b.innerHTML = '<span></span>'; b.firstChild.textContent = it[1]; b.title = it[1];
      b.dataset.src = it[0]; b.addEventListener('click', function(){ show(b, true); });
      strip.appendChild(b); tabs.push(b);
    });
  });
  function show(b, push){
    tabs.forEach(function(t){ t.setAttribute('aria-selected', t === b ? 'true' : 'false'); t.tabIndex = t === b ? 0 : -1; });
    view.src = b.dataset.src; open.href = b.dataset.src;
    url.textContent = new URL(b.dataset.src, location.href).href.replace(/^https?:\/\//, '');
    document.title = b.title + ' — デザイン案';
    if (push) history.replaceState(null, '', '#' + b.dataset.src);
    b.scrollIntoView({ block:'nearest', inline:'nearest' });
  }
  strip.addEventListener('keydown', function(e){
    var i = tabs.indexOf(document.activeElement); if (i < 0) return;
    var j = e.key === 'ArrowRight' ? i + 1 : e.key === 'ArrowLeft' ? i - 1 : -1;
    if (j >= 0 && j < tabs.length){ e.preventDefault(); tabs[j].focus(); show(tabs[j], true); }
  });
  var want = decodeURIComponent(location.hash.slice(1));
  show(tabs.filter(function(t){ return t.dataset.src === want; })[0] || tabs[tabs.length - 1], false);
})();
</script>
