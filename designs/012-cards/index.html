<!-- ═══════════════════════════════════════════════════════════════
     012 カード（2026-09-15。**011 とは別の案**）

     本人の注文：
     > もう一案やりたいやつあって。全然違うんだけど。……今度は**カードの方に寄せる**。
     > **本文、そっちの推測でいいからめちゃくちゃ盛って分量増やして**ほしくて。
     > で、**黒字に緑文字**とか、まあ**可読性がギリギリ担保できるくらい**の感じで
     > **大量の文が連なってて**。**章ごとに左上か右上にアイコン**があって、そこが**発光**してるのね。
     > そこを押すと、**文字がモーション付きでまとまっていって、一枚の読みやすいカードになる**
     > っていう構成。それが章毎に。章＝サービスとか企業理念とかね。
     > で、**縦スクロールの普通の HP** って感じの動きでいい。
     > **カードにした後についてはまだ決めてない**んだけど、**仮で適当に**しておいて。

     011 から持ち込んだのは**失敗の記録だけ**（本人：「失敗だけ」）。決めごとは一つも引き継がない。

     **膨らませたのは考え方のほうだけ。**実績・数字・取引先・導入事例のような
     **事実は一つも作っていない。**公式に出ている言葉（理念の四段落、サービスの四項目、
     会社概要）を土台に、**その言い分を延ばした**だけ。
     ここは他人の会社の話を書く場所なので、盛るなら**意見**を盛る。

     **難解さは体験の最初に置く。**読みにくい壁を先に見せて、畳むのはそのあと——
     という順番そのものが、この案の主張。
═══════════════════════════════════════════════════════════════ -->
<style>
:root{
  --bg:#04070a;      --bg2:#070c10;
  /* **ギリギリ読める**ところに置く（本人：「可読性がギリギリ担保できるくらい」）。
     ここの二つを明るくすれば、いくらでも読みやすくなる——**つまみはこの二行** */
  --dim:#256a3e;     /* 生の本文 */
  --dim2:#17402a;    /* さらに奥。行間に沈む文字 */
  --on:#7df0a4;      /* まとまったあとの文字。ここで初めて楽に読める */
  --hot:#b9ffd2;     /* 見出しと発光 */
  --line:#12331f;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0; background:var(--bg); color:var(--dim);
  font-family:"MS Gothic","Osaka-Mono","Noto Sans Mono CJK JP",monospace;
  -webkit-font-smoothing:antialiased}

/* 走査線。**画面が古い**ことを言うだけの薄い層 */
body::after{content:''; position:fixed; inset:0; z-index:9; pointer-events:none; opacity:.3;
  background:repeating-linear-gradient(180deg,
    rgba(0,0,0,.45) 0 1px, rgba(0,0,0,0) 1px 3px)}

.wrap{max-width:1100px; margin:0 auto; padding:0 clamp(16px,5vw,56px)}

/* ─ 名乗り。**ここが手本になる** ─────────────────────────────
   （2026-09-15、本人：「言葉にはしたくないけど気付かせたい。
   パッと見たときに**え！？**ってなってほしい。……最初の**会社名だけギリギリわかる**ように
   しておいて、**会社名の周りについてる文字とかを綺麗にまとめるチュートリアル**的なものが
   必要かな」）。

   **開くと、社名が字に埋もれている。**少ししてから、周りの字がひとりでに集まって消え、
   社名だけが残って明るくなる。**印が一度光るのは、その瞬間。**
   これを見たあとなら、章の印は「押すとあれが起きるもの」に見える——**言葉を足さずに済む。** */
header{padding:clamp(48px,11vh,110px) 0 clamp(40px,8vh,80px)}
#hero{position:relative}
/* 埋もれている字。畳むのは `.raw` と同じ作法 */
.noise{overflow:hidden; transition:max-height .75s cubic-bezier(.3,.7,.2,1) .18s}
.noise .col{text-align:justify; text-justify:inter-character; color:var(--dim2);
  font-size:clamp(10.5px,1.02vw,12px); line-height:1.62; letter-spacing:-.01em}
.noise .ln{transition:opacity .34s ease, filter .34s ease}
#hero.on .noise .ln{opacity:0; filter:blur(2px)}
/* **近づくと反応する。**印に触れているあいだ、まわりの字が薄れる——
   畳まないので、押したら何が起きるかだけが分かる。**やるのは相手** */
.heroico:hover ~ .noise .ln,
.heroico:focus-visible ~ .noise .ln{opacity:.4; filter:blur(1.2px)}
/* 一度だけの身じろぎ。**畳みきらない** */
#hero.twitch:not(.on) .noise .ln{opacity:.35; filter:blur(1.4px); transition-delay:0s !important}
.noise.a .col{padding-left:clamp(56px,7vw,86px)}   /* 印のぶんだけ空ける */

/* 社名。**はじめはギリギリ**。埋もれている字と同じ暗さで、大きさだけが違う */
/* **印の右へ寄せる。**畳んだあと名乗りが一番上に来るので、
   寄せていないと印と社名が重なる（画面で分かった）。
   章の並び（左に印、右に字）とも揃う */
.nameline{padding:clamp(10px,1.6vh,18px) 0 clamp(10px,1.6vh,18px) clamp(56px,7vw,86px);
  transition:padding .5s ease}
#hero.on .nameline{padding:clamp(2px,.6vh,6px) 0 clamp(14px,2vh,22px) clamp(56px,7vw,86px)}
.nameline .en{font-size:clamp(11px,1.3vw,13px); letter-spacing:.34em; color:var(--dim2);
  transition:color .5s ease .25s}
.nameline h1{margin:.6em 0 0; font-size:clamp(17px,2.4vw,26px); letter-spacing:.08em;
  color:var(--dim); font-weight:400; transition:color .5s ease .25s, text-shadow .5s ease .25s}
.nameline .tag{margin-top:1.1em; font-size:clamp(12px,1.5vw,15px); color:var(--dim2);
  letter-spacing:.04em; transition:color .5s ease .35s}
#hero.on .nameline .en{color:var(--dim)}
#hero.on .nameline h1{color:var(--hot); text-shadow:0 0 22px rgba(125,240,164,.18)}
#hero.on .nameline .tag{color:var(--on)}

/* 手本の印。章のものと**同じ形**。ここで一度だけ強く光る */
.heroico{position:absolute; top:0; left:0; z-index:3}
.heroico.flash{animation:flash .5s steps(4) 1 !important}
@keyframes flash{
  0%  { box-shadow:0 0 0 0 rgba(125,240,164,.0);  border-color:var(--dim) }
  40% { box-shadow:0 0 34px 6px rgba(125,240,164,.65), 0 0 22px 0 rgba(125,240,164,.5) inset;
        border-color:#fff }
  100%{ box-shadow:0 0 0 0 rgba(125,240,164,.0);  border-color:var(--line) }
}
#hero.on .heroico{animation:none; border-color:var(--line); color:var(--dim2); box-shadow:none}

/* **ここだけは言葉で言う**（2026-09-15、本人：「チュートリアルとして、
   **ここをクリックみたいなやつをタイトルにだけ**つけちゃってもいい」）。
   **先頭の一つだけ。**章には付けない——一度教われば、同じ形は同じことをする。
   壁の上に置くので**地の色を敷く**（字の上に字を重ねると読めない）。
   明滅は **1 から下げる**だけ——0 から上げると、動きが走らない場で出ないまま終わる */
.heroclue{position:absolute; z-index:4; white-space:nowrap; pointer-events:none;
  left:calc(clamp(44px,5vw,58px) + clamp(8px,1vw,13px));
  top:calc(clamp(44px,5vw,58px) / 2 - .75em);
  padding:2px 7px; background:var(--bg); color:var(--hot);
  font-size:clamp(10.5px,1.15vw,13px); letter-spacing:.06em;
  animation:clue 2.4s ease-in-out infinite}
@keyframes clue{ 0%,100%{opacity:1} 50%{opacity:.55} }
/* 一度でも押したら消す（戻しても出さない——もう教わっている） */
#hero.taught .heroclue{animation:none; opacity:0; transition:opacity .45s}

/* ─ 章 ───────────────────────────────────────────────────── */
.ch{position:relative; border-top:1px solid var(--line);
  padding:clamp(28px,6vh,56px) 0 clamp(40px,9vh,90px)}
.ch::after{content:''; display:block; clear:both}

/* **章の頭を左上に浮かせて、本文をそのまわりに回す**
   （2026-09-15、本人：「教科書の章はじめとか、左上の章タイトルと、
   それを囲むように文字が配置されてるでしょ。あんな感じ」）。
   `float` なので、**文字のほうが避けて流れる**——枠を切って並べるのとは形が違う。

   **幅は決め打ちにしない**（同日、本人：「今ある隙間詰めていい。タイトルと文章の」）。
   浮かせた箱は中身の幅に縮むので、決め打ちにすると
   **題より広いぶんが、そのまま隙間になる。**それが空いて見えていた。
   題が長い章は二行に折り返してよい——**折り返すほうが、空きを抱えているより詰まって見える** */
.head{float:left; max-width:clamp(120px,15vw,168px);
  margin:0 clamp(8px,1vw,12px) clamp(3px,.5vh,6px) 0}
.ch h2{margin:.5em 0 0; font-size:clamp(12px,1.4vw,14px); letter-spacing:.24em; color:var(--dim);
  font-weight:400; line-height:1.7}

/* 発光する印。**押すところ**。章の頭に、題と並べて置く */
.ico{width:clamp(44px,5vw,58px); height:clamp(44px,5vw,58px);
  display:flex; align-items:center; justify-content:center;
  border:1px solid var(--dim); background:var(--bg2); color:var(--hot);
  font-size:clamp(17px,2vw,22px); cursor:pointer; user-select:none;
  animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(125,240,164,.00), 0 0 10px 0 rgba(125,240,164,.18) inset;
           border-color:var(--dim) }
  50%    { box-shadow:0 0 22px 2px rgba(125,240,164,.38), 0 0 18px 0 rgba(125,240,164,.30) inset;
           border-color:var(--on) }
}
.ico:hover{border-color:var(--hot); color:#fff}
.ch.on .ico{animation:none; border-color:var(--line); color:var(--dim2); box-shadow:none}
/* 章でも**近づくと反応する**。印に触れているあいだ、壁が薄れる。
   `:has()` を使うのは、印が `.head` の中にいて `.raw` の兄弟ではないから */
.ch:not(.on) .head:has(.ico:hover) ~ .raw .ln,
.ch:not(.on) .head:has(.ico:focus-visible) ~ .raw .ln{opacity:.4; filter:blur(1.2px)}
.ico b{font-weight:400; pointer-events:none}

/* ─ 生の本文。**読みにくいまま置く** ─────────────────────── */
/* 高さを畳むのは**字が消えはじめてから**（.22s 遅らせる）。
   同時に始めると、外枠が縮むほうが速くて、字が畳まれる様子が見えない。

   **`overflow:hidden` は付けない。**付けると新しい整形文脈ができて、
   **左に浮かせた章の頭に文字が回り込まなくなる**（箱ごと横に避けてしまう）。
   はみ出すぶんは、そのころには字が透明になっているので見えない */
.raw{transition:max-height .7s cubic-bezier(.3,.7,.2,1) .22s}
.ch.on .raw{pointer-events:none}
/* **段に切らない**（本人：「二段にすらしなくていい」「行数減ってもいいから」）。
   一本の流れにして、**両端をそろえて詰める。**字間も行間も削る——
   段に切ると隙間が一本できて、そのぶん「みちみち」でなくなる */
.raw .col{text-align:justify; text-justify:inter-character;
  font-size:clamp(10.5px,1.02vw,12px); line-height:1.62; letter-spacing:-.01em}
.raw .p{margin:0 0 .8em}
/* 畳む単位は**一文**。行ではなく文で消えていく（行は流れて決まるので掴めない） */
.raw .ln{transition:opacity .34s ease, filter .34s ease}
.raw .ln:nth-child(3n){color:var(--dim2)}   /* **むらを作る**。均一だと壁に見えない */
.ch.on .raw .ln{opacity:0; filter:blur(2px)}

/* ─ 収束した文 ─────────────────────────────────────────── */
/* **カードを捨てた**（2026-09-15、本人：「いっそカードを捨てるか」）。
   白い面・角丸・影・角ゴシック——**別の世界に移す作りを全部やめた。**
   同じ黒地の上で、**字がその場で収束する**だけにする。
   これで、先頭の手本（字が消えて社名が明るくなる）と章が**同じ動き**になる。
   前の形（白いカード）は 009 に寄せたもので、悪くはなかったが
   **押した先が初見になる**（2026-09-15、本人：「違いすぎてびっくりしそう」）。

   **出ていないあいだは場所も取らない**（`display:none`）。
   opacity だけで隠すと、壁の下に一枚ぶんの空白が居座る。
   `display` は動かせないので、出すときは JS で先に置いてから `.on` を付ける。

   **`clear` を外した。**面が無くなったので、白い板のときと違って
   **章の頭に回り込める**——壁と同じところに、同じ形で現れる。
   同じ理由で `z-index` も外した。**走査線の下に戻す**——
   別世界ではないので、同じ縞がかかっているほうが正しい */
.card{display:none; opacity:0; transition:opacity .55s ease .28s;
  padding:0 0 clamp(10px,1.4vh,18px)}
.ch.on .card{opacity:1}
.card .k{font-size:clamp(9.5px,1vw,11px); letter-spacing:.3em; color:var(--dim);
  padding-bottom:1em}
.card .lead{margin:0; font-size:clamp(15px,1.9vw,21px); line-height:1.66;
  color:var(--hot); letter-spacing:.02em; text-shadow:0 0 18px rgba(125,240,164,.16)}
/* **grid も flex も使わない。**新しい整形文脈ができて、章の頭に回り込まなくなる */
.card ul{list-style:none; margin:1.5em 0 0; padding:0}
/* 印は**絶対位置で置かない。**章の頭に回り込むと行だけが右へ逃げて、
   印が左端に取り残される。字下げで置けば、印も行と一緒に動く */
.card li{padding-left:1.6em; text-indent:-1.6em; margin-bottom:.55em;
  font-size:clamp(12px,1.25vw,14px); line-height:1.8; color:var(--on)}
.card li::before{content:'—\3000'; color:var(--dim)}
/* まだ出ていない行・字。**消さずに隠す**——消すと出るたびに下が持ち上がって、行が踊る */
.card .wait{visibility:hidden}
/* **点けるのではなく、暗がりから浮かせる**（2026-09-15、本人：「あーでも硬いな」）。
   出る／出ないの二値だと、行がカチカチと入れ替わる。
   色だけを動かす——**位置も字も変えないので、震えは戻らない。**
   隠すのも透明な字にしておく（場所は取ったまま）。
   動きが走らない場でも、**行き先は普通の色**なので、そのまま読める形で出る */
.card span{transition:color .55s ease, text-shadow .55s ease}
/* 影も消す。**透明な字でも影は出る**ので、光の染みだけが先に見えてしまう */
.card .h{color:transparent; text-shadow:none}
.card li::before{transition:color .55s ease}
.card li.pre::before{color:transparent}
.card .foot{margin-top:1.9em; font-size:clamp(11px,1.15vw,12.5px)}
.card .back{background:none; border:0; font:inherit; color:var(--dim); cursor:pointer; padding:0;
  letter-spacing:.06em}
.card .back:hover{color:var(--on)}
/* ここが**仮**（本人：「カードにした後についてはまだ決めてない……仮で適当に」）。
   いまは戻せるだけ。次に何を置くかは決まっていない。
   ——一度「（このあとどうするかは、まだ決めていない）」と**画面に書いた。消した。**
   あれは**こちらから本人への申し送り**であって、サイトを見る人には意味がない。
   仮であることは NOTES に書けば足りる */

footer{border-top:1px solid var(--line); padding:clamp(40px,8vh,80px) 0 clamp(60px,12vh,120px);
  font-size:clamp(10px,1.2vw,12px); color:var(--dim2); line-height:2.2}
footer a{color:var(--dim); text-decoration:none; border-bottom:1px solid var(--line)}
footer a:hover{color:var(--on)}

@media (max-width:760px){
  .head{max-width:clamp(96px,28vw,132px); margin-right:clamp(8px,2vw,12px)}
  .raw .col{font-size:11px; line-height:1.66}
}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>

<script>
/* ─ 章の中身 ────────────────────────────────────────────────
   `raw` が**読みにくいまま置く壁**、`card` が**畳んだあとの一枚**。
   raw は行ごとに分けて畳むので、**改行がそのまま畳む単位**になる。

   **膨らませたのは考え方だけ。**公式に出ている言葉（理念の四段落、サービスの四項目、
   会社概要）を土台に、その言い分を延ばしている。
   **実績・数字・取引先・事例は一つも作っていない。** */
var CHS = [
  { key:'mind', icon:'◆', title:'企業理念',
    raw:
`経営の力で「遊ぶように働く世界」をデザインする。
これが当社の企業理念であり、事業のすべてがここから出ている。
「遊ぶように働く」とは、楽をすることではない。
人が夢中になり、自発的に創造する状態で働くことを指している。
子供が遊びに没頭するように、大人も「やらされる」ではなく
「やりたい」仕事に向き合うこと。
そのような働き方が自然に生まれる組織を、
経営の意思と創造の力で意図的に構想し、設計していく。
それが「経営の力で遊ぶように働く世界をデザインする」という
当社の企業理念の本質である。

ここで言う「意図的に」は、言葉の綾ではない。
夢中は、放っておいて生まれるものではないからだ。
働く人が自分で決められる範囲が狭いまま、
決めごとだけが増えていく組織で、夢中は起こらない。
何をやってよいかが曖昧なまま、責任だけが個人に降りる組織でも起こらない。
夢中が起こる場所には、たいてい共通した条件がある。
自分の手で動かせる範囲があること。
動かした結果が、ほどよい早さで返ってくること。
失敗しても、致命的ではないこと。
そして、その仕事が何のためにあるかを、本人が言えること。
この四つは、精神論ではなく設計の対象である。

私たちが「経営の力で」と言うのは、
これらの条件が、現場の努力では作れないからだ。
権限の配り方、評価の向き、情報の見え方、決裁の段数。
どれも経営が決めている。
だから、働き方を変えるという話は、
つきつめると経営が何を決めているかという話になる。
道具を入れれば変わる、という考え方を私たちは取らない。
道具は、決め方が変わったあとに効いてくる。

同時に、私たちは理念を掲げるだけの会社ではない。
考え方は、形にならなければ検証できない。
だから私たちは、組織のあり方を語ると同時に、
その組織が実際に使うシステムを作る。
語ることと作ることを同じ会社の中に置いているのは、
そのあいだで嘘がつけないようにするためだ。

/* ─ 組み立て ────────────────────────────────────────────────
   raw は**一行ずつ span に分ける。**畳むときに一行ずつ消したいので、
   改行がそのまま**畳む単位**になる */
var host = document.getElementById('chs');
host.innerHTML = CHS.map(function(c){
  /* **改行では切らない。**空行で段落に割り、段落の中は一続きにして、
     **文（。）で span に分ける**——畳むときの単位が「文」になる。
     行は幅で決まるので掴めないが、文なら掴める */
  var lines = c.raw.split(/\n{2,}/).map(function(para){
    var body = para.replace(/\n/g, '').split('。')
      .filter(function(t){ return t !== ''; })
      .map(function(t, i, a){
        return '<span class="ln">' + esc(t) + (i < a.length - 1 || /。$/.test(para) ? '。' : '') + '</span>';
      }).join('');
    return '<p class="p">' + body + '</p>';
  }).join('');
  var pts = c.card.points.map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('');
  return ''
    + '<section class="ch" data-k="' + c.key + '">'
    +   '<div class="head">'
    +     '<div class="ico" role="button" tabindex="0" aria-label="' + c.title + 'をまとめる">'
    +       '<b>' + c.icon + '</b></div>'
    +     '<h2>' + esc(c.title) + '</h2>'
    +   '</div>'
    +   '<div class="raw"><div class="col">' + lines + '</div></div>'
    +   '<div class="card">'
    +     '<div class="k">' + c.card.k + '</div>'
    +     '<p class="lead">' + esc(c.card.lead) + '</p>'
    +     '<ul>' + pts + '</ul>'
    +     '<div class="foot"><button class="back">← もとの文にもどす</button></div>'
    +   '</div>'
    + '</section>';
}).join('');

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ─ 畳む／ひらく ────────────────────────────────────────────
   **外から内へ順に消す。**端から順だと「上から流れた」に見えるが、
   まとまる感じにならない。中心へ寄せると「集まった」に見える */
/* ─ 上から順に出す ────────────────────────────────────────
   **化けるのはやめた**（2026-09-15、本人：「これモーション自体が**列で揺れてる**からそう見えるのか。
   **単純に読みにくいかも**」）。
   一字ずつ毎こま別の字に入れ替えていたので、**行がガタガタ震えて**いた。
   震えの正体は「**読めない字が動いている**」ことなので、回数を落としても質は変わらない。
   → **行が上から順に点いていくだけ。**押したことと結果の繋がりは、これで足りる。

   **一字ずつ span に分ける**のは残す。行ごとにまとめて出したいので、
   どの字がどの行にいるかを測れるようにしておく（行は幅で決まるので、出す直前に測る） */
function cells(el){
  if (el._cs) return el._cs;
  var t = el.getAttribute('data-t');
  if (t === null){ t = el.textContent; el.setAttribute('data-t', t); }
  el.textContent = '';
  var cs = [];
  for (var i = 0; i < t.length; i++){
    var sp = document.createElement('span');
    sp.textContent = t.charAt(i);
    el.appendChild(sp);
    cs.push(sp);
  }
  el._cs = cs;
  return cs;
}
/* いまの行組みで、**同じ高さの字をひとまとめ**にする */
function rowsOf(el){
  var cs = cells(el), rows = [], last = null;
  cs.forEach(function(sp, i){
    var y = sp.offsetTop;
    if (last === null || y !== last){ rows.push([]); last = y; }
    rows[rows.length - 1].push(i);
  });
  return rows;
}
function plainEl(el){
  el._seq = (el._seq || 0) + 1;
  if (el._cs) el._cs.forEach(function(sp){ sp.classList.remove('h'); });
  el.classList.remove('wait');
  el.classList.remove('pre');
}
function resolve(ch, el, rows, step){
  var cs = cells(el), run = ch.dataset.run, my = el._seq = (el._seq || 0) + 1;
  cs.forEach(function(sp){ sp.classList.add('h'); });
  /* 箇条の「—」も一緒に浮かせる。ここだけ先に点くと、そこが硬く見える */
  el.classList.add('pre');
  el.classList.remove('wait');
  rows.forEach(function(row, r){
    setTimeout(function(){
      if (ch.dataset.run !== run || el._seq !== my) return;
      if (!r) el.classList.remove('pre');
      row.forEach(function(i){ cs[i].classList.remove('h'); });
    }, r * step);
  });
}
/* 動きを止める設定のときは、**読める形をそのまま出す** */
var STILL = matchMedia('(prefers-reduced-motion:reduce)').matches;
function settle(ch, back){
  var els = [].slice.call(ch.querySelectorAll('.card .k, .card .lead, .card li'));
  var foot = ch.querySelector('.card .foot');
  if (back || STILL){
    els.forEach(plainEl);
    if (foot) foot.classList.remove('wait');
    return;
  }

  /* **上から下へ、一行ずつ**（2026-09-15、本人：「上から下の方がいいかも」）。
     まだの字は**隠すだけで場所は取る**——消すと、点くたびに下が持ち上がる */
  ch.dataset.run = String(Date.now());
  var run = ch.dataset.run;
  els.forEach(plainEl);
  /* **先に全部測る。**隠してから測ると行組みが変わりかねないので、読める形のまま測る */
  var plan = els.map(function(el){ return { el: el, rows: rowsOf(el) }; });
  els.forEach(function(el){ el.classList.add('wait'); });
  /* 「もどす」も**最後まで出さない。**読み終わる前に出口が見えていると、そこに目が行く */
  if (foot) foot.classList.add('wait');

  /* **全体の長さで一行あたりを決める。**窓が狭いと行数が倍になるので、
     一行いくらで固定すると**待ち時間だけが伸びる**。
     **時刻で組む。**「終わったら次」だと、描画が走らない場で
     そこから先が永久に出てこない——隠してあるので、消えたのと同じになる */
  var total = plan.reduce(function(n, p){ return n + p.rows.length; }, 0) || 1;
  /* 浮かび上がりは 0.55 秒かかるので、間隔はそれより短くてよい——
     **重なったほうが、一続きの流れ**に見える（間が空くと、また硬くなる） */
  var step = Math.max(70, Math.min(150, Math.round(1200 / total)));
  var at = 200;
  plan.forEach(function(p){
    setTimeout(function(){
      if (ch.dataset.run !== run) return;
      resolve(ch, p.el, p.rows, step);
    }, at);
    at += p.rows.length * step;
  });
  /* 最後は必ず読める形に。隠れたままにならないようにする念押し */
  setTimeout(function(){
    if (ch.dataset.run !== run) return;
    els.forEach(plainEl);
    if (foot) foot.classList.remove('wait');
  }, at + 160);
}

function fold(ch){
  if (ch.classList.contains('on')) return;
  var raw = ch.querySelector('.raw'), card = ch.querySelector('.card');
  var lns = [].slice.call(ch.querySelectorAll('.ln'));
  var mid = Math.max(1, (lns.length - 1) / 2);
  lns.forEach(function(el, i){
    /* **外の行から先に消して、真ん中を最後に残す。**
       端から順に消すと「上から流れた」に見えて、集まった感じにならない */
    el.style.transitionDelay = Math.round((1 - Math.abs(i - mid) / mid) * 280) + 'ms';
  });
  /* いまの高さを**数字で押さえてから** 0 へ。`auto` のままだと動かない */
  raw.style.maxHeight = raw.scrollHeight + 'px';
  /* カードは先に置いてから `.on`。`display` は動かせないので、
     置いた直後に一度レイアウトを取らないと、出る動きが走らない */
  card.style.display = 'block';
  void raw.offsetHeight;
  ch.classList.add('on');
  raw.style.maxHeight = '0px';
  settle(ch, false);
}
function unfold(ch){
  if (!ch.classList.contains('on')) return;
  var raw = ch.querySelector('.raw'), card = ch.querySelector('.card');
  ch.classList.remove('on');
  [].slice.call(ch.querySelectorAll('.ln')).forEach(function(el, i){
    el.style.transitionDelay = (i * 3) + 'ms';   /* 戻りは上から順に。読み直す向き */
  });
  ch.dataset.run = '';          /* 走っている収束を降ろす */
  settle(ch, true);             /* 次に開いたとき、読める形から始める */
  raw.style.maxHeight = raw.scrollHeight + 'px';
  setTimeout(function(){
    raw.style.maxHeight = '';
    card.style.display = 'none';
  }, 900);
}

document.addEventListener('click', function(e){
  var ico = e.target.closest && e.target.closest('.ico');
  if (ico){ fold(ico.closest('.ch')); return; }
  var back = e.target.closest && e.target.closest('.back');
  if (back){ unfold(back.closest('.ch')); }
});
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var ico = e.target.closest && e.target.closest('.ico');
  if (!ico) return;
  e.preventDefault();
  /* 先頭の印は章に属していない。**同じ鍵で同じことが起きる**ようにしておく */
  if (ico.classList.contains('heroico')){ ico.click(); return; }
  fold(ico.closest('.ch'));
});

/* はじめは畳まれていない。**壁のまま**置いておく */
[].slice.call(document.querySelectorAll('.raw')).forEach(function(r){ r.style.maxHeight = ''; });

  '株式会社アルターデザインコンサルティング','2025 年 6 月','経営の力で','デザインする'
];
(function(){
  /* 決まった順で並べる（毎回ちがうと、直すときに同じ絵が出せない）。
     **下の桁は使わない**——最初これで作ったら、同じ語ばかり並んで
     「壊れた画面」に見えた。上の桁を取ると散る */
  function fill(el, n, seed){
    var h = '', k = seed >>> 0;
    for (var i = 0; i < n; i++){
      k = (k * 1664525 + 1013904223) >>> 0;
      h += '<span class="ln">' + BITS[(k >>> 17) % BITS.length] + '　</span>';
    }
    el.innerHTML = h;
  }
  fill(document.getElementById('noiseA'), 46, 7);
  fill(document.getElementById('noiseB'), 58, 31);
})();

var hero = document.getElementById('hero');
function heroFold(){
  if (hero.classList.contains('on')) return;
  var lns = [].slice.call(hero.querySelectorAll('.noise .ln'));
  var mid = Math.max(1, (lns.length - 1) / 2);
  lns.forEach(function(el, i){
    el.style.transitionDelay = Math.round((1 - Math.abs(i - mid) / mid) * 280) + 'ms';
  });
  [].slice.call(hero.querySelectorAll('.noise')).forEach(function(n){
    n.style.maxHeight = n.scrollHeight + 'px';
  });
  void hero.offsetHeight;
  hero.classList.add('on');
  [].slice.call(hero.querySelectorAll('.noise')).forEach(function(n){ n.style.maxHeight = '0px'; });
}
function heroUnfold(){
  if (!hero.classList.contains('on')) return;
  hero.classList.remove('on');
  [].slice.call(hero.querySelectorAll('.noise .ln')).forEach(function(el, i){
    el.style.transitionDelay = (i * 3) + 'ms';
  });
  [].slice.call(hero.querySelectorAll('.noise')).forEach(function(n){
    n.style.maxHeight = n.scrollHeight + 'px';
    setTimeout(function(){ n.style.maxHeight = ''; }, 900);
  });
}
/* 押せば何度でも見られる。**気づいた人が確かめられる**ように */
hero.querySelector('.heroico').addEventListener('click', function(){
  hero.classList.add('taught');   /* 一度押されたら、案内は引っ込める */
  hero.classList.contains('on') ? heroUnfold() : heroFold();
});

/* **自動では畳まない**（2026-09-15、本人：「勝手に閉じられるとわからん」）。
   こちらがやってしまうと、**自分にできることだと分からない**。
   代わりに二つ——
     **一度だけ身じろぎする**（2.2 秒。字がふっと薄くなって戻る）。
       畳みきらないので「何か起きた」だけが残り、**やるのは相手**のまま
     **近づくと反応する**（印に触れているあいだ、まわりの字が薄れる。CSS 側）
   動きを止める設定のときは身じろぎも起きないので、**読める形で始める** */
if (matchMedia('(prefers-reduced-motion:reduce)').matches){
  heroFold();
} else {
  setTimeout(function(){
    var ic = hero.querySelector('.heroico');
    ic.classList.add('flash');
    hero.classList.add('twitch');
    setTimeout(function(){
      hero.classList.remove('twitch');
      ic.classList.remove('flash');
    }, 620);
  }, 2200);
}
</script>
