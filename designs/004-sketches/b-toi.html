<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B｜正解のない問い・評価軸が動く</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.8 "Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
     color:#16191f;background:#fff}
.bar{border-bottom:1px solid #e2e5ea;padding:8px 20px;font-size:12px;color:#5c636e;display:flex;gap:16px}
.bar a{color:#5c636e}
.wrap{max-width:820px;margin:0 auto;padding:56px 24px}
.axis{font-size:12px;color:#5c636e;border:1px solid #e2e5ea;padding:8px 12px;margin-bottom:36px;
      display:flex;gap:10px;align-items:baseline;transition:background .3s}
.axis b{color:#b45309;font-weight:600}
.axis.moved{background:#fff8f0;border-color:#e8c99a}
.q{margin-bottom:44px}
.q .n{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#a8afba}
.q h2{font-size:19px;font-weight:600;margin:4px 0 18px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{border:1px solid #e2e5ea;padding:16px 18px;cursor:pointer;background:#fff;text-align:left;
     font:inherit;transition:border-color .15s}
.opt:hover{border-color:#b45309}
.opt .lbl{font-weight:600;display:block;margin-bottom:6px}
.opt .sub{font-size:13px;color:#5c636e;line-height:1.7}
.opt[disabled]{cursor:default;opacity:.45}
.opt.picked{border-color:#b45309;border-width:2px;padding:15px 17px;opacity:1}
.cost{margin-top:14px;font-size:13px;border-left:2px solid #b45309;padding:4px 0 4px 14px;color:#5c636e}
.cost b{color:#16191f;font-weight:600}
.hidden{display:none}
.result{border-top:1px solid #e2e5ea;padding-top:32px;margin-top:8px}
.result h3{font-size:13px;color:#5c636e;font-weight:400;margin-bottom:16px}
.ledger{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #e2e5ea}
.ledger>div{padding:16px 18px}
.ledger>div:first-child{border-right:1px solid #e2e5ea}
.ledger h4{font-size:12px;font-weight:400;color:#5c636e;margin-bottom:10px}
.ledger li{list-style:none;font-size:14px;padding:3px 0}
.ledger .got b{color:#b45309}
.close{margin-top:22px;font-size:14px;color:#5c636e;line-height:1.9}
.close b{color:#16191f}
</style>
</head>
<body>

<div class="bar">
  <a href="./">← スケッチ一覧</a>
  <span>B｜要素 17・18 — 正解が一つに決まらない問い／選択で評価軸そのものが書き換わる</span>
</div>

<div class="wrap">

  <div class="axis" id="axis">
    <span>いまの評価軸：</span><b id="axisText">まだ決まっていません</b>
  </div>

  <div id="qs"></div>

  <div class="result hidden" id="result">
    <h3>採点はしません。あなたが決めたのは、こういうことです。</h3>
    <div class="ledger">
      <div class="got"><h4>手に入れたもの</h4><ul id="got"></ul></div>
      <div class="lost"><h4>その代わりに捨てたもの</h4><ul id="lost"></ul></div>
    </div>
    <p class="close" id="close"></p>
  </div>

</div>

<script>
// 17: どちらを選んでも代償がある。18: Q1 の選択が Q2 以降の評価軸を書き換える。
const AXES = {
  speed: { name: '早く出すこと', close:'あなたは速さを取りました。速さを取ると、決め切らないまま走ります。上流の仕事は「決めない」と決めることでもあります。' },
  rigor: { name: '間違えないこと', close:'あなたは確かさを取りました。確かさを取ると、動くものが後になります。動かないものは、間違いを教えてくれません。' }
};
let axis = null;
const got = [], lost = [];

const QS = [
  { q:'この業務、まだ現場のやり方が固まっていません。どちらから始めますか。',
    a:{ l:'とりあえず動くものを出す', s:'触ってもらってから決める。',
        get:'現場の反応', pay:'作り直しが確実に発生する', set:'speed' },
    b:{ l:'先に決め切ってから作る', s:'関係者を集めて合意を取る。',
        get:'合意の重み', pay:'決めている間に前提が変わる', set:'rigor' } },

  { q:'承認者が不在のとき、申請はどうなりますか。',
    a:{ l:'止める', s:'戻ってくるまで待つ。',
        get:'責任の所在が動かない', pay:'月末に業務が詰まる' },
    b:{ l:'代理に回す', s:'代理者へ自動で振る。',
        get:'業務が止まらない', pay:'誰が承認したか曖昧になる' } },

  { q:'仕様が変わりました。誰が直しますか。',
    a:{ l:'作った側が直す', s:'依頼を受けて対応する。',
        get:'品質が保たれる', pay:'変更のたびに待ち時間が生まれる' },
    b:{ l:'使う側が直せるようにする', s:'現場が自分で変えられる形にする。',
        get:'その場で直る', pay:'全体の一貫性が崩れていく' } }
];

const qs = document.getElementById('qs');
let cur = 0;

function render(){
  const item = QS[cur];
  const el = document.createElement('div');
  el.className = 'q';
  el.innerHTML = '<span class="n">問 ' + (cur+1) + ' / ' + QS.length + '</span><h2></h2>'
    + '<div class="opts"></div><div class="cost hidden"></div>';
  el.querySelector('h2').textContent = item.q;
  const box = el.querySelector('.opts');
  ['a','b'].forEach(k => {
    const o = item[k];
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="lbl"></span><span class="sub"></span>';
    b.querySelector('.lbl').textContent = o.l;
    b.querySelector('.sub').textContent = o.s;
    b.onclick = () => pick(el, item, k);
    box.appendChild(b);
  });
  qs.appendChild(el);
}

function pick(el, item, k){
  const o = item[k];
  el.querySelectorAll('.opt').forEach((b, i) => {
    b.disabled = true;
    if ((i === 0 && k === 'a') || (i === 1 && k === 'b')) b.classList.add('picked');
  });
  got.push(o.get); lost.push(o.pay);

  const c = el.querySelector('.cost');
  c.classList.remove('hidden');
  c.innerHTML = '<b>' + o.get + '</b> が手に入りました。その代わり、<b>' + o.pay + '</b>。';

  // 18: 最初の選択が、以降の評価軸を書き換える
  if (o.set){
    axis = o.set;
    const a = document.getElementById('axis');
    document.getElementById('axisText').textContent = AXES[axis].name;
    a.classList.add('moved');
    setTimeout(() => a.classList.remove('moved'), 900);
  }

  cur++;
  if (cur < QS.length) setTimeout(render, 700);
  else setTimeout(done, 900);
}

function done(){
  const r = document.getElementById('result');
  r.classList.remove('hidden');
  document.getElementById('got').innerHTML  = got.map(t => '<li>' + t + '</li>').join('');
  document.getElementById('lost').innerHTML = lost.map(t => '<li>' + t + '</li>').join('');
  document.getElementById('close').innerHTML =
    AXES[axis].close + '<br><b>どれも間違いではありません。上流の仕事は、正解を当てることではなく、'
    + '何を捨てたかを全員が分かっている状態を作ることです。</b>';
  r.scrollIntoView({behavior:'smooth', block:'start'});
}

render();
</script>
</body>
</html>
