<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A｜空の入力欄・会話・キーのみ</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.8 "Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
     color:#16191f;background:#fff;min-height:100vh;display:flex;flex-direction:column}
.bar{border-bottom:1px solid #e2e5ea;padding:8px 20px;font-size:12px;color:#5c636e;display:flex;gap:16px}
.bar a{color:#5c636e}
.wrap{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
      max-width:760px;width:100%;margin:0 auto;padding:40px 24px 0}
.log{display:flex;flex-direction:column;gap:18px;padding-bottom:24px}
.turn{display:grid;grid-template-columns:20px 1fr;gap:12px}
.turn .p{font-family:ui-monospace,Consolas,monospace;color:#b45309;line-height:1.8}
.turn.ai .p{color:#a8afba}
.turn .t{white-space:pre-wrap}
.turn.ai .t{color:#16191f}
.built{border:1px solid #e2e5ea;margin-top:8px}
.built h4{font-size:11px;font-weight:400;color:#5c636e;padding:6px 10px;border-bottom:1px solid #e2e5ea;background:#fafbfc}
.built ul{list-style:none;padding:10px}
.built li{font-size:13px;padding:3px 0;color:#16191f}
.built li b{font-weight:600;color:#b45309;font-family:ui-monospace,Consolas,monospace;font-size:12px;margin-right:8px}
.input{border-top:1px solid #e2e5ea;background:#fff;position:sticky;bottom:0;
       max-width:760px;width:100%;margin:0 auto;padding:14px 24px 22px}
.inline{display:grid;grid-template-columns:20px 1fr;gap:12px;align-items:baseline}
.inline .p{font-family:ui-monospace,Consolas,monospace;color:#b45309}
#in{border:0;outline:0;font:inherit;width:100%;background:transparent;color:#16191f}
#in::placeholder{color:#c2c8d0}
.hint{font-size:11px;color:#a8afba;margin-top:8px;padding-left:32px}
.blink{display:inline-block;width:7px;height:16px;background:#b45309;vertical-align:-3px;animation:b 1.1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
.first{color:#5c636e;padding-bottom:8px}
</style>
</head>
<body>

<div class="bar">
  <a href="./">← スケッチ一覧</a>
  <span>A｜要素 12・13・58・60・61 — 空の入力欄／本当に返る／キーのみ／ターミナル／会話</span>
</div>

<div class="wrap">
  <div class="log" id="log">
    <p class="first">仕様をここに書いてください。<span class="blink"></span></p>
  </div>
</div>

<div class="input">
  <div class="inline">
    <span class="p">›</span>
    <input id="in" autocomplete="off" placeholder="例：経費を申請して、上長が承認する">
  </div>
  <div class="hint">Enter で送信。マウスは要りません。</div>
</div>

<script>
// --- 13（本当に返す）の差し替え口 ------------------------------------
// 本番ではここをサーバ経由の API 呼び出しに置き換える。
// ブラウザに API キーは置けないので、必ず自前のエンドポイントを挟むこと。
//   const r = await fetch('/api/generate', {method:'POST', body: JSON.stringify({text})});
//   return await r.json();
// いまはローカルの疑似応答。返す「形」は本番と同じにしてある。
async function generate(text){
  const has = w => text.includes(w);
  const parts = [];
  if (has('経費')||has('申請')) parts.push(['画面','申請フォーム']);
  if (has('承認')||has('上長')||has('上司')) parts.push(['ルール','上長の承認を経て確定する']);
  if (has('金額')||has('円')) parts.push(['ルール','金額により承認者が変わる']);
  if (has('休暇')||has('勤怠')) parts.push(['画面','勤怠カレンダー']);
  if (has('顧客')||has('案件')) parts.push(['テーブル','案件']);
  if (parts.length === 0) parts.push(['画面','入力フォーム']);
  parts.push(['テーブル','申請']);
  const ask = has('承認') ? null : '承認は要りますか。要る場合、誰が承認しますか。';
  return { parts, ask };
}
// ---------------------------------------------------------------------

const log = document.getElementById('log');
const inp = document.getElementById('in');
let asked = false;

function turn(who, text){
  const d = document.createElement('div');
  d.className = 'turn' + (who === 'ai' ? ' ai' : '');
  d.innerHTML = '<span class="p">' + (who === 'ai' ? '·' : '›') + '</span><div class="t"></div>';
  d.querySelector('.t').textContent = text;
  log.appendChild(d);
  window.scrollTo(0, document.body.scrollHeight);
  return d.querySelector('.t');
}

function built(el, parts){
  const box = document.createElement('div');
  box.className = 'built';
  box.innerHTML = '<h4>決めたことが、そのまま形になったもの</h4><ul></ul>';
  const ul = box.querySelector('ul');
  el.appendChild(box);
  parts.forEach((p, i) => setTimeout(() => {
    const li = document.createElement('li');
    li.innerHTML = '<b>' + p[0] + '</b>' + p[1];
    ul.appendChild(li);
    window.scrollTo(0, document.body.scrollHeight);
  }, 180 * (i + 1)));
}

async function send(){
  const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  turn('me', text);
  const res = await generate(text);
  const t = turn('ai', '');
  const line = res.ask && !asked
    ? '決まっている分を形にしました。'
    : 'できました。ここまでが、あなたが決めたことです。';
  let i = 0;
  const iv = setInterval(() => {
    t.textContent = line.slice(0, ++i);
    if (i >= line.length){
      clearInterval(iv);
      built(t, res.parts);
      if (res.ask && !asked){
        asked = true;
        setTimeout(() => turn('ai', res.ask), 180 * (res.parts.length + 2));
      }
    }
  }, 22);
}

inp.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
// キーのみ：どこを押してもフォーカスは入力欄に戻る
addEventListener('keydown', () => inp.focus());
inp.focus();
</script>
</body>
</html>
