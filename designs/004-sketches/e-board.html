<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E｜横に広がる付箋ボード</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font:15px/1.7 "Helvetica Neue",Arial,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
     color:#16191f;background:#fff;display:flex;flex-direction:column}
.bar{border-bottom:1px solid #e2e5ea;padding:8px 20px;font-size:12px;color:#5c636e;display:flex;gap:16px;flex:0 0 auto}
.bar a{color:#5c636e}
.bar .r{margin-left:auto;font-family:ui-monospace,Consolas,monospace}

.viewport{flex:1;overflow:hidden;position:relative;background:
  radial-gradient(#e6e9ee 1px,transparent 1px);background-size:22px 22px}
.board{position:absolute;top:0;left:0;height:100%;width:2700px;transition:transform .45s cubic-bezier(.3,.8,.3,1)}

.zone{position:absolute;top:0;bottom:0;border-right:1px dashed #d8dde4}
.zone .zh{position:absolute;top:20px;left:28px;font-size:12px;color:#a8afba;letter-spacing:.08em}
.zone .zh b{display:block;font-size:16px;color:#5c636e;font-weight:600;letter-spacing:0;margin-top:2px}
#z0{left:0;width:900px}
#z1{left:900px;width:900px;background:rgba(180,83,9,.03)}
#z2{left:1800px;width:900px;border-right:0}

.note{position:absolute;width:180px;min-height:96px;padding:14px 14px 12px;background:#fff6cc;
      box-shadow:2px 3px 0 rgba(0,0,0,.07);cursor:grab;font-size:14px;line-height:1.55;
      user-select:none;touch-action:none;transition:box-shadow .15s,background .3s}
.note:active{cursor:grabbing;box-shadow:6px 8px 0 rgba(0,0,0,.1)}
.note .tag{display:block;font-size:10px;color:#8a7a3d;letter-spacing:.1em;margin-bottom:5px}
.note.kept{background:#e8f0e6}
.note.dropped{background:#eceff3;color:#a8afba;text-decoration:line-through}

.out{position:absolute;right:0;top:0;bottom:0;width:300px;background:#fff;border-left:1px solid #e2e5ea;
     padding:20px;overflow:auto;z-index:5}
.out h3{font-size:11px;color:#5c636e;font-weight:400;letter-spacing:.1em;margin-bottom:14px}
.out ul{list-style:none}
.out li{font-size:13px;padding:7px 0;border-bottom:1px solid #f0f2f5;animation:in .3s ease both}
.out li b{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#b45309;margin-right:8px}
@keyframes in{from{opacity:0;transform:translateX(8px)}}
.out .empty{font-size:13px;color:#c2c8d0}
.out .hole{font-size:12px;color:#a8afba;border-bottom:1px dashed #e2e5ea;padding:7px 0}
.hint{position:absolute;left:0;right:0;bottom:0;padding:8px 20px;font-size:11px;color:#a8afba;
      background:#fff;border-top:1px solid #e2e5ea;z-index:6}
</style>
</head>
<body>

<div class="bar">
  <a href="./">← スケッチ一覧</a>
  <span>E｜要素 57・64 — 横に広がるボード。付箋を掴んで置く</span>
  <span class="r" id="pos">1 / 3</span>
</div>

<div class="viewport" id="vp">
  <div class="board" id="board">

    <div class="zone" id="z0"><div class="zh">01<b>まだ決めていない</b></div></div>
    <div class="zone" id="z1"><div class="zh">02<b>決めた</b></div></div>
    <div class="zone" id="z2"><div class="zh">03<b>今回はやらない</b></div></div>

  </div>

  <aside class="out">
    <h3>出てくるもの</h3>
    <ul id="outList"><li class="empty">まだ何も決まっていません。</li></ul>
  </aside>

  <div class="hint">付箋をドラッグして「決めた」か「今回はやらない」へ。← → でボードを横に動かせます。</div>
</div>

<script>
const NOTES = [
  { t:'経費を申請する画面',   tag:'画面',   x: 60, y:110 },
  { t:'上長が承認する',       tag:'ルール', x:270, y:180 },
  { t:'金額で承認者が変わる', tag:'ルール', x:480, y:120 },
  { t:'承認者が不在のとき',   tag:'ルール', x: 90, y:290 },
  { t:'申請の履歴を残す',     tag:'テーブル',x:300, y:370 },
  { t:'スマホから申請する',   tag:'画面',   x:520, y:320 },
  { t:'差し戻しできる',       tag:'ルール', x:130, y:460 }
];

const board = document.getElementById('board');
const outList = document.getElementById('outList');
const kept = [], dropped = [];

NOTES.forEach(function(n, i){
  const el = document.createElement('div');
  el.className = 'note';
  el.style.left = n.x + 'px';
  el.style.top  = n.y + 'px';
  el.style.transform = 'rotate(' + ((i % 3) - 1) * 1.2 + 'deg)';
  el.innerHTML = '<span class="tag"></span>';
  el.querySelector('.tag').textContent = n.tag;
  el.appendChild(document.createTextNode(n.t));
  el.dataset.t = n.t;
  el.dataset.tag = n.tag;
  board.appendChild(el);
  drag(el);
});

function drag(el){
  let sx = 0, sy = 0, ox = 0, oy = 0;
  el.addEventListener('pointerdown', function(e){
    el.setPointerCapture(e.pointerId);
    sx = e.clientX; sy = e.clientY;
    ox = parseFloat(el.style.left); oy = parseFloat(el.style.top);
    el.style.zIndex = 3;
  });
  el.addEventListener('pointermove', function(e){
    if (!el.hasPointerCapture(e.pointerId)) return;
    el.style.left = (ox + e.clientX - sx) + 'px';
    el.style.top  = (oy + e.clientY - sy) + 'px';
  });
  el.addEventListener('pointerup', function(e){
    el.releasePointerCapture(e.pointerId);
    el.style.zIndex = 1;
    settle(el);
  });
}

function settle(el){
  const x = parseFloat(el.style.left) + 90;
  const was = el.dataset.zone || '0';
  const now = x < 900 ? '0' : (x < 1800 ? '1' : '2');
  if (was === now) return;
  el.dataset.zone = now;
  el.classList.toggle('kept', now === '1');
  el.classList.toggle('dropped', now === '2');
  redraw();
}

function redraw(){
  const k = [], d = [];
  board.querySelectorAll('.note').forEach(function(el){
    if (el.dataset.zone === '1') k.push(el);
    if (el.dataset.zone === '2') d.push(el);
  });
  outList.innerHTML = '';
  if (k.length === 0 && d.length === 0){
    outList.innerHTML = '<li class="empty">まだ何も決まっていません。</li>';
    return;
  }
  k.forEach(function(el){
    const li = document.createElement('li');
    li.innerHTML = '<b></b>';
    li.querySelector('b').textContent = el.dataset.tag;
    li.appendChild(document.createTextNode(el.dataset.t));
    outList.appendChild(li);
  });
  // 決めなかったものは、穴として残る
  d.forEach(function(){
    const li = document.createElement('li');
    li.className = 'hole';
    li.textContent = '（決めなかったので、作られていません）';
    outList.appendChild(li);
  });
}

// 57: 横パン
let page = 0;
function pan(p){
  page = Math.max(0, Math.min(2, p));
  board.style.transform = 'translateX(' + (-page * 900) + 'px)';
  document.getElementById('pos').textContent = (page + 1) + ' / 3';
}
addEventListener('keydown', function(e){
  if (e.key === 'ArrowRight') pan(page + 1);
  if (e.key === 'ArrowLeft')  pan(page - 1);
});
</script>
</body>
</html>
