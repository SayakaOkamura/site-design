<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>006-B 夜は閉まる</title>
<link rel="stylesheet" href="../../assets/css/reset.css">
<style>
/* =========================================================
   006-B 夜は閉まる

   一言：「あそこのサイト、夜行くと閉まってるんですよ」

   理念の実演。遊ぶように働く会社には、働かない時間がある。
   すごさではなく変。だから AI には帰属しない。会社が決めたことだから。
   ========================================================= */
:root{
  --bg:#f4f2ed; --ink:#14161a; --sub:#6b7280; --faint:#a3a8b2;
  --line:#dcd8cf; --amber:#b45309; --seal:#8b2020;
  --ui:-apple-system,"Segoe UI",Roboto,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,monospace;
}
body{font-family:var(--ui);color:var(--ink);background:var(--bg);
     min-height:100vh;display:flex;flex-direction:column;line-height:1.8}

/* 営業状態は、いつ来ても最初に目に入る位置に置く */
.sign{
  display:flex;align-items:center;gap:14px;
  padding:14px 22px;border-bottom:1px solid var(--line);background:#fff;
}
.sign .name{font-size:11px;letter-spacing:.2em;color:var(--sub)}
.sign .grow{flex:1}
.lamp{display:flex;align-items:center;gap:8px;font-size:12px}
.lamp i{width:8px;height:8px;border-radius:50%;display:block}
.open  .lamp i{background:#2f7d4f;box-shadow:0 0 0 3px rgba(47,125,79,.15)}
.closed .lamp i{background:var(--faint)}
.clock{font-family:var(--mono);font-size:12px;color:var(--faint)}

main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px 22px}
.card{max-width:560px;width:100%}

/* ---------- 閉まっているとき ---------- */
.shut h1{font-size:30px;font-weight:600;letter-spacing:.04em;margin-bottom:16px}
.shut .lead{font-size:16px;color:var(--sub);margin-bottom:26px}
.shut .next{
  display:inline-block;font-family:var(--mono);font-size:14px;
  border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 16px;
}
.shut .why{
  margin-top:30px;padding-top:20px;border-top:1px solid var(--line);
  font-size:13.5px;color:var(--sub);
}
.shut .why b{color:var(--ink);font-weight:600}

/* ---------- 開いているとき ---------- */
.live h1{font-size:26px;font-weight:600;margin-bottom:6px}
.live .tag{font-size:13px;color:var(--sub);margin-bottom:24px}
.who{border:1px solid var(--line);background:#fff;border-radius:10px;overflow:hidden}
.who h2{
  font-size:10.5px;font-weight:600;letter-spacing:.14em;color:var(--faint);
  padding:11px 16px;border-bottom:1px solid var(--line);
}
.who ul{list-style:none}
.who li{
  display:flex;align-items:baseline;gap:12px;
  padding:10px 16px;border-bottom:1px solid #f0eee9;font-size:14px;
}
.who li:last-child{border-bottom:0}
.who .nm{width:84px;font-weight:600}
.who .do{color:var(--sub);font-size:13px}
.who .hh{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--faint)}

.hours{
  margin-top:22px;font-size:13px;color:var(--sub);
  display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;
}
.hours b{color:var(--ink);font-family:var(--mono);font-weight:600}
.note{margin-top:26px;font-size:12.5px;color:var(--faint);line-height:1.9}

/* スケッチ用。実物には置かない。 */
.peek{
  position:fixed;left:0;right:0;bottom:0;background:#14161a;color:#c9ccd2;
  font-size:11px;padding:8px 14px;display:flex;gap:10px;align-items:center;
}
.peek b{color:#fff}
.peek button{
  font:inherit;background:none;border:1px solid #3a3f48;color:#c9ccd2;
  border-radius:5px;padding:3px 10px;cursor:pointer;
}
.peek button:hover{border-color:#6b7280;color:#fff}
.peek .grow{flex:1}
</style>
</head>
<body class="closed">

<div class="sign" id="sign">
  <span class="name">ALTER DESIGN CONSULTING</span>
  <span class="grow"></span>
  <span class="lamp"><i></i><span id="state">—</span></span>
  <span class="clock" id="clock">--:--</span>
</div>

<main>
  <!-- 閉まっている -->
  <div class="card shut" id="shut" hidden>
    <h1>本日は終了しました。</h1>
    <p class="lead">誰も働いていないので、サイトも閉まっています。</p>
    <span class="next" id="next">次に開くのは —</span>

    <p class="why">
      うちは「<b>遊ぶように働く世界</b>」をデザインする会社です。<br>
      働きっぱなしの会社が、それを言っても仕方がないので。
    </p>
  </div>

  <!-- 開いている -->
  <div class="card live" id="live" hidden>
    <h1>いま、開いています。</h1>
    <p class="tag">株式会社アルターデザインコンサルティング</p>

    <div class="who">
      <h2>いま働いている人</h2>
      <ul id="crew"></ul>
    </div>

    <p class="hours">
      営業時間 <b>平日 9:00 – 18:00</b>　それ以外は閉まります。
    </p>
    <p class="note">
      時間外に来た方へ。翌営業日に開きます。急ぎでも開きません。
    </p>
  </div>
</main>

<div class="peek">
  <b>スケッチ用</b> 実物には置かない。時刻を動かして見る：
  <button data-h="10">平日 10:00</button>
  <button data-h="23">深夜 23:00</button>
  <button data-h="">いまの時刻</button>
  <span class="grow"></span>
  <span>006-B</span>
</div>

<script>
/* 中の人。実物では実際の稼働に繋ぐ。ここは見え方を見るための仮値。 */
const CREW = [
  { nm:'松岡 真功', do:'来週の提案を書いています', hh:'3h 20m' },
  { nm:'岡村',      do:'サイトの案を作っています',   hh:'5h 05m' },
  { nm:'—',         do:'ほかは今日は上がりました',   hh:'' }
];

let forced = null;   // スケッチ用の時刻上書き

function now(){
  const d = new Date();
  if (forced !== null){ d.setHours(forced, 0, 0, 0); }
  return d;
}

function isOpen(d){
  const day = d.getDay();                 // 0=日 6=土
  if (day === 0 || day === 6) return false;
  const h = d.getHours();
  return h >= 9 && h < 18;
}

function nextOpen(d){
  const n = new Date(d);
  if (isOpen(d)) return null;
  if (n.getHours() >= 18) n.setDate(n.getDate() + 1);
  n.setHours(9, 0, 0, 0);
  while (n.getDay() === 0 || n.getDay() === 6) n.setDate(n.getDate() + 1);
  const w = ['日','月','火','水','木','金','土'][n.getDay()];
  const same = n.toDateString() === d.toDateString();
  return (same ? '今日' : (n.getMonth()+1) + '月' + n.getDate() + '日（' + w + '）') + ' 9:00';
}

function pad(n){ return (n < 10 ? '0' : '') + n; }

function render(){
  const d = now(), open = isOpen(d);
  document.body.className = open ? 'open' : 'closed';
  document.getElementById('state').textContent = open ? '営業中' : '閉店中';
  document.getElementById('clock').textContent = pad(d.getHours()) + ':' + pad(d.getMinutes());
  document.getElementById('shut').hidden = open;
  document.getElementById('live').hidden = !open;

  if (open){
    document.getElementById('crew').innerHTML = CREW.map(function(c){
      return '<li><span class="nm">' + c.nm + '</span>'
           + '<span class="do">' + c.do + '</span>'
           + '<span class="hh">' + c.hh + '</span></li>';
    }).join('');
  } else {
    document.getElementById('next').textContent = '次に開くのは ' + nextOpen(d);
  }
}

document.querySelectorAll('.peek button').forEach(function(b){
  b.onclick = function(){
    forced = b.dataset.h === '' ? null : +b.dataset.h;
    render();
  };
});

render();
setInterval(render, 20000);
</script>
</body>
</html>
