<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>006-A ほんとうに動く</title>
<link rel="stylesheet" href="../../../assets/css/reset.css">
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<!-- ============================================================
     006-A ほんとうに動く

     005 は画面の「絵」が出るだけだった。ここは本当に動かす。
     入力できる。保存される。一覧に出る。承認が回る。
     閉じて開き直しても残っている（LocalStorage）。

     見せたいのは論ではなく力。だから説明を置かない。
     ============================================================ -->

<header class="top">
  <div class="brand">ALTER DESIGN CONSULTING</div>
  <div class="spacer"></div>
  <button id="reset" class="ghost" hidden>最初から</button>
</header>

<!-- ---------- 一 書く ---------- -->
<section id="s1" class="stage on">
  <div class="ask">
    <h1>つくりたい業務を、一行で。</h1>
    <div class="line">
      <input id="in" autocomplete="off" spellcheck="false"
             placeholder="経費を申請して、上長が承認する">
      <button id="go">つくる</button>
    </div>
    <ul class="egs" id="egs"></ul>
  </div>
</section>

<!-- ---------- 二 動く ---------- -->
<section id="s2" class="stage">
  <div class="app" id="app">

    <div class="app-head">
      <div class="ttl" id="appTitle">画面</div>
      <div class="from" id="from"></div>
      <div class="spacer"></div>
      <div class="built" id="built"></div>
    </div>

    <div class="cols">
      <!-- 入力 -->
      <form class="pane form" id="form" autocomplete="off">
        <h2 id="formHead">登録</h2>
        <div id="fields"></div>
        <div class="row-btn">
          <button type="submit" id="submit">登録する</button>
          <span class="said" id="said"></span>
        </div>
      </form>

      <!-- 一覧 -->
      <div class="pane list">
        <h2>一覧 <span class="count" id="count">0</span></h2>
        <div class="table-wrap">
          <table id="tbl">
            <thead id="thead"></thead>
            <tbody id="tbody"></tbody>
          </table>
          <p class="empty" id="empty">まだ 1 件もありません。</p>
        </div>
      </div>
    </div>

    <div class="app-foot">
      <button id="reload" class="ghost">閉じて開き直す</button>
      <button id="wipe" class="ghost danger">全部消す</button>
    </div>
  </div>
</section>

<script src="script.js?v=1"></script>
</body>
</html>
