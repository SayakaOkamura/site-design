<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>株式会社アルターデザインコンサルティング</title>
<!-- 015 作業部屋の窓辺（2026-11-25）。finder.html の前（メニューと板）はそのまま、背景を窓辺の部屋に替えたもの。
     時間は見ている人の時計に合わせる（朝・昼・夕・夜）。chill の質感で、数秒おきに小さな出来事が一つ起きる。人とキャラは置かない。文は公式のまま -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
:root{ --bg:#1d0a2c; --deep:#2a0e3e; --pu:#654087; --li:#bb7eea; --pale:#ece2f6; --wh:#fbf8ff; --ac:#d7ff3a; --ox:50vw; --oy:50vh; }
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; overflow:hidden}
body{background:var(--bg); color:var(--wh); font-family:"Zen Kaku Gothic New",sans-serif; line-height:1.9}
@media (pointer:fine){ body.live, body.live *{cursor:none !important} }
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
.h{font-family:"Dela Gothic One",sans-serif; font-weight:400}
.min{font-family:"Zen Old Mincho",serif; font-weight:700}
.g{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; letter-spacing:.02em}

header{position:fixed; top:20px; left:clamp(16px,4vw,48px); z-index:6; display:flex; align-items:center; gap:10px; line-height:1.1; transition:color .2s}
header i{width:30px; height:30px; border-radius:50%; border:5px solid var(--pu); box-shadow:inset 0 0 0 2px var(--li)}
header span{font-size:17px}
header small{display:block; font-size:10px; margin-left:4.4em; color:var(--li)}

/* メニュー：大きな文字をまっすぐ並べる */
.menu{position:fixed; left:clamp(20px,7vw,110px); top:50%; transform:translateY(-50%); z-index:3; display:grid; gap:clamp(4px,1.6vh,18px); justify-items:start}
.menu button{position:relative; text-align:left; padding:.06em .35em; font-size:clamp(30px,min(6.2vw,8vh),78px); line-height:1.1; color:var(--li); transition:color .12s}
.menu button small{display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-size:max(11px,.17em); letter-spacing:.35em; color:var(--pu); margin-top:.15em; transition:color .12s}
.menu button.on,.menu button.opened{color:var(--wh)}
.menu button.on small,.menu button.opened small{color:var(--ac)}
/* 選んだ文字の下に、左から伸びる線 */



/* 輪：ロゴの形。マウスについてきて、文字に近づくと吸いついて囲む */
.cur{position:fixed; left:0; top:0; z-index:8; pointer-events:none; width:var(--w,44px); height:var(--hh,44px); border-radius:999px;
  border:6px solid var(--pu); box-shadow:inset 0 0 0 3px var(--li); transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(var(--s,1)) rotate(var(--rot));
  transition:width .14s cubic-bezier(.2,.8,.2,1), height .14s cubic-bezier(.2,.8,.2,1), border-color .14s, background .14s, opacity .2s; opacity:0}
.cur.snap{border-color:var(--li); box-shadow:none}
/* 字の上では小さく薄く（読む邪魔をしない） */
.cur.dim{opacity:.55 !important}
/* 押せる物の上では、輪の中を塗りつぶす */
.cur.press{border-color:var(--li); box-shadow:none}
/* 押すと一瞬縮む */
.cur.tap{--s:.8}
body.live .cur,body.keys .cur{opacity:1}
/* 本当のマウスの位置：小さな点（楕円に吸いついても、ここにいると分かる） */
.dot{position:fixed; left:0; top:0; z-index:9; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:var(--wh); pointer-events:none; opacity:0; transform:translate(var(--mx),var(--my))}
body.live .dot{opacity:1}
body.keys .dot{opacity:0}   /* キーで選んでいるあいだは点を出さない（輪は項目にいる） */
/* 押した所から一重の波紋 */
.rip{position:fixed; z-index:8; width:80px; height:80px; margin:-40px 0 0 -40px; border-radius:50%; border:2px solid var(--li); pointer-events:none; animation:rip .42s ease-out forwards}
@keyframes rip{from{transform:scale(.25); opacity:.9} to{transform:scale(1); opacity:0}}
/* 隠し：輪がくるっと回る */
.cur.joy{animation:spin .7s cubic-bezier(.3,0,.2,1)}
@property --rot{syntax:'<angle>'; inherits:false; initial-value:0deg}
@keyframes spin{to{--rot:360deg}}

/* 背景：作業部屋の窓辺。時間は見ている人の時計に合わせる（朝・昼・夕・夜） */
#bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; background:var(--wall)}
#bg svg{position:absolute; inset:0; width:100%; height:100%; display:block}
/* 色は 013 の紫の段と差し色の黄緑だけ。平らな面で、空だけが明るい */
body{--wall:#1d0a2c; --sky:#d9c4ef; --orb:#fbf8ff; --cloud:#fbf8ff; --cloudA:1; --bld:#8a63b0; --lit:0; --star:0;
  --frame:#654087; --curt:#3a1757; --desk:#654087; --deskf:#2a0e3e; --sun:#fbf8ff; --sunA:.1; --leaf:#bb7eea; --pot:#3a1757; --mug:#fbf8ff;
  --paper:#ece2f6; --lap:#2a0e3e; --scr:#bb7eea; --glow:0; --steam:rgba(251,248,255,.6)}
body[data-t="day"]{--sky:#ece2f6; --orb:#d7ff3a; --bld:#bb7eea; --sunA:.14}
body[data-t="evening"]{--sky:#bb7eea; --orb:#d7ff3a; --cloud:#ece2f6; --bld:#654087; --lit:1; --sunA:.08}
body[data-t="night"]{--wall:#140720; --sky:#2a0e3e; --orb:#ece2f6; --cloud:#654087; --cloudA:.5; --bld:#1d0a2c; --lit:1; --star:1; --sunA:0;
  --frame:#3a1757; --curt:#2a0e3e; --desk:#3a1757; --deskf:#1d0a2c; --leaf:#654087; --mug:#bb7eea; --paper:#8a63b0; --lap:#1d0a2c; --scr:#d7ff3a; --glow:.35; --steam:rgba(251,248,255,.35)}
.skyf{fill:var(--sky)}
.wall{fill:var(--wall)} .orb{fill:var(--orb)} .star{fill:#fff; opacity:var(--star)}
.cl{fill:var(--cloud); opacity:var(--cloudA)} .bld{fill:var(--bld)} .lw{fill:#d7ff3a; opacity:calc(var(--lit) * .85); transition:opacity 1.2s}
.lw.off{opacity:0}
.frame{fill:none; stroke:var(--frame)} .sill{fill:var(--frame)} .curt{fill:var(--curt)}
.desk{fill:var(--desk)} .deskf{fill:var(--deskf)} .sunp{fill:var(--sun); opacity:var(--sunA)}
.leaf{fill:var(--leaf)} .pot{fill:var(--pot)} .mug{fill:var(--mug)} .mugh{fill:none; stroke:var(--mug); stroke-width:7; stroke-linejoin:miter}
.paper{fill:var(--paper)} .ln{stroke:rgba(42,14,62,.35); stroke-width:1.5} .lap{fill:var(--lap)} .scr{fill:var(--scr)} .glow{opacity:var(--glow)}
.steam{fill:none; stroke:var(--steam); stroke-width:4; stroke-linejoin:miter}

/* ずっと続く低い動き：雲が流れる・湯気・カーテンと葉がわずかに揺れる */
.drift{animation:drift var(--dur,150s) linear infinite; animation-delay:var(--dl,0s)}
@keyframes drift{from{transform:translateX(-420px)} to{transform:translateX(780px)}}
.steam path{animation:steam 4.2s ease-in-out infinite; transform-box:fill-box}
.steam path:nth-child(2){animation-delay:1.4s} .steam path:nth-child(3){animation-delay:2.8s}
@keyframes steam{0%{transform:translateY(8px); opacity:0} 35%{opacity:1} 100%{transform:translateY(-22px); opacity:0}}
.curt{transform-box:fill-box; transform-origin:50% 0; animation:sway 9s ease-in-out infinite alternate}
.curt.r{animation-delay:-4s}
.leaves{transform-box:fill-box; transform-origin:50% 100%; animation:sway 7s ease-in-out infinite alternate}
@keyframes sway{from{transform:skewX(-1deg)} to{transform:skewX(1.2deg)}}

/* 数秒おきの小さな出来事 */
.curt.gust{animation:gust 2.6s ease-in-out}
@keyframes gust{0%{transform:skewX(0)} 30%{transform:skewX(-6deg) scaleX(1.08)} 60%{transform:skewX(2deg)} 100%{transform:skewX(0)}}
.flip{transform-box:fill-box; transform-origin:0 50%; opacity:0}
.flip.go{animation:flip 1.1s cubic-bezier(.4,0,.3,1)}
@keyframes flip{0%{opacity:1; transform:scaleX(1)} 50%{transform:scaleX(0) skewY(-4deg)} 100%{opacity:1; transform:scaleX(-1)}}
.notif{opacity:0; transform-box:fill-box}
.notif.go{animation:notif 3s ease-out}
@keyframes notif{0%{opacity:0; transform:translateX(14px)} 12%{opacity:1; transform:none} 80%{opacity:1} 100%{opacity:0}}
.bird{opacity:0}
.bird.go{animation:bird 5s linear}
@keyframes bird{0%{opacity:1; transform:translate(760px,250px)} 100%{opacity:1; transform:translate(1480px,170px)}}
.bird path{animation:flap .5s ease-in-out infinite alternate; transform-box:fill-box; transform-origin:50% 100%}
@keyframes flap{to{transform:scaleY(.4)}}
/* 押せる小物：PC だけ */
#bg .hit{pointer-events:auto; cursor:pointer}
@media (prefers-reduced-motion:reduce){ #bg *{animation:none !important} }

/* 決定の光：開いた瞬間、その項目が一瞬だけ黄緑に明るく光って、すっと白に戻る（消す点滅はしない） */
.menu button.confirm{animation:confirm .45s ease-out}
@keyframes confirm{0%{color:#d7ff3a} 100%{color:var(--wh)}}
/* 開いている項目は、右（板の方）へ一歩出たまま止まる。別の項目を開くと入れ替わり、閉じると列にそろう */
.menu button.opened{transform:translateX(26px)}
.menu button.opened small{transform:translateX(14px)}
.menu button small{display:block; transition:transform .3s cubic-bezier(.2,.8,.2,1)}
body.ready .menu button{transition:color .12s, opacity .35s, transform .3s cubic-bezier(.2,.8,.2,1)}

/* OP：ロゴの輪が描かれ、社名が出て、メニューが順に出る */
.op{position:fixed; inset:0; z-index:30; background:var(--bg); display:grid; place-items:center; transition:opacity .35s}
.op.out{opacity:0; pointer-events:none}
.op .in{display:grid; justify-items:center; gap:18px}
.op svg{width:88px; height:88px; overflow:visible}
.op circle{fill:none; stroke-linecap:round}
.op .c1{stroke:var(--pu); stroke-width:12; stroke-dasharray:240; stroke-dashoffset:240; animation:draw .7s cubic-bezier(.6,0,.2,1) forwards}
.op .c2{stroke:var(--li); stroke-width:4; stroke-dasharray:190; stroke-dashoffset:190; animation:draw .6s .25s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.op .nm{font-size:20px; line-height:1.1; opacity:0; transform:translateY(6px); animation:nm .4s .65s ease-out forwards; text-align:center}
.op .nm small{display:block; font-size:11px; letter-spacing:.3em; color:var(--li); margin-top:4px}
@keyframes nm{to{opacity:1; transform:none}}
.menu button{transition:color .12s, opacity .35s calc(var(--i,0) * 60ms), transform .35s calc(var(--i,0) * 60ms)}
body.pre .menu button{opacity:0; transform:translateX(-24px)}
body.pre .hero,body.pre .keys,body.pre footer{opacity:0}
.hero,.keys,footer{transition:opacity .4s .3s}
header{cursor:pointer}

/* ブラウザのフォーカス枠は出さない。選んでいるのは輪で示す */
.menu button:focus,.menu button:focus-visible{outline:none}

/* 右下：見出し */
.hero{position:fixed; right:clamp(16px,5vw,72px); bottom:clamp(40px,9vh,90px); z-index:1; pointer-events:none; text-align:right; max-width:min(60vw,780px); transition:opacity .3s}
.hero h1{font-size:clamp(20px,2.6vw,38px); line-height:1.45}
.hero{text-shadow:0 0 3px #1d0a2c, 0 2px 14px #1d0a2c, 0 0 28px rgba(29,10,44,.8)}   /* 机の上の物に重なっても読める */
.hero p{margin-top:.8em; font-size:clamp(12px,1.1vw,15px); color:var(--li)}
body.open .hero{opacity:0}

/* 開く：右から板が滑り込んで中身。メニューと輪は左に残る */
.page{position:fixed; top:0; bottom:0; right:0; width:min(58vw,820px); z-index:4; overflow-x:hidden; overflow-y:auto; color:var(--wh); background:rgba(42,14,62,.74); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
  border-left:2px solid var(--pu);
  /* 右から横に滑り込んで止まる */
  transform-origin:100% 50%; transform:translateX(40px); opacity:0; visibility:hidden; pointer-events:none;
  transition:transform .62s cubic-bezier(.2,.8,.2,1), opacity .3s, visibility 0s .62s}
body.open .page{transform:translateX(0); opacity:1; visibility:visible; pointer-events:auto;
  transition:transform .62s cubic-bezier(.2,.8,.2,1), opacity .25s, visibility 0s}
body.open .page.flat{transform:none}
/* 開いたまま替えるとき：板を一瞬で右へ戻し、そこから滑り込み直す */
body.open .page.reset{transform:translateX(40px); opacity:0; transition:none}
/* 中身：見出しは右からシュッと入り、本文は上から一段ずつ少し遅れて流れ込む */
.page .wrap.enter .ph .k,.page .wrap.enter .ph h2{animation:hin .43s cubic-bezier(.2,.8,.2,1) both}
.page .wrap.enter .ph h2{animation-delay:.04s}
@keyframes hin{from{transform:translateX(44px); opacity:0}}
.page .wrap.enter > :not(.ph){animation:lin .41s cubic-bezier(.2,.8,.2,1) both; animation-delay:var(--d,0s)}
@keyframes lin{from{transform:translateY(-10px); opacity:0}}
.page .wrap{padding:0 clamp(24px,4vw,64px) 60px}
.page .back{position:sticky; float:right; top:20px; margin:20px clamp(16px,3vw,40px) 0 0; right:clamp(16px,4vw,48px); font-size:13px; letter-spacing:.2em; color:var(--li); z-index:7; cursor:pointer}
.page .back:hover{color:var(--wh)}
.page .ph{position:sticky; top:0; z-index:1; background:rgba(42,14,62,.6); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); margin:0 calc(-1 * clamp(24px,4vw,64px)); padding:clamp(72px,11vh,110px) clamp(24px,4vw,64px) 4px}   /* 最初の位置のまま動かない */
.page .k{font-size:12px; letter-spacing:.35em; color:var(--li)}
.page h2{font-size:clamp(24px,2.8vw,38px); line-height:1.3; margin:.2em 0 1em}
.page h2::after{content:""; display:block; width:1.6em; height:.1em; background:var(--li); margin-top:.3em}
.page h3{font-size:clamp(16px,1.6vw,20px); line-height:1.6; margin:1.6em 0 .4em}
.page p,.page dd{font-size:15px}
.page b{font-weight:700}
.page dl{display:grid; grid-template-columns:8em 1fr; border-top:1px solid rgba(187,126,234,.3); padding:12px 0; font-size:15px}
.page dt{font-weight:700}
.page .acc{font-size:13px; color:var(--li); margin-top:.4em}
.page a.btn{display:inline-flex; align-items:center; justify-content:center; margin-top:1.8em; min-width:min(100%,380px); height:58px; border-radius:29px; background:var(--pu); color:var(--wh); text-decoration:none; letter-spacing:.1em; cursor:pointer}
.page a.btn:hover{background:var(--pu)}

.keys{position:fixed; left:clamp(16px,4vw,48px); bottom:16px; z-index:3; font-size:11px; letter-spacing:.15em; color:var(--li); opacity:.7}
footer{position:fixed; right:16px; bottom:10px; z-index:3; font-size:11px; color:var(--li); opacity:.7}
footer a{color:inherit}
body.open footer,body.open .keys{opacity:0; pointer-events:none}

@media (max-width:760px){
  .menu{top:auto; bottom:48px; transform:none}
  .menu button{font-size:clamp(26px,9vw,40px)}
  .hero{top:84px; bottom:auto; left:16px; right:16px; text-align:left; max-width:none}
  .keys{display:none}
  .page{width:100%; border-left:0}
  /* スマホ幅：部屋の絵は見出しとメニューのあいだに収める（メニューの後ろに小物が来ないように） */
  #bg svg{top:clamp(160px,22vh,200px); bottom:auto; height:45vh; overflow:visible}   /* 机の前板は下まで続く */
}
@media (prefers-reduced-motion:reduce){ .page,.cur{transition:none} .rip,.op{display:none} .cur.joy{animation:none} }
</style>

      <rect class="lw" x="928" y="450" width="10" height="12"/><rect class="lw" x="990" y="465" width="10" height="12"/><rect class="lw" x="1040" y="495" width="10" height="12"/>
      <rect class="lw" x="1095" y="410" width="10" height="12"/><rect class="lw" x="1125" y="455" width="10" height="12"/><rect class="lw" x="1185" y="450" width="10" height="12"/>
      <rect class="lw" x="1240" y="490" width="10" height="12"/><rect class="lw" x="1300" y="385" width="10" height="12"/><rect class="lw" x="1325" y="440" width="10" height="12"/>
      <rect class="lw" x="1380" y="445" width="10" height="12"/><rect class="lw" x="1415" y="480" width="10" height="12"/>
    </g>
  </g>
  <!-- 窓枠・カーテン -->
  <rect class="frame" x="780" y="110" width="660" height="450" stroke-width="26"/>
  <line class="frame" x1="1110" y1="110" x2="1110" y2="560" stroke-width="16"/><line class="frame" x1="780" y1="335" x2="1440" y2="335" stroke-width="16"/>
  <rect class="sill" x="750" y="552" width="720" height="30"/>
  <line class="frame" x1="715" y1="94" x2="1505" y2="94" stroke-width="10"/>

  <!-- 机 -->
  <polygon class="desk" points="520,595 1600,595 1600,640 470,640"/>

  <!-- 鉢 -->
  <g>
  <g class="leaves">
    <polygon class="leaf" points="815,513 826,540 815,567 804,540" transform="rotate(-25 815 540)"/><polygon class="leaf" points="847,509 858,536 847,563 836,536" transform="rotate(22 847 536)"/>
    <polygon class="leaf" points="831,488 842,522 831,556 820,522" transform="rotate(0 831 522)"/><polygon class="leaf" points="803,536 813,557 803,578 793,557" transform="rotate(-58 803 557)"/><polygon class="leaf" points="860,533 870,554 860,575 850,554" transform="rotate(55 860 554)"/>
  </g>

  </g>
  <!-- マグと湯気 -->

<script>
(function(){
var PAGES = [
  { e:'PHILOSOPHY', html:'<h2 class="g">アルターデザインコンサルティングの企業理念</h2><h3>経営の力で「遊ぶように働く世界」をデザインする</h3><p><b>「遊ぶように働く」</b>とは、楽をすることではなく、<b>人が夢中になり自発的に創造する状態で働く</b>こと<br>子供が遊びに没頭するように、大人も「やらされる」でなく「やりたい」仕事に向き合うこと<br>このような働き方が自然に生まれる組織を、経営の意思と創造の力で意図的に構想し設計していく<br>それが「経営の力で遊ぶように働く世界をデザインする」という当社の企業理念の本質です</p>' },
  { e:'BUSINESS', html:'<h2 class="g">事業内容</h2><p>AI技術を活用した組織最適化に関するコンサルティング事業<br>AIとローコードを組み合わせた次世代型のシステム開発事業</p><h3>AI × ローコードで、「上流工程中心のシステム開発」に革新を</h3><p>コンサルティングによる業務設計からエンジニアリングまでを行います</p>' },
  { e:'SERVICE', html:'<h2 class="g">私たちが提供するサービス</h2>' +
    '<h3>人間中心の次世代業務システム開発</h3><p>業務を効率化するだけでなく、「使う人」を中心に据えて再設計された業務システムを提供<br>ノーコードやローコードなど最新の技術を活用し、直感的で創造性を刺激するワークフローを構築します</p>' +
    '<h3>AI による意思決定支援と事業変革支援</h3><p>経営判断や業務プロセスの高度化を目的に、企業の持つデータ資産を活用した AI 導入を支援<br>未来予測や需要分析など、戦略的な意思決定を加速させるための環境を整備します</p>' +
    '<h3>自律型・共創型の組織設計支援</h3><p>テクノロジーによる分業・協業の再定義を通じて、フラットかつ柔軟な組織体制を実現<br>個人の自律とチームの共創を両立させる、新しい働き方のプラットフォームを提案します</p>' +
    '<h3>地域格差の解消を目指したデジタル支援</h3><p>都市部に偏在するデジタル機会を全国へと広げるため、地方企業・自治体に対するノーコードツールやクラウド AI の導入支援、DX 人材の育成など、地域に根差したデジタル変革を推進します</p>' },
  { e:'COMPANY', html:'<h2 class="g">会社概要</h2>' +
    '<dl><dt>会社名</dt><dd>株式会社アルターデザインコンサルティング</dd></dl><dl><dt>代表者</dt><dd>藤田 靖広</dd></dl>' +
    '<dl><dt>所在地</dt><dd>本社<br>東京都港区西新橋3-23-5 ANYZ304（御成門郵船ビル）<p class="acc">【アクセス】<br>御成門駅 徒歩2分（都営地下鉄三田線）<br>大門駅 徒歩10分（都営地下鉄浅草線・大江戸線）<br>神谷町駅 徒歩10分（東京メトロ日比谷線）<br>汐留駅 徒歩12分（都営大江戸線・ゆりかもめ）<br>虎ノ門ヒルズ駅 徒歩12分（東京メトロ日比谷線）<br>虎ノ門駅 徒歩12分（東京メトロ銀座線）<br>新橋駅 徒歩12分（JR山手線・京浜東北線）<br>浜松町駅 徒歩14分（JR山手線・京浜東北線）</p></dd></dl>' +
    '<dl><dt>事業内容</dt><dd>AI技術を活用した組織最適化に関するコンサルティング事業<br>AIとローコードを組み合わせた次世代型のシステム開発事業</dd></dl>' +
    '<dl><dt>資本金</dt><dd>60百万円</dd></dl><dl><dt>設立年月日</dt><dd>2025年6月</dd></dl>' +
    '<dl><dt>株主</dt><dd>株式会社ＢｌｕｅＭｅｍｅ<br>株式会社ハイ・アベイラビリティ・システムズ<br>株式会社サーバーワークス・キャピタル<br>リックソフト株式会社</dd></dl>' },
  { e:'CONTACT', html:'<h2 class="g">お問い合わせ</h2><p>サービスに関するご相談や、掲載のご依頼、<br>その他ご質問などがございましたら<br>お気軽にお問い合わせください</p><a class="btn" href="mailto:contact@alt-dsgn.co.jp">お問い合わせフォームへ</a>' }
];
var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
var btns = [].slice.call(document.querySelectorAll('.menu button')), cur = document.getElementById('cur');
var dot = document.getElementById('dot'), page = document.getElementById('page'), wrap = document.getElementById('wrap');
var mx = -100, my = -100, x = -100, y = -100, sel = -1, snapped = -1, opened = false, rec = 0;

/* 選ぶ：輪が文字を囲む */
function pick(i){
  sel = (i + btns.length) % btns.length;
  btns.forEach(function(b, k){ b.classList.toggle('on', k === sel); });
}
function snapTo(i){ snapped = i; cur.classList.toggle('snap', i >= 0); if (i >= 0) pick(i); }

var kx = 0, ky = 0;   /* キーで選び始めたときのマウスの位置 */
addEventListener('pointermove', function(e){
  mx = e.clientX; my = e.clientY; document.body.classList.add('live');
  /* キーで選んでいるあいだは、マウスをはっきり動かすまで（24px）輪を項目に吸いつけたまま */
  if (document.body.classList.contains('keys')){ if (Math.hypot(mx - kx, my - ky) < 24) return; document.body.classList.remove('keys'); }
  /* 文字の近く（上下左右に 18px のゆとり）に入ったら吸いつく */
  var hit = -1;
  btns.forEach(function(b, k){ var r = b.getBoundingClientRect(); if (mx > r.left - 18 && mx < r.right + 18 && my > r.top - 18 && my < r.bottom + 18) hit = k; });
  if (hit !== snapped) snapTo(hit);
}, {passive:true});
addEventListener('pointerdown', function(e){
  if (e.pointerType !== 'mouse' || RM) return;
  cur.classList.add('tap'); setTimeout(function(){ cur.classList.remove('tap'); }, 90);
  rec = -16;   /* 反動：上へ跳ねる */
  var rp = document.createElement('i'); rp.className = 'rip'; rp.style.left = e.clientX + 'px'; rp.style.top = e.clientY + 'px';
  document.body.appendChild(rp); setTimeout(function(){ rp.remove(); }, 450);
});
document.addEventListener('mouseleave', function(){ document.body.classList.remove('live'); });

function frame(){
  var gx = mx, gy = my, w = 44, h = 44;
  /* 輪の下にある物：押せる物なら吸いついて囲む、板の字の上なら小さく薄く */
  var under = snapped < 0 && document.elementFromPoint(mx, my), act = under && under.closest && under.closest('a, button:not(.menu button)');
  var onText = !act && opened && snapped < 0 && mx > page.getBoundingClientRect().left;
  cur.classList.toggle('press', !!act); cur.classList.toggle('dim', onText);
  if (act){ var ar = act.getBoundingClientRect(); gx = ar.left + ar.width / 2; gy = ar.top + ar.height / 2; w = ar.width + 22; h = ar.height + 14; }
  else if (onText){ w = h = 26; }
  if (snapped >= 0){
    var r = btns[snapped].getBoundingClientRect();
    gx = r.left + r.width / 2; gy = r.top + r.height / 2; w = r.width + 28; h = r.height + 18;
  }
  /* ほぼすぐ追いつく（遅れて揺れない） */
  x += (gx - x) * (RM ? 1 : .45); y += (gy - y) * (RM ? 1 : .45);
  rec *= .78;   /* 反動はすぐ戻る */
  cur.style.setProperty('--x', x + 'px'); cur.style.setProperty('--y', (y + rec) + 'px');
  cur.style.setProperty('--w', w + 'px'); cur.style.setProperty('--hh', h + 'px');
  dot.style.setProperty('--mx', mx + 'px'); dot.style.setProperty('--my', my + 'px');
  requestAnimationFrame(frame);
}

/* 開く：右から板。開いたまま別の項目を押すと、中身だけ入れ替わる */
function open(i){
  pick(i);
  /* 見出し（英字と題）は板の上に残る */
  var h = PAGES[i].html, cut = h.indexOf('</h2>') + 5;
  var fill = function(){ wrap.innerHTML = '<div class="ph"><span class="k">' + PAGES[i].e + '</span>' + h.slice(0, cut) + '</div>' + h.slice(cut); page.scrollTop = 0; };
  if (!RM){
    /* 開いたまま替えるときも最初と同じ：板を一度右へ戻して、滑り込み直す */
    if (opened){ page.classList.remove('flat'); page.classList.add('reset'); void page.offsetWidth; page.classList.remove('reset'); }
    fill();
    /* 本文の段ごとに少しずつ遅らせる。板が滑り込むのを待ってから */
    [].forEach.call(wrap.children, function(el, k){ el.style.setProperty('--d', (.3 + k * .062).toFixed(3) + 's'); });
    wrap.querySelectorAll('.ph .k, .ph h2').forEach(function(el){ el.style.animationDelay = .26 + (el.tagName === 'H2' ? .04 : 0) + 's'; });
    wrap.classList.remove('enter'); void wrap.offsetWidth; wrap.classList.add('enter');
  } else fill();
  opened = true; document.body.classList.add('open');
  btns.forEach(function(b, k){ b.classList.toggle('opened', k === i); });
  if (!RM){ var cb = btns[i]; cb.classList.remove('confirm'); void cb.offsetWidth; cb.classList.add('confirm'); setTimeout(function(){ cb.classList.remove('confirm'); }, 470); }
}
function close(){ opened = false; page.classList.remove('flat'); document.body.classList.remove('open'); btns.forEach(function(b){ b.classList.remove('opened'); }); }
/* 滑り込み終わったら、変形を外して字をくっきりさせる */
page.addEventListener('transitionend', function(e){ if (e.target === page && e.propertyName === 'transform') page.classList.toggle('flat', document.body.classList.contains('open')); });

btns.forEach(function(b, i){
  b.addEventListener('click', function(){ open(i); });
  b.addEventListener('focus', function(){ pick(i); snapTo(i); });
});
document.getElementById('back').addEventListener('click', close);
addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ close(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); var n = sel < 0 ? 0 : sel + (e.key === 'ArrowDown' ? 1 : -1); snapTo((n + btns.length) % btns.length); btns[sel].focus({preventScroll:true}); if (!document.body.classList.contains('keys')){ kx = mx; ky = my; } document.body.classList.add('keys'); if (opened) open(sel); }
  if (e.key === 'Enter' && sel >= 0 && document.activeElement && document.activeElement.tagName !== 'A'){ e.preventDefault(); open(sel); }
});


/* 隠し：左上のロゴを素早く 5 回押すと、輪がくるっと回る */
var taps = [];
document.getElementById('logo').addEventListener('click', function(){
  var now = performance.now(); taps = taps.filter(function(t){ return now - t < 1600; }); taps.push(now);
  if (taps.length >= 5){ taps = []; cur.classList.remove('joy'); void cur.offsetWidth; cur.classList.add('joy'); setTimeout(function(){ cur.classList.remove('joy'); }, 1600); }
});

/* 背景：作業部屋の窓辺。時間は見ている人の時計に合わせ、数秒おきに小さな出来事が一つ起きる */
(function(){
  var q = new URLSearchParams(location.search).get('t');
  var ORB = { morning:[880,300], day:[1280,180], evening:[1360,330], night:[980,190] };
  var orb = document.getElementById('orb');
  function phase(){ var h = new Date().getHours(); return h >= 5 && h < 10 ? 'morning' : h >= 10 && h < 16 ? 'day' : h >= 16 && h < 19 ? 'evening' : 'night'; }
  function setT(){ var t = ORB[q] ? q : phase(); document.body.dataset.t = t; orb.setAttribute('cx', ORB[t][0]); orb.setAttribute('cy', ORB[t][1]); }
  setT(); setInterval(setT, 60000);
  if (RM) return;
  function play(el, cls, ms){ el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); setTimeout(function(){ el.classList.remove(cls); }, ms); }
  var lws = [].slice.call(document.querySelectorAll('#lws .lw'));
  var EV = {
    flip:  function(){ play(document.getElementById('flip'), 'go', 1150); },
    notif: function(){ play(document.getElementById('notif'), 'go', 3050); },
    gust:  function(){ ['curtL', 'curtR'].forEach(function(id, k){ var c = document.getElementById(id); setTimeout(function(){ play(c, 'gust', 2650); }, k * 180); }); },
    bird:  function(){ play(document.getElementById('bird'), 'go', 5050); },
    light: function(){ var w = lws[Math.floor(Math.random() * lws.length)]; w.classList.toggle('off'); }
  };
  /* PC を押すと通知が来る（遊び。押さなくても数秒おきに起きる） */
  document.querySelectorAll('#bg .hit').forEach(function(el){ el.addEventListener('click', function(){ EV[el.dataset.ev](); }); });
  var last = '';
  function next(){
    setTimeout(function(){
      if (!document.hidden){
        var keys = ['flip', 'notif', 'gust', document.body.dataset.t === 'night' ? 'light' : 'bird'].filter(function(k){ return k !== last; });
        last = keys[Math.floor(Math.random() * keys.length)]; EV[last]();
      }
      next();
    }, 4000 + Math.random() * 2500);
  }
  next();
})();

/* OP：輪が描かれて社名 → メニューが順に出る。押すかキーで飛ばせる */
var op = document.getElementById('op');
function endOp(){ if (!op || op.classList.contains('out')) return; op.classList.add('out'); document.body.classList.remove('pre'); setTimeout(function(){ document.body.classList.add('ready'); }, 700); setTimeout(function(){ if (op){ op.remove(); op = null; } }, 400); }
if (RM){ op.remove(); op = null; document.body.classList.add('ready'); }
else { document.body.classList.add('pre'); setTimeout(endOp, 1500); op.addEventListener('pointerdown', endOp); addEventListener('keydown', endOp, {once:true}); }

requestAnimationFrame(frame);
})();
</script>
