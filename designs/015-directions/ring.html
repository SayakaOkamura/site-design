<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>株式会社アルターデザインコンサルティング</title>
<!-- 015 お洒落・輪がカーソル（2026-11-24）。dial.html（ダイヤル。遅れと揺れで気持ち悪い）の作り直し。
     ロゴの輪がマウスについてくる（どこでも。押せる物の上では中が塗られ、字の上では小さく薄く。押すと波紋）。メニューの文字に近づくと輪が吸いついて文字を囲み、選ぶ。
     押すと、右から板が滑り込んで中身。メニューと輪は左に残り、別の項目を押すと中身だけ入れ替わる。反応はすぐ、効果は一方向で一回。文は公式のまま -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
:root{ --bg:#1d0a2c; --deep:#2a0e3e; --pu:#654087; --li:#bb7eea; --pale:#ece2f6; --wh:#fbf8ff; --ac:#d7ff3a; --ox:50vw; --oy:50vh; }
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; overflow:hidden}
body{background:var(--bg); color:var(--wh); font-family:"Zen Kaku Gothic New",sans-serif; line-height:1.9}
@media (pointer:fine){ body.live, body.live *{cursor:none !important} }
button{font:inherit; color:inherit; background:none; border:0; cursor:pointer}
.h{font-family:"Dela Gothic One",sans-serif; font-weight:400}
.min{font-family:"Zen Old Mincho",serif; font-weight:700}
.g{font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700; letter-spacing:.02em}

header{position:fixed; top:20px; left:clamp(16px,4vw,48px); z-index:6; display:flex; align-items:center; gap:10px; line-height:1.1; transition:color .2s}
header i{width:30px; height:30px; border-radius:50%; border:5px solid var(--pu); box-shadow:inset 0 0 0 2px var(--li)}
header span{font-size:17px}
header small{display:block; font-size:10px; margin-left:4.4em; color:var(--li)}

/* メニュー：大きな文字をまっすぐ並べる */
.menu{position:fixed; left:clamp(20px,7vw,110px); top:50%; transform:translateY(-50%); z-index:3; display:grid; gap:clamp(4px,1.6vh,18px); justify-items:start}
.menu button{position:relative; text-align:left; padding:.06em .35em; font-size:clamp(30px,min(6.2vw,8vh),78px); line-height:1.1; color:var(--li); transition:color .12s}
.menu button small{display:block; font-family:"Zen Kaku Gothic New",sans-serif; font-size:max(11px,.17em); letter-spacing:.35em; color:var(--pu); margin-top:.15em; transition:color .12s}
.menu button.on{color:var(--wh)}
.menu button.on small{color:var(--ac)}
/* 選んだ文字の下に、左から伸びる線 */



/* 輪：ロゴの形。マウスについてきて、文字に近づくと吸いついて囲む */
.cur{position:fixed; left:0; top:0; z-index:8; pointer-events:none; width:var(--w,44px); height:var(--hh,44px); border-radius:999px;
  border:6px solid var(--pu); box-shadow:inset 0 0 0 3px var(--li); transform:translate(var(--x),var(--y)) translate(-50%,-50%) scale(var(--s,1)) rotate(var(--rot));
  transition:width .14s cubic-bezier(.2,.8,.2,1), height .14s cubic-bezier(.2,.8,.2,1), border-color .14s, background .14s, opacity .2s; opacity:0}
.cur.snap{border-color:var(--li); box-shadow:none}
/* 照準の上にいるときだけ「撃てる」形：黄緑の輪に、外へ十字の目盛り */
.cur.aim{border-color:#d7ff3a; box-shadow:inset 0 0 0 2px rgba(215,255,58,.45)}
.cur::before,.cur::after{content:""; position:absolute; pointer-events:none; opacity:0; transition:opacity .1s}
.cur::before{left:-15px; right:-15px; top:50%; height:2px; margin-top:-1px; background:linear-gradient(90deg,#d7ff3a 0 8px,transparent 8px calc(100% - 8px),#d7ff3a calc(100% - 8px))}
.cur::after{top:-15px; bottom:-15px; left:50%; width:2px; margin-left:-1px; background:linear-gradient(#d7ff3a 0 8px,transparent 8px calc(100% - 8px),#d7ff3a calc(100% - 8px))}
.cur.aim::before,.cur.aim::after{opacity:1}
/* 字の上では小さく薄く（読む邪魔をしない） */
.cur.dim{opacity:.55 !important}
/* 押せる物の上では、輪の中を塗りつぶす */
.cur.press{border-color:var(--li); box-shadow:none}
/* 押すと一瞬縮む */
.cur.tap{--s:.8}
body.live .cur,body.keys .cur{opacity:1}
/* 本当のマウスの位置：小さな点（楕円に吸いついても、ここにいると分かる） */
.dot{position:fixed; left:0; top:0; z-index:9; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:var(--wh); pointer-events:none; opacity:0; transform:translate(var(--mx),var(--my))}
body.live .dot{opacity:1}
body.keys .dot{opacity:0}   /* キーで選んでいるあいだは点を出さない（輪は項目にいる） */
/* 押した所から一重の波紋 */
.rip{position:fixed; z-index:8; width:80px; height:80px; margin:-40px 0 0 -40px; border-radius:50%; border:2px solid var(--li); pointer-events:none; animation:rip .42s ease-out forwards}
@keyframes rip{from{transform:scale(.25); opacity:.9} to{transform:scale(1); opacity:0}}
/* 隠し：輪がくるっと回る */
.cur.joy{animation:spin .7s cubic-bezier(.3,0,.2,1)}
@property --rot{syntax:'<angle>'; inherits:false; initial-value:0deg}
@keyframes spin{to{--rot:360deg}}

/* 背景：余白を埋める主役。大きな色面の構図が、数秒おきにカチッと組み変わる */
/* 背景：ロゴの輪の照準。十字の線は画面を貫通する（メニューの後ろも）。照準本体は画面の中の決まった 6 か所に置く
   撃つと、撃った向きにある場所へ跳ぶ（0.58 秒、一瞬溜めてなめらかに止まる）。当たった瞬間にヒットマーク・火花・光・押し・連続の数 */
#bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
#bg .ret{position:absolute; left:0; top:0; width:0; height:0; transform:translate(var(--sx),var(--sy)); transition:transform .45s cubic-bezier(.2,.8,.2,1)}   /* 十字の線は次の場所へ素直に移る */
#bg .ret .core{position:absolute}
#bg .ret .rg{position:absolute; border-radius:50%; border:solid #3a1b58; transition:border-color .25s}
#bg .ret .rg::after{content:""; position:absolute; inset:18%; border-radius:50%; border:2px solid rgba(187,126,234,.22); transition:border-color .25s}
#bg .ret .hx{position:absolute; left:-300vw; width:600vw; top:-1px; height:2px; background:rgba(187,126,234,.16); transition:background .25s}
#bg .ret .vy{position:absolute; top:-300vh; height:600vh; left:-1px; width:2px; background:rgba(187,126,234,.16); transition:background .25s}
#bg .ret .tk{position:absolute; background:rgba(187,126,234,.45)}
/* 当たった瞬間：黄緑に光って、ぐっと跳ねる */
#bg .ret.hit .rg{border-color:#d7ff3a; transition:none}
#bg .ret.hit .rg::after{border-color:rgba(215,255,58,.7); transition:none}
#bg .ret.hit .hx,#bg .ret.hit .vy{background:rgba(215,255,58,.55); transition:none}
#bg .ret.pop .core{animation:pop2 .32s cubic-bezier(.2,1.4,.4,1)}
/* 割れたあと：輪は消え、次の場所で一筆で描かれて現れる */
@property --ang{syntax:'<angle>'; inherits:false; initial-value:360deg}
#bg .ret .core{-webkit-mask:conic-gradient(#000 var(--ang), transparent 0); mask:conic-gradient(#000 var(--ang), transparent 0)}
#bg .ret.gone .core{--ang:0deg}
#bg .ret.draw .core{animation:drawin .32s cubic-bezier(.5,0,.3,1) forwards}
@keyframes drawin{from{--ang:0deg} to{--ang:360deg}}
/* 欠片（輪の弧）と衝撃の輪 */
.pc{position:fixed; z-index:8; pointer-events:none; animation:pc .55s cubic-bezier(.15,.7,.3,1) forwards}
.pc svg{display:block; overflow:visible}
@keyframes pc{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0}}
.sw{position:fixed; z-index:8; border-radius:50%; border:3px solid #d7ff3a; pointer-events:none; animation:sw .42s cubic-bezier(.1,.7,.3,1) forwards}
@keyframes sw{from{transform:translate(-50%,-50%) scale(.15); opacity:.9} to{transform:translate(-50%,-50%) scale(1); opacity:0}}
@keyframes pop2{0%{transform:scale(1.1)} 100%{transform:scale(1)}}
/* ヒットマーク（×）・火花・連続の数 */
.hm{position:fixed; z-index:9; width:34px; height:34px; margin:-17px 0 0 -17px; pointer-events:none; animation:hm .32s ease-out forwards}
.hm::before,.hm::after{content:""; position:absolute; left:50%; top:50%; width:34px; height:3px; margin:-1.5px 0 0 -17px; background:linear-gradient(90deg,#fbf8ff 0 11px,transparent 11px 23px,#fbf8ff 23px)}
.hm::before{transform:rotate(45deg)} .hm::after{transform:rotate(-45deg)}
@keyframes hm{0%{transform:scale(1.5); opacity:1} 60%{transform:scale(1); opacity:1} 100%{transform:scale(1); opacity:0}}
.sp{position:fixed; z-index:9; width:16px; height:3px; margin:-1.5px 0 0 0; background:#d7ff3a; pointer-events:none; transform-origin:0 50%; animation:sp .3s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes sp{from{transform:rotate(var(--a)) translateX(0) scaleX(1); opacity:1} to{transform:rotate(var(--a)) translateX(var(--d)) scaleX(.2); opacity:0}}
/* 画面が撃った向きへ一瞬だけ押される */
body.kick #bg{animation:kick .14s ease-out}
@keyframes kick{40%{transform:translate(var(--kx),var(--ky))}}
/* 押した項目だけ、押された向きへ少し跳ねて戻る */
.menu button.bump{animation:bump .32s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{35%{transform:translate(var(--bx,6px),var(--by,0px))}}

/* OP：ロゴの輪が描かれ、社名が出て、メニューが順に出る */
.op{position:fixed; inset:0; z-index:30; background:var(--bg); display:grid; place-items:center; transition:opacity .35s}
.op.out{opacity:0; pointer-events:none}
.op .in{display:grid; justify-items:center; gap:18px}
.op svg{width:88px; height:88px; overflow:visible}
.op circle{fill:none; stroke-linecap:round}
.op .c1{stroke:var(--pu); stroke-width:12; stroke-dasharray:240; stroke-dashoffset:240; animation:draw .7s cubic-bezier(.6,0,.2,1) forwards}
.op .c2{stroke:var(--li); stroke-width:4; stroke-dasharray:190; stroke-dashoffset:190; animation:draw .6s .25s cubic-bezier(.6,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.op .nm{font-size:20px; line-height:1.1; opacity:0; transform:translateY(6px); animation:nm .4s .65s ease-out forwards; text-align:center}
.op .nm small{display:block; font-size:11px; letter-spacing:.3em; color:var(--li); margin-top:4px}
@keyframes nm{to{opacity:1; transform:none}}
.menu button{transition:color .12s, opacity .35s calc(var(--i,0) * 60ms), transform .35s calc(var(--i,0) * 60ms)}
body.pre .menu button{opacity:0; transform:translateX(-24px)}
body.pre .hero,body.pre .keys,body.pre footer{opacity:0}
.hero,.keys,footer{transition:opacity .4s .3s}
header{cursor:pointer}

/* ブラウザのフォーカス枠は出さない。選んでいるのは輪で示す */
.menu button:focus,.menu button:focus-visible{outline:none}

/* 右下：見出し */
.hero{position:fixed; right:clamp(16px,5vw,72px); bottom:clamp(40px,9vh,90px); z-index:1; text-align:right; max-width:min(60vw,780px); transition:opacity .3s}
.hero h1{font-size:clamp(20px,2.6vw,38px); line-height:1.45}
.hero p{margin-top:.8em; font-size:clamp(12px,1.1vw,15px); color:var(--li)}
body.open .hero{opacity:0}

/* 開く：右から板が滑り込んで中身。メニューと輪は左に残る */
.page{position:fixed; top:0; bottom:0; right:0; width:min(58vw,820px); z-index:4; overflow-x:hidden; overflow-y:auto; color:var(--wh); background:var(--deep);
  border-left:2px solid var(--pu); transform:translateX(102%); transition:transform .52s cubic-bezier(.55,0,.2,1)}
body.open .page{transform:none}
.page .wrap.swap{animation:swap .22s ease-out}
@keyframes swap{from{opacity:0; transform:translateX(16px)}}
.page .wrap{padding:0 clamp(24px,4vw,64px) 60px}
.page .back{position:sticky; float:right; top:20px; margin:20px clamp(16px,3vw,40px) 0 0; right:clamp(16px,4vw,48px); font-size:13px; letter-spacing:.2em; color:var(--li); z-index:7; cursor:pointer}
.page .back:hover{color:var(--wh)}
.page .ph{position:sticky; top:0; z-index:1; background:var(--deep); padding:clamp(72px,11vh,110px) 0 4px; box-shadow:0 14px 14px -10px var(--deep)}   /* 最初の位置のまま動かない */
.page .k{font-size:12px; letter-spacing:.35em; color:var(--li)}
.page h2{font-size:clamp(24px,2.8vw,38px); line-height:1.3; margin:.2em 0 1em}
.page h2::after{content:""; display:block; width:1.6em; height:.1em; background:var(--li); margin-top:.3em}
.page h3{font-size:clamp(16px,1.6vw,20px); line-height:1.6; margin:1.6em 0 .4em}
.page p,.page dd{font-size:15px}
.page b{font-weight:700}
.page dl{display:grid; grid-template-columns:8em 1fr; border-top:1px solid rgba(187,126,234,.3); padding:12px 0; font-size:15px}
.page dt{font-weight:700}
.page .acc{font-size:13px; color:var(--li); margin-top:.4em}
.page a.btn{display:inline-flex; align-items:center; justify-content:center; margin-top:1.8em; min-width:min(100%,380px); height:58px; border-radius:29px; background:var(--pu); color:var(--wh); text-decoration:none; letter-spacing:.1em; cursor:pointer}
.page a.btn:hover{background:var(--pu)}

.keys{position:fixed; left:clamp(16px,4vw,48px); bottom:16px; z-index:3; font-size:11px; letter-spacing:.15em; color:var(--li); opacity:.7}
footer{position:fixed; right:16px; bottom:10px; z-index:3; font-size:11px; color:var(--li); opacity:.7}
footer a{color:inherit}
body.open footer,body.open .keys{opacity:0; pointer-events:none}

@media (max-width:760px){
  .menu{top:auto; bottom:48px; transform:none}
  .menu button{font-size:clamp(26px,9vw,40px)}
  .hero{top:84px; bottom:auto; left:16px; right:16px; text-align:left; max-width:none}
  .keys{display:none}
  .page{width:100%; border-left:0}
}
@media (prefers-reduced-motion:reduce){ .page,.cur{transition:none} .rip,.op{display:none} .cur.joy{animation:none} }
</style>

<div class="op" id="op" aria-hidden="true"><div class="in">

<script>
(function(){
var PAGES = [
  { e:'PHILOSOPHY', html:'<h2 class="g">アルターデザインコンサルティングの企業理念</h2><h3>経営の力で「遊ぶように働く世界」をデザインする</h3><p><b>「遊ぶように働く」</b>とは、楽をすることではなく、<b>人が夢中になり自発的に創造する状態で働く</b>こと<br>子供が遊びに没頭するように、大人も「やらされる」でなく「やりたい」仕事に向き合うこと<br>このような働き方が自然に生まれる組織を、経営の意思と創造の力で意図的に構想し設計していく<br>それが「経営の力で遊ぶように働く世界をデザインする」という当社の企業理念の本質です</p>' },
  { e:'BUSINESS', html:'<h2 class="g">事業内容</h2><p>AI技術を活用した組織最適化に関するコンサルティング事業<br>AIとローコードを組み合わせた次世代型のシステム開発事業</p><h3>AI × ローコードで、「上流工程中心のシステム開発」に革新を</h3><p>コンサルティングによる業務設計からエンジニアリングまでを行います</p>' },
  { e:'SERVICE', html:'<h2 class="g">私たちが提供するサービス</h2>' +
    '<h3>人間中心の次世代業務システム開発</h3><p>業務を効率化するだけでなく、「使う人」を中心に据えて再設計された業務システムを提供<br>ノーコードやローコードなど最新の技術を活用し、直感的で創造性を刺激するワークフローを構築します</p>' +
    '<h3>AI による意思決定支援と事業変革支援</h3><p>経営判断や業務プロセスの高度化を目的に、企業の持つデータ資産を活用した AI 導入を支援<br>未来予測や需要分析など、戦略的な意思決定を加速させるための環境を整備します</p>' +
    '<h3>自律型・共創型の組織設計支援</h3><p>テクノロジーによる分業・協業の再定義を通じて、フラットかつ柔軟な組織体制を実現<br>個人の自律とチームの共創を両立させる、新しい働き方のプラットフォームを提案します</p>' +
    '<h3>地域格差の解消を目指したデジタル支援</h3><p>都市部に偏在するデジタル機会を全国へと広げるため、地方企業・自治体に対するノーコードツールやクラウド AI の導入支援、DX 人材の育成など、地域に根差したデジタル変革を推進します</p>' },
  { e:'COMPANY', html:'<h2 class="g">会社概要</h2>' +
    '<dl><dt>会社名</dt><dd>株式会社アルターデザインコンサルティング</dd></dl><dl><dt>代表者</dt><dd>藤田 靖広</dd></dl>' +
    '<dl><dt>所在地</dt><dd>本社<br>東京都港区西新橋3-23-5 ANYZ304（御成門郵船ビル）<p class="acc">【アクセス】<br>御成門駅 徒歩2分（都営地下鉄三田線）<br>大門駅 徒歩10分（都営地下鉄浅草線・大江戸線）<br>神谷町駅 徒歩10分（東京メトロ日比谷線）<br>汐留駅 徒歩12分（都営大江戸線・ゆりかもめ）<br>虎ノ門ヒルズ駅 徒歩12分（東京メトロ日比谷線）<br>虎ノ門駅 徒歩12分（東京メトロ銀座線）<br>新橋駅 徒歩12分（JR山手線・京浜東北線）<br>浜松町駅 徒歩14分（JR山手線・京浜東北線）</p></dd></dl>' +
    '<dl><dt>事業内容</dt><dd>AI技術を活用した組織最適化に関するコンサルティング事業<br>AIとローコードを組み合わせた次世代型のシステム開発事業</dd></dl>' +
    '<dl><dt>資本金</dt><dd>60百万円</dd></dl><dl><dt>設立年月日</dt><dd>2025年6月</dd></dl>' +
    '<dl><dt>株主</dt><dd>株式会社ＢｌｕｅＭｅｍｅ<br>株式会社ハイ・アベイラビリティ・システムズ<br>株式会社サーバーワークス・キャピタル<br>リックソフト株式会社</dd></dl>' },
  { e:'CONTACT', html:'<h2 class="g">お問い合わせ</h2><p>サービスに関するご相談や、掲載のご依頼、<br>その他ご質問などがございましたら<br>お気軽にお問い合わせください</p><a class="btn" href="mailto:contact@alt-dsgn.co.jp">お問い合わせフォームへ</a>' }
];
var RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
var btns = [].slice.call(document.querySelectorAll('.menu button')), cur = document.getElementById('cur');

/* 選ぶ：輪が文字を囲む */

}

var kx = 0, ky = 0;   /* キーで選び始めたときのマウスの位置 */

  if (document.body.classList.contains('keys')){ if (Math.hypot(mx - kx, my - ky) < 24) return; document.body.classList.remove('keys'); }

  var hit = -1;
  btns.forEach(function(b, k){ var r = b.getBoundingClientRect(); if (mx > r.left - 18 && mx < r.right + 18 && my > r.top - 18 && my < r.bottom + 18) hit = k; });

  document.body.appendChild(rp); setTimeout(function(){ rp.remove(); }, 450);

document.addEventListener('mouseleave', function(){ document.body.classList.remove('live'); });

function frame(){
  var gx = mx, gy = my, w = 44, h = 44;

  var under = snapped < 0 && document.elementFromPoint(mx, my), act = under && under.closest && under.closest('a, button:not(.menu button)');

  if (act){ var ar = act.getBoundingClientRect(); gx = ar.left + ar.width / 2; gy = ar.top + ar.height / 2; w = ar.width + 22; h = ar.height + 14; }

  var aim = snapped < 0 && !act && !onText && !document.body.classList.contains('keys') && window.__onTarget && window.__onTarget(mx, my);

  x += (gx - x) * (RM ? 1 : .45); y += (gy - y) * (RM ? 1 : .45);

  cur.style.setProperty('--w', w + 'px'); cur.style.setProperty('--hh', h + 'px');
  dot.style.setProperty('--mx', mx + 'px'); dot.style.setProperty('--my', my + 'px');
  requestAnimationFrame(frame);
}

/* 開く：右から板。開いたまま別の項目を押すと、中身だけ入れ替わる */
function bump(b, x, y){
  if (RM) return;
  var r = b.getBoundingClientRect(), dx = r.left + r.width / 2 - x, dy = r.top + r.height / 2 - y, d = Math.hypot(dx, dy) || 1;
  if (x == null){ dx = 1; dy = 0; d = 1; }   /* キーで押したときは右へ */
  b.style.setProperty('--bx', (dx / d * 7).toFixed(1) + 'px'); b.style.setProperty('--by', (dy / d * 7).toFixed(1) + 'px');
  b.classList.remove('bump'); void b.offsetWidth; b.classList.add('bump');
}
function open(i){
  pick(i);
  /* 見出し（英字と題）は板の上に残る */
  var h = PAGES[i].html, cut = h.indexOf('</h2>') + 5;
  wrap.innerHTML = '<div class="ph"><span class="k">' + PAGES[i].e + '</span>' + h.slice(0, cut) + '</div>' + h.slice(cut); page.scrollTop = 0;
  if (opened && !RM){ wrap.classList.remove('swap'); void wrap.offsetWidth; wrap.classList.add('swap'); }
  opened = true; document.body.classList.add('open');
}
function close(){ opened = false; document.body.classList.remove('open'); }

btns.forEach(function(b, i){
  b.addEventListener('click', function(e){ if (e.detail) bump(b, e.clientX, e.clientY); else bump(b); open(i); });
  b.addEventListener('animationend', function(){ b.classList.remove('bump'); });
  b.addEventListener('focus', function(){ pick(i); snapTo(i); });
});
document.getElementById('back').addEventListener('click', close);
addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ close(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); var n = sel < 0 ? 0 : sel + (e.key === 'ArrowDown' ? 1 : -1); snapTo((n + btns.length) % btns.length); btns[sel].focus({preventScroll:true}); if (!document.body.classList.contains('keys')){ kx = mx; ky = my; } document.body.classList.add('keys'); if (opened) open(sel); }
  if (e.key === 'Enter' && sel >= 0 && document.activeElement && document.activeElement.tagName !== 'A'){ e.preventDefault(); bump(btns[sel]); open(sel); }
});


/* 隠し：左上のロゴを素早く 5 回押すと、輪がくるっと回る */
var taps = [];
document.getElementById('logo').addEventListener('click', function(){
  var now = performance.now(); taps = taps.filter(function(t){ return now - t < 1600; }); taps.push(now);
  if (taps.length >= 5){ taps = []; cur.classList.remove('joy'); void cur.offsetWidth; cur.classList.add('joy'); setTimeout(function(){ cur.classList.remove('joy'); }, 1600); }
});

/* 背景：照準。決まった 6 か所（3 列×2 段）のどこかにいる。撃つと、撃った向きにある場所へ跳ぶ */
(function(){
  var bgEl = document.getElementById('bg');
  var ret = document.createElement('div'); ret.className = 'ret';
  ret.innerHTML = '<i class="hx"></i><i class="vy"></i><div class="core"><i class="rg"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i><i class="tk"></i></div>';
  bgEl.appendChild(ret);
  var R = 0, slot = 1, SL = [], combo = 0, lastHit = 0;
  function slots(){
    /* 照準が画面に収まり、メニュー（左）とは重ならない位置 */
    var W = innerWidth, H = innerHeight, x0 = Math.max(W * .46, 420 + R), x1 = W - R - 24, y0 = R + 24, y1 = H - R - 24;
    SL = [];
    for (var row = 0; row < 2; row++) for (var col = 0; col < 3; col++) SL.push({ x:x0 + (x1 - x0) * col / 2, y:y0 + (y1 - y0) * row });
  }
  function size(){
    R = Math.min(innerWidth * .2, innerHeight * .22);
    var rg = ret.querySelector('.rg'), bw = R * .26, core = ret.querySelector('.core');
    /* 描き直しの覆いを掛けるので、入れ物は輪の大きさにする */
    core.style.left = core.style.top = (-R) + 'px'; core.style.width = core.style.height = (R * 2) + 'px';
    rg.style.left = rg.style.top = '0px'; rg.style.width = rg.style.height = (R * 2) + 'px'; rg.style.borderWidth = bw + 'px';
    var t = ret.querySelectorAll('.tk'), L = R * .16, w = 2, c = R - bw - 6 - L / 2;
    [[0, -c, w, L], [0, c, w, L], [-c, 0, L, w], [c, 0, L, w]].forEach(function(k, n){
      var e = t[n]; e.style.width = k[2] + 'px'; e.style.height = k[3] + 'px'; e.style.left = (R + k[0] - k[2] / 2) + 'px'; e.style.top = (R + k[1] - k[3] / 2) + 'px';
    });
    slots(); put();
  }
  function put(){ ret.style.setProperty('--sx', SL[slot].x + 'px'); ret.style.setProperty('--sy', SL[slot].y + 'px'); }
  size(); addEventListener('resize', size);
  function fx(cls, x, y){ var e = document.createElement('i'); e.className = cls; e.style.left = x + 'px'; e.style.top = y + 'px'; document.body.appendChild(e); setTimeout(function(){ e.remove(); }, 650); return e; }
  /* カーソルが照準の上にいるか（輪の中） */
  window.__onTarget = function(x, y){ var c = SL[slot]; return !ret.classList.contains('gone') && Math.hypot(x - c.x, y - c.y) <= R; };
  window.__shoot = function(x, y){
    var c = SL[slot], dx = c.x - x, dy = c.y - y, d = Math.hypot(dx, dy);
    if (d > R) return false;   /* 輪の中だけが当たり */
    if (d < 1){ dx = 1; dy = 0; d = 1; }
    var ux = dx / d, uy = dy / d;
    /* 撃った向き（当たった所から中心へ）にある場所のうち、いちばん向きが合うところへ。なければいちばん遠いところ */
    var best = -1, bs = -1e9;
    SL.forEach(function(p, n){ if (n === slot) return; var vx = p.x - c.x, vy = p.y - c.y, l = Math.hypot(vx, vy), sc = (vx * ux + vy * uy) / l; if (sc > bs){ bs = sc; best = n; } });
    slot = best;
    if (RM){ put(); return true; }
    /* 当たった瞬間：光と×だけ出して、0.06 秒止める（ヒットストップ） */
    var now = performance.now(); combo = now - lastHit < 1400 ? Math.min(combo + 1, 5) : 1; lastHit = now;
    ret.classList.add('hit');
    fx('hm', x, y);
    var from = { x:c.x, y:c.y };
    setTimeout(function(){
      ret.classList.remove('hit');
      /* 輪が割れる：弧の欠片が、撃った向きへ吹き飛ぶ（続けて当てるほど多く） */
      var n = 6 + combo * 2, bw = R * .26;
      for (var k = 0; k < n; k++){
        var a0 = k / n * Math.PI * 2, a1 = (k + .8) / n * Math.PI * 2, rr = R - bw / 2;
        var pc = document.createElement('div'); pc.className = 'pc';
        pc.style.left = (from.x - R) + 'px'; pc.style.top = (from.y - R) + 'px';
        pc.innerHTML = '<svg width="' + (R * 2) + '" height="' + (R * 2) + '"><path d="M' + (R + Math.cos(a0) * rr) + ' ' + (R + Math.sin(a0) * rr) + ' A' + rr + ' ' + rr + ' 0 0 1 ' + (R + Math.cos(a1) * rr) + ' ' + (R + Math.sin(a1) * rr) + '" fill="none" stroke="' + (k % 3 ? '#5a2f84' : '#d7ff3a') + '" stroke-width="' + bw + '" stroke-linecap="butt"/></svg>';
        var am = (a0 + a1) / 2, out = R * (.6 + Math.random() * .8);
        pc.style.setProperty('--dx', (Math.cos(am) * out + ux * R * 1.2) + 'px');
        pc.style.setProperty('--dy', (Math.sin(am) * out + uy * R * 1.2) + 'px');
        pc.style.setProperty('--rot', ((Math.random() - .5) * 120) + 'deg');
        pc.style.transformOrigin = R + 'px ' + R + 'px';
        document.body.appendChild(pc); setTimeout(function(e){ e.remove(); }, 600, pc);
      }
      /* 衝撃の輪：当たった所から一つ広がる（続けて当てるほど大きく） */
      var sw = document.createElement('i'), sz = R * (2.2 + combo * .35); sw.className = 'sw';
      sw.style.left = x + 'px'; sw.style.top = y + 'px'; sw.style.width = sw.style.height = sz + 'px';
      document.body.appendChild(sw); setTimeout(function(){ sw.remove(); }, 450);
      for (var q = 0; q < 7; q++){ var sp = fx('sp', x, y), a = Math.atan2(uy, ux) + (Math.random() - .5) * .9; sp.style.setProperty('--a', a + 'rad'); sp.style.setProperty('--d', (70 + Math.random() * 90) + 'px'); }
      document.documentElement.style.setProperty('--kx', (ux * 8) + 'px'); document.documentElement.style.setProperty('--ky', (uy * 8) + 'px');
      document.body.classList.remove('kick'); void document.body.offsetWidth; document.body.classList.add('kick');
      /* 輪は消えて、十字の線だけが次の場所へ。着いたら輪が一筆で描かれる */
      ret.classList.remove('draw', 'pop'); ret.classList.add('gone');
      put();
      setTimeout(function(){ ret.classList.remove('gone'); void ret.offsetWidth; ret.classList.add('draw'); }, 380);
      setTimeout(function(){ ret.classList.remove('draw'); ret.classList.add('pop'); }, 720);
    }, 60);
    return true;
  };
})();

/* OP：輪が描かれて社名 → メニューが順に出る。押すかキーで飛ばせる */
var op = document.getElementById('op');
function endOp(){ if (!op || op.classList.contains('out')) return; op.classList.add('out'); document.body.classList.remove('pre'); setTimeout(function(){ if (op){ op.remove(); op = null; } }, 400); }
if (RM){ op.remove(); op = null; }
else { document.body.classList.add('pre'); setTimeout(endOp, 1500); op.addEventListener('pointerdown', endOp); addEventListener('keydown', endOp, {once:true}); }

requestAnimationFrame(frame);
