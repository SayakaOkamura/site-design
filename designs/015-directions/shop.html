<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>15 みせ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
/* 質感の決まり：ドット一つ = --p（窓から整数で決める）。枠・線・絵は全部その倍数。色は 6 つだけ。字は 16px */
:root{ --D:#24132b; --M:#8a5a92; --W:#62396b; --A:#fb851b; --L:#f8eef6; --S:#dcb6df; --p:4px; }   /* 紫の一系統（D・W・M・S・L）＋差し色の橙（A）。橙は押せる物・光る物だけ */
:root[data-p="logo"]{ --D:#22417d; --M:#5d2e77; --W:#5376ab; --A:#399ac5; --L:#f6f3fa; --S:#f6f3fa; }
/* ?p=fc：ファミコンっぽい色。黒い地に、少しずれた原色 */
:root[data-p="fc"]{ --D:#000000; --M:#0000bc; --W:#ac7c00; --A:#f83800; --L:#fcfcfc; --S:#fca044; }
/* ?p=gb：ゲームボーイっぽい色。緑がかった一色の濃淡 4 段 */
:root[data-p="gb"]{ --D:#0f380f; --W:#306230; --M:#8bac0f; --S:#9bbc0f; --L:#9bbc0f; --A:#0f380f; }
:root[data-p="gb"] .sign,:root[data-p="gb"] .facade .board,:root[data-p="gb"] .talk .who,:root[data-p="gb"] .talk .nx,:root[data-p="gb"] .card h2,:root[data-p="gb"] .bye h2{color:var(--L)}
/* ?p=cli：端末っぽい色。黒い地に琥珀色の濃淡だけ */
:root[data-p="cli"]{ --D:#000000; --M:#1a1000; --W:#4a3000; --A:#ffcc33; --L:#ffb000; --S:#a87400; }
/* ?p=98：PC-98 っぽい色。くすんだ中間色で色相はばらばら（壁は青灰、木は茶）。影と色の段差は網点（ドットの市松） */
:root[data-p="98"]{ --D:#101020; --M:#5a6e8c; --W:#7a5038; --A:#e0603a; --L:#f0ece0; --S:#d8c08a;
  --dz:repeating-conic-gradient(var(--D) 0 25%,transparent 0 50%) 0 0/calc(var(--p)*2) calc(var(--p)*2); }
:root[data-p="98"] .panel::before{content:""; position:absolute; left:0; right:0; top:0; height:calc(var(--p)*4); background:var(--dz); z-index:0; pointer-events:none}
:root[data-p="98"] .floor{background:linear-gradient(var(--D),var(--D)) 0 calc(var(--p)*4)/100% 100% no-repeat,repeating-conic-gradient(var(--M) 0 25%,var(--D) 0 50%) 0 0/calc(var(--p)*2) calc(var(--p)*2)}
:root[data-p="98"] .floor::before{display:none}
:root[data-p="98"] .facade .wallf::after{content:""; position:absolute; left:0; right:0; top:0; height:calc(var(--p)*4); background:var(--dz)}
:root[data-p="98"] .facade .wallf::before{content:""; position:absolute; left:0; right:0; bottom:0; height:calc(var(--p)*4); background:var(--dz)}
/* 店の中の壁も外と同じ茶の横板。青灰は扉・小物だけ */
:root[data-p="98"] .game .wallbg,:root[data-p="98"] .game{background:repeating-linear-gradient(var(--W) 0 calc(var(--p)*4),var(--D) calc(var(--p)*4) calc(var(--p)*5))}
:root[data-p="98"] .door{background:var(--M)}
:root[data-p="98"] .counter{background:repeating-linear-gradient(90deg,var(--M) 0 calc(var(--p)*7),var(--D) calc(var(--p)*7) calc(var(--p)*8))}
:root[data-p="98"] .shelf,:root[data-p="98"] .counter{border-color:var(--D)}
:root[data-p="98"] .shelf{border:calc(var(--p)*2) solid var(--D); border-bottom:0}
:root[data-p="98"] .tier{border-bottom-color:var(--D)}
:root[data-p="98"] .front .ground{background:linear-gradient(var(--D),var(--D)) 0 calc(var(--p)*2)/100% 100% no-repeat,repeating-conic-gradient(var(--M) 0 25%,var(--D) 0 50%) 0 0/calc(var(--p)*2) calc(var(--p)*2)}

*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{background:var(--D); color:var(--L); font-family:"DotGothic16",monospace; font-size:16px; line-height:1.75; overflow:hidden; -webkit-font-smoothing:none}
button{font:inherit}
.sprite{display:block; height:auto; image-rendering:pixelated; shape-rendering:crispEdges}
.wallbg{background:repeating-linear-gradient(90deg,var(--M) 0 calc(var(--p)*5),var(--D) calc(var(--p)*5) calc(var(--p)*6))}

/* ===== 店の中 ===== */
.game{position:fixed; inset:0 0 68px 0; overflow:hidden;
  background:linear-gradient(transparent 84%,var(--W) 84% calc(84% + var(--p)),var(--D) calc(84% + var(--p)) calc(84% + var(--p)*2),var(--M) calc(84% + var(--p)*2) calc(84% + var(--p)*2),var(--D) calc(84% + var(--p)*2)),repeating-linear-gradient(90deg,var(--M) 0 calc(var(--p)*5),var(--D) calc(var(--p)*5) calc(var(--p)*6))}
/* 一枚の幅は画面の 76%。両隣が 12% ずつ見える */
.strip{position:absolute; top:0; bottom:0; left:12vw; width:228vw; display:grid; grid-template-columns:repeat(3,76vw);
  transform:translateX(-76vw); transition:transform .42s steps(7)}
.panel{position:relative; overflow:hidden}
.panel.side{cursor:pointer}
.floor{position:absolute; left:0; right:0; bottom:0; height:16%; background:var(--D); border-top:var(--p) solid var(--W)}
.floor{background:linear-gradient(90deg,var(--D) calc(var(--p)*5),transparent 0) 0 calc(var(--p)*2)/calc(var(--p)*6) calc(var(--p)*4),linear-gradient(var(--D) calc(var(--p)*3),var(--M) 0) 0 calc(var(--p)*2)/calc(var(--p)*6) calc(var(--p)*4),var(--D)}
.floor::before{content:""; position:absolute; left:0; right:0; top:calc(var(--p)*2); height:var(--p); background:var(--M)}

/* 真ん中：店主とカウンター */
.keeper{position:absolute; left:50%; bottom:calc(16% + var(--p)*12); transform:translateX(-50%)}
.counter{position:absolute; left:50%; transform:translateX(-50%); width:calc(var(--p)*48); bottom:16%; height:calc(var(--p)*13);
  background:var(--W); border:var(--p) solid var(--D); border-top:calc(var(--p)) solid var(--S)}
.counter{background:repeating-linear-gradient(90deg,var(--W) 0 calc(var(--p)*7),var(--D) calc(var(--p)*7) calc(var(--p)*8)); box-shadow:inset 0 calc(var(--p)*-1) 0 var(--D)}
.counter::before{content:""; position:absolute; left:0; right:0; top:0; height:var(--p); background:var(--S)}
.counter::after{content:""; position:absolute; left:calc(var(--p)*3); right:calc(var(--p)*3); top:calc(var(--p)*4); height:var(--p); background:var(--D)}
.sign{position:absolute; top:6%; left:50%; transform:translateX(-50%); padding:var(--p) calc(var(--p)*2); border:var(--p) solid var(--W); background:var(--D); color:var(--A); letter-spacing:.15em; white-space:nowrap}
.moya{position:absolute; left:calc(50% + var(--p)*7); bottom:calc(16% + var(--p)*35); cursor:pointer; display:none; z-index:2}
.moya.show{display:block}
.moya:hover{translate:0 calc(var(--p)*-1)}

/* 扉（出口） */
.door{box-shadow:inset calc(var(--p)*-1) 0 0 var(--D); position:absolute; right:4%; bottom:16%; width:calc(var(--p)*10); height:calc(var(--p)*21); background:var(--W); border:var(--p) solid var(--D); cursor:pointer; padding:0}
.door::before{content:""; position:absolute; left:calc(var(--p)*2); right:calc(var(--p)*2); top:calc(var(--p)*2); height:calc(var(--p)*5); background:var(--D)}
.door::after{content:""; position:absolute; right:calc(var(--p)*2); top:calc(var(--p)*11); width:calc(var(--p)); height:calc(var(--p)); background:var(--S)}
.door .plate{position:absolute; left:50%; bottom:calc(100% + var(--p)); transform:translateX(-50%); background:var(--L); color:var(--D); padding:0 calc(var(--p)); border:var(--p) solid var(--D); white-space:nowrap; line-height:1.4}
.door .arrow{position:absolute; left:50%; bottom:calc(100% + var(--p)*5); transform:translateX(-50%); color:var(--A); display:none; animation:bob .8s steps(2) infinite}
.door.ready .arrow{display:block}
.door:hover{background:var(--M)}

/* 左：商品棚（二段）。同じ品を三つ並べる。箱は 10×12 ドット */
.shelf{box-shadow:inset var(--p) var(--p) 0 var(--D); position:absolute; left:4%; right:4%; bottom:16%; border:calc(var(--p)*2) solid var(--W); border-bottom:0; background:var(--D); display:grid}
.tier{box-shadow:inset 0 calc(var(--p)*-1) 0 var(--D); border-bottom:calc(var(--p)*2) solid var(--W); display:flex; justify-content:space-evenly; align-items:flex-end; padding:calc(var(--p)*6) calc(var(--p)*2) 0}
.grp{position:relative; width:calc(var(--p)*31); height:calc(var(--p)*12); background:none; border:0; padding:0; cursor:pointer}
.panel:not(.here) .grp,.panel:not(.here) .poster{pointer-events:none}
.grp .box{position:absolute; bottom:0; width:calc(var(--p)*10); height:calc(var(--p)*12); padding:calc(var(--p)*3) 0 0}
.grp .box:nth-child(1){left:0}
.grp .box:nth-child(2){left:calc(var(--p)*10)}
.grp .box:nth-child(3){left:calc(var(--p)*20)}
.grp:hover .box{translate:0 calc(var(--p)*-1)}
.grp .box span{display:none}
.grp .box .sprite{background:none; padding:0}
/* 値札：棚板から下げる */
.ptag{position:absolute; left:50%; top:calc(100% + var(--p)*2); transform:translateX(-50%); z-index:1; background:var(--L); color:var(--D); border:var(--p) solid var(--D);
  line-height:1.4; padding:0 calc(var(--p)); white-space:nowrap}
.grp:hover .ptag{background:var(--A)}

/* 品はパッケージ。正面に名前が刷ってある */
.box{--bc:var(--S); --bt:var(--D); position:relative; background:var(--bc); color:var(--bt);
  border:var(--p) solid var(--D); box-shadow:var(--p) 0 0 var(--D);
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start; gap:calc(var(--p)); padding:calc(var(--p)*4) calc(var(--p)) calc(var(--p)); transition:translate .1s steps(2)}
.box::before{content:""; position:absolute; top:calc(var(--p)); left:0; right:0; height:var(--p); background:var(--D)}
.box .sprite{background:var(--D); padding:var(--p); box-sizing:content-box}
.box span{line-height:1.4; text-align:center; white-space:pre-line}
.box.c1{--bc:var(--L)} .box.c2{--bc:var(--L)} .box.c3{--bc:var(--S)}

/* 右：貼り紙と看板（傾けずに重ねる） */
.wall{position:absolute; left:4%; right:4%; top:6%; height:calc(var(--p)*48)}
.poster{position:absolute; background:none; border:0; padding:0; cursor:pointer; color:var(--D); text-align:center; transition:translate .1s steps(2)}
.poster:hover{translate:0 calc(var(--p)*-1); z-index:4}
.pp{outline:0; position:relative; border:var(--p) solid var(--D); box-shadow:var(--p) var(--p) 0 var(--D); padding:calc(var(--p)*2); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--p); line-height:1.4; width:100%; height:100%}
.pin::before,.pin::after{content:""; position:absolute; top:var(--p); width:calc(var(--p)); height:calc(var(--p)); background:var(--A)}
.pin::before{left:var(--p)} .pin::after{right:var(--p)}
.tape::before{content:""; position:absolute; top:calc(var(--p)*-2); left:50%; width:calc(var(--p)*6); height:calc(var(--p)*2); translate:-50% 0; background:var(--L); border:var(--p) solid var(--M)}
.pp small{font-size:16px}
.pp b{font-weight:400; white-space:pre-line}
.p-rinen .pp{background:var(--L)}
.p-jigyo .pp{background:var(--W); color:var(--L)}
.p-jigyo .pp::before,.p-jigyo .pp::after{background:var(--S)}
.p-gaiyo .pp{background:var(--S)}
.p-map .pp{background:var(--L)}
/* 飾りの紙（押せない） */
.scrap{position:absolute; border:var(--p) solid var(--D); pointer-events:none;
  background:repeating-linear-gradient(var(--bg,var(--L)) 0 calc(var(--p)*2),var(--M) calc(var(--p)*2) calc(var(--p)*3))}
.scrap.dots{background:linear-gradient(90deg,var(--bg,var(--L)) calc(var(--p)*2),transparent 0) 0 0/calc(var(--p)*3) calc(var(--p)*3),linear-gradient(var(--bg,var(--L)) calc(var(--p)*2),var(--D) 0) 0 0/calc(var(--p)*3) calc(var(--p)*3)}

/* 左右（端に寄せたときだけ） */
.turn{position:absolute; top:0; bottom:0; width:12vw; z-index:3; background:none; border:0; color:var(--A); font-size:32px; cursor:pointer; opacity:0; transition:opacity .15s steps(2)}
.turn:hover,.turn:focus-visible{opacity:1}
.turn.l{left:0} .turn.r{right:0}
.turn[hidden]{display:none}

/* 手に取る（裏面） */
.look{position:absolute; inset:0; z-index:5; display:none; place-items:center; background:repeating-linear-gradient(0deg,var(--D) 0 var(--p),transparent var(--p) calc(var(--p)))}
.look.show{display:grid; animation:pop .18s steps(3)}
.card{width:min(90%,680px); display:grid; grid-template-columns:auto 1fr; gap:calc(var(--p)*3); align-items:center;
  background:var(--D); border:var(--p) solid var(--L); box-shadow:0 0 0 var(--p) var(--D); padding:calc(var(--p)*3); position:relative; max-height:calc(100% - 24px); overflow:auto}
.card #big .box{width:calc(var(--p)*18)}
.card #big .poster{pointer-events:none; position:relative}
.card h2{font-size:16px; font-weight:400; color:var(--A); margin-bottom:var(--p); line-height:1.6}
.card p{white-space:pre-line}
.card .x{position:absolute; top:var(--p); right:calc(var(--p)); background:none; border:0; color:var(--L); cursor:pointer}
.askb{position:absolute; top:22%; background:none; border:0; padding:0; cursor:pointer; color:var(--D); font-size:32px; line-height:1}
.askb span{position:absolute; left:0; right:0; top:14%; text-align:center}
.look.kr .askb{right:3vw} .look.kr .askb svg{transform:scaleX(-1)}
.look.kl .askb{left:3vw}
.askb:hover{translate:0 calc(var(--p)*-1)}

/* 会話のときだけ出るテキストウィンドウ */
.talk{position:absolute; left:50%; bottom:calc(var(--p)*2); transform:translateX(-50%); width:min(92%,760px); z-index:6;
  background:var(--D); border:var(--p) solid var(--L); box-shadow:0 0 0 var(--p) var(--D);
  padding:calc(var(--p)*2) calc(var(--p)*3) calc(var(--p)*2); cursor:pointer; display:none}
.talk.show{display:block; animation:pop .15s steps(2)}
.talk .who{color:var(--A)}
.talk .txt{min-height:3.5em; white-space:pre-wrap}
.talk .nx{position:absolute; right:calc(var(--p)*2); bottom:var(--p); color:var(--A); animation:blink .7s steps(1) infinite; display:none}
.talk.done .nx{display:block}

/* 質問バー：レトロにしないが、地の色に馴染ませる */
.ask{position:fixed; left:0; right:0; bottom:0; height:68px; background:var(--D);
  display:flex; align-items:center; gap:10px; padding:0 max(16px,calc(50% - 360px));
  font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif; transition:opacity .3s}
.ask input{flex:1; min-width:0; height:42px; border:1px solid color-mix(in srgb,var(--L) 22%,transparent); border-radius:21px;
  background:color-mix(in srgb,var(--L) 8%,transparent); padding:0 18px; font:inherit; font-size:15px; color:var(--L); outline:none}
.ask input::placeholder{color:color-mix(in srgb,var(--L) 45%,transparent)}
.ask input:focus{border-color:var(--A); background:color-mix(in srgb,var(--L) 12%,transparent)}
.ask button{height:42px; padding:0 20px; border:0; border-radius:21px; background:var(--A); color:var(--D); font-size:14px; font-weight:600; cursor:pointer}
.ask button:disabled{opacity:.3; cursor:default}
body.outside .ask{opacity:0; pointer-events:none}

/* ===== 店の外（入口・出口） ===== */
.front{position:fixed; inset:0; z-index:10; display:grid; justify-items:center; align-content:end; transition:opacity .4s steps(4)}
.front[hidden]{display:none}
.front.fade{opacity:0; pointer-events:none}
.facade{position:relative; width:calc(100vw - var(--p)*36); max-width:calc(var(--p)*150); height:calc(100vh - var(--p)*14); margin-bottom:calc(var(--p)*6); display:grid; justify-items:center; align-content:end}
.facade .roof{box-shadow:0 var(--p) 0 var(--D); position:absolute; top:0; left:calc(var(--p)*-4); right:calc(var(--p)*-4); height:calc(var(--p)*9); border:var(--p) solid var(--D);
  background:repeating-linear-gradient(90deg,var(--W) 0 calc(var(--p)*5),var(--S) calc(var(--p)*5) calc(var(--p)*10))}
.facade .board{position:absolute; top:calc(var(--p)*12); left:50%; transform:translateX(-50%); padding:var(--p) calc(var(--p)*2); border:var(--p) solid var(--D); background:var(--D); color:var(--A); letter-spacing:.15em; white-space:nowrap; z-index:1}
.facade .wallf{background:repeating-linear-gradient(var(--W) 0 calc(var(--p)*4),var(--D) calc(var(--p)*4) calc(var(--p)*5)) !important; position:absolute; top:calc(var(--p)*9); left:0; right:0; bottom:0; background:var(--W); border:var(--p) solid var(--D); border-top:0}
.facade .win{position:absolute; bottom:calc(var(--p)*7); width:calc(var(--p)*14); height:calc(var(--p)*14); background:var(--D); border:var(--p) solid var(--S)}
.facade .win::after{content:""; position:absolute; left:calc(50% - var(--p)/2); top:0; bottom:0; width:var(--p); background:var(--S)}
.facade .win.l{left:calc(25% - var(--p)*10)} .facade .win.r{right:calc(25% - var(--p)*10)}
/* 店の前の物（飾り。押しても何も起きない） */
.deco{position:absolute; bottom:0; z-index:1; pointer-events:none}
.post{position:absolute; right:calc(var(--p)*4); bottom:calc(var(--p)*6); width:calc(var(--p)*10); display:grid; justify-items:center; pointer-events:none}
.post b{display:block; width:100%; height:calc(var(--p)*12); background:var(--M); border:var(--p) solid var(--D); box-shadow:inset calc(var(--p)*-1) 0 0 var(--D); position:relative}
.post b::before{content:""; position:absolute; left:calc(var(--p)*2); right:calc(var(--p)*2); top:calc(var(--p)*3); height:var(--p); background:var(--D)}
.post i{display:block; width:calc(var(--p)*2); height:calc(var(--p)*8); background:var(--D)}

.fdoor{position:relative; z-index:1; width:calc(var(--p)*16); height:calc(var(--p)*30); background:var(--D); border:var(--p) solid var(--D); border-bottom:0; cursor:pointer; padding:0}
.fdoor .leaf{position:absolute; inset:0; background:var(--M); box-shadow:inset calc(var(--p)*-1) 0 0 var(--D); transform-origin:left center; transition:transform .5s steps(5)}
.fdoor .leaf::before{content:""; position:absolute; left:calc(var(--p)*3); right:calc(var(--p)*3); top:calc(var(--p)*3); height:calc(var(--p)*7); background:var(--D)}
.fdoor .leaf::after{content:""; position:absolute; right:calc(var(--p)*2); top:calc(var(--p)*16); width:calc(var(--p)*2); height:calc(var(--p)*2); background:var(--S)}
.fdoor .tag{position:absolute; left:50%; top:calc(var(--p)*12); transform:translateX(-50%); background:var(--L); color:var(--D); padding:0 calc(var(--p)); border:var(--p) solid var(--D); z-index:1; white-space:nowrap; line-height:1.4}
.fdoor.open .leaf{transform:scaleX(.15)}
.fdoor.open .tag{display:none}
.fdoor:hover .leaf{background:var(--W)}
.hint{position:absolute; left:50%; bottom:calc(100% + var(--p)); transform:translateX(-50%); color:var(--A); animation:bob .8s steps(2) infinite}
.bell{position:absolute; left:62%; top:30%; color:var(--L); display:none; animation:pop .2s steps(3); white-space:nowrap; z-index:2}
.bell.show{display:block}
.ground{position:fixed; left:0; right:0; bottom:0; height:calc(var(--p)*6); background:var(--D); border-top:var(--p) solid var(--W)}

/* 出口の外：フッターの役 */
.bye{position:relative; z-index:1; width:min(92vw,560px); margin-top:calc(var(--p)*3); text-align:center}
.bye h2{font-weight:400; font-size:16px; color:var(--A); margin-bottom:var(--p)}
.bye .msg{margin:calc(var(--p)*2) 0}
.bye .btns{display:flex; gap:calc(var(--p)*2); justify-content:center; flex-wrap:wrap}
.bye a,.bye button{display:inline-block; padding:var(--p) calc(var(--p)*2); border:var(--p) solid var(--L); color:var(--L); background:var(--D); text-decoration:none; cursor:pointer}
.bye a.main{background:var(--A); border-color:var(--A); color:var(--D)}
.bye a:hover,.bye button:hover{background:var(--M)}
#exitF .bye{position:absolute; left:50%; bottom:calc(var(--p)*3); transform:translateX(-50%); width:min(92%,760px); margin:0; z-index:3;
  background:var(--D); border:var(--p) solid var(--L); box-shadow:0 0 0 var(--p) var(--D); padding:calc(var(--p)*2) calc(var(--p)*4) calc(var(--p)*3); max-height:calc(100% - var(--p)*4); overflow:auto}

@keyframes blink{50%{opacity:0}}
@keyframes bob{50%{translate:0 -4px}}
@keyframes pop{from{scale:.7}to{scale:1}}

function px(svg, rows){
  const w = Math.max(...rows.map(r=>r.length)), h = rows.length;
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  let out = '';
  rows.forEach((r,y)=>{ [...r].forEach((ch,x)=>{ const c = MAP[ch]; if (c) out += `<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${PAL[c]}"/>`; }); });

  svg.dataset.w = w;
}

}

function boxOf(it, i, k){
  const d = document.createElement('div'); d.className = 'box c' + i;
  const t = document.createElement('span'); t.textContent = it.short;
  d.append(svgOf(SPR[it.spr], k), t); return d;
}
function posterOf(it){
  const b = document.createElement('div'); b.className = 'poster ' + it.cls;
  const pp = document.createElement('div'); pp.className = 'pp';
  const sm = document.createElement('small'); sm.textContent = it.label;
  const bb = document.createElement('b'); bb.textContent = it.face;
  if (it.art) pp.append(sm, svgOf(ART[it.art], it.k || 1), bb); else pp.append(sm, bb);
  b.append(pp); return b;
}

let view = 1;
function look(v){
  view = Math.max(0, Math.min(2, v));
  $('strip').style.transform = `translateX(${[-12, -76, -140][view]}vw)`;   /* 端では帯の外を見せない */
  document.querySelectorAll('.panel').forEach(p=>{ const here = +p.dataset.v === view; p.classList.toggle('here', here); p.classList.toggle('side', !here); });
  $('tl').hidden = view === 0; $('tr').hidden = view === 2;
  $('moya').classList.toggle('show', view === 1);
}
document.querySelectorAll('.panel').forEach(p=>p.addEventListener('click', ()=>{ if (+p.dataset.v !== view) look(+p.dataset.v); }));
$('tl').onclick = ()=>look(view-1);
$('tr').onclick = ()=>look(view+1);
document.addEventListener('keydown', e=>{
  if (document.activeElement === $('q') || document.body.classList.contains('outside')) return;
  if (e.key === 'Escape') { closeLook(); return; }
  if ($('look').classList.contains('show')) return;
  if (e.key === 'ArrowLeft') look(view-1);
  if (e.key === 'ArrowRight') look(view+1);
  if ((e.key === 'Enter' || e.key === ' ') && $('talk').classList.contains('show')){ e.preventDefault(); next(); }
});
let tx = null;
$('game').addEventListener('touchstart', e=>{ tx = e.touches[0].clientX; }, {passive:true});
$('game').addEventListener('touchend', e=>{
  if (tx === null || $('look').classList.contains('show')) { tx = null; return; }
  const d = e.changedTouches[0].clientX - tx; tx = null;
  if (Math.abs(d) > 40) look(view + (d < 0 ? 1 : -1));
});

let curItem = null;
const seen = new Set(); let allDone = false;
function show(id){
  curItem = ALL.find(x=>x.id === id);
  const isGoods = GOODS.includes(curItem);
  look(isGoods ? 0 : 2);
  hideTalk();
  $('big').replaceChildren(isGoods ? boxOf(curItem, GOODS.indexOf(curItem), 2) : posterOf(curItem));
  if (!isGoods){ const b = $('big').firstChild; b.style.width = 'calc(var(--p)*' + curItem.pos[2] + ')'; b.style.height = 'calc(var(--p)*' + curItem.pos[3] + ')'; }
  $('bname').textContent = curItem.name;
  $('bdesc').textContent = curItem.desc;
  $('look').classList.toggle('kr', view === 0); $('look').classList.toggle('kl', view === 2);
  $('look').classList.add('show');
  seen.add(id);
}
function closeLook(){
  $('look').classList.remove('show'); hideTalk();
  if (!allDone && seen.size === ALL.length){
    allDone = true; look(1); $('door').classList.add('ready');
    setTimeout(()=>talk([{who:'店主', text:'…それで全部。見てくれて、どうも。'}, {who:'店主', text:'帰りはそこの扉から。'}]), 450);
  }
}
$('x').onclick = closeLook;
$('look').addEventListener('click', e=>{ if (e.target === $('look')) closeLook(); });
$('askk').onclick = ()=>talk([{who:'店主', text:curItem.talk}]);

/* ---------- 会話 ---------- */
let pages = [], typeT = 0;
function talk(list){ pages = list.slice(); next(); }
function hideTalk(){ pages = []; clearInterval(typeT); $('talk').classList.remove('show','done'); }
function next(){
  clearInterval(typeT);
  const el = $('talk');
  if (!pages.length){ hideTalk(); return; }
  const p = pages.shift();
  $('who').textContent = p.who || '';
  el.classList.add('show'); el.classList.remove('done');
  const t = p.text; let k = 0; $('txt').textContent = '';
  typeT = setInterval(()=>{ $('txt').textContent = t.slice(0, ++k); if (k >= t.length){ clearInterval(typeT); el.classList.add('done'); } }, 26);
}
$('talk').onclick = next;
document.addEventListener('click', e=>{
  if (!$('talk').classList.contains('show')) return;
  if ($('talk').contains(e.target) || e.target.closest('#askk,#moya,#ask')) return;
  hideTalk();
}, true);
$('moya').onclick = e=>{ e.stopPropagation(); talk([{who:'店主', text:moyaLines[moyaN++ % moyaLines.length]}]); };

/* ---------- 質問バー ---------- */
$('q').addEventListener('input', ()=>{ $('send').disabled = !$('q').value.trim(); });
$('ask').addEventListener('submit', e=>{
  e.preventDefault();
  const v = $('q').value.trim(); if (!v) return;
  $('q').value = ''; $('send').disabled = true; $('q').blur();
  const hit = keys.find(([re]) => re.test(v));
  const ans = hit ? (typeof hit[1] === 'function' ? hit[1]() : hit[1]) : idle[idleN++ % idle.length];
  const item = ALL.find(x=>x.id === ans);
  if (item){ show(item.id); talk([{who:'店主', text:item.talk}]); }
  else { $('look').classList.remove('show'); look(1); talk([{who:'店主', text:ans}]); }
});

/* ---------- 入口と出口 ---------- */
function enter(){
  const d = $('fdoor'); if (d.classList.contains('open')) return;
  d.classList.add('open'); $('bell').classList.add('show');
  setTimeout(()=>{
    $('enterF').classList.add('fade'); document.body.classList.remove('outside'); look(1);
    setTimeout(()=>{
      $('enterF').hidden = true;
      talk([{who:'店主', text:'いらっしゃい。…左は売り物で、右は貼り紙。'}, {who:'店主', text:'気になるのがあったら、手に取って見てって。帰りはそこの扉から。'}]);
    }, 400);
  }, 700);
}
$('fdoor').onclick = enter;
$('door').onclick = e=>{
  e.stopPropagation(); hideTalk();
  document.body.classList.add('outside');
  const x = $('exitF'); x.hidden = false; x.classList.add('fade');
  requestAnimationFrame(()=>requestAnimationFrame(()=>x.classList.remove('fade')));
};
$('again').onclick = ()=>{
  $('exitF').hidden = true; document.body.classList.remove('outside'); look(1);
  talk([{who:'店主', text:'…おかえり。'}]);
};

look(1);
</script>
