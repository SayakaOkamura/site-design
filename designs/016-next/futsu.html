<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>株式会社アルターデザインコンサルティング（Alter Design Consulting）｜上流工程から伴走するAI ×ローコード開発支援</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
:root{ --ink:#1d1526; --sub:#6d6478; --bg:#fbfafc; --ac:#654087; --pale:#efe9f5; --line:#e3dcea }
*{box-sizing:border-box; margin:0; padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg); color:var(--ink); font-family:"Zen Kaku Gothic New",sans-serif; line-height:1.9; overflow-x:hidden}
a{color:inherit}
header{position:sticky; top:0; z-index:5; display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px clamp(16px,4vw,56px); height:62px; background:rgba(251,250,252,.94); backdrop-filter:blur(8px); box-shadow:0 1px 0 var(--line)}
.logo{display:flex; align-items:center; gap:10px; text-decoration:none; font-weight:500; line-height:1.1; white-space:nowrap}
.logo i{width:26px; height:26px; border-radius:50%; border:5px solid var(--ac); box-shadow:inset 0 0 0 2px var(--pale)}
.logo small{display:block; font-size:10px; color:var(--sub); text-align:right}
header ul{display:flex; gap:clamp(10px,2.4vw,36px); list-style:none; font-size:13px; letter-spacing:.08em; white-space:nowrap}
header ul a{text-decoration:none}
@media (max-width:720px){ header ul{display:none} }
section{scroll-margin-top:62px}
.pad{padding:clamp(72px,12vh,140px) clamp(16px,6vw,96px)}
.in{max-width:880px; margin:0 auto}
.kick{font-size:12px; letter-spacing:.22em; color:var(--ac); margin-bottom:14px}
h1{font-size:clamp(26px,4.8vw,54px); font-weight:900; line-height:1.45; margin-bottom:24px}
h2{font-size:clamp(21px,3vw,30px); font-weight:900; margin-bottom:28px}
h3{font-size:18px; font-weight:700; margin-bottom:10px}
p{color:var(--sub)}
.top .pad{min-height:calc(100vh - 62px); display:flex; align-items:center}
.top .in{width:100%}
.philo h3{font-size:clamp(18px,2.4vw,24px); color:var(--ink); margin-bottom:18px}
.svc{list-style:none; display:grid; grid-template-columns:repeat(2,1fr); gap:1px; background:var(--line); border:1px solid var(--line)}
.svc li{background:var(--bg); padding:26px}
.svc p{font-size:14px}
.alt{background:#fff}
dl{display:grid; grid-template-columns:7em 1fr; gap:12px; padding:16px 0; border-bottom:1px solid var(--line); font-size:14px}
dt{color:var(--sub)}
.btn{display:inline-block; margin-top:28px; padding:14px 34px; border-radius:40px; background:var(--ac); color:#fff; text-decoration:none; font-weight:700; letter-spacing:.08em}
footer{padding:28px clamp(16px,4vw,56px) 40px; display:flex; flex-wrap:wrap; gap:12px 24px; justify-content:space-between; font-size:12px; color:var(--sub); border-top:1px solid var(--line)}
.news{display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:13.5px}
.news time{color:var(--sub)}
.news .k{font-size:11.5px; padding:1px 10px; border:1px solid var(--ac); color:var(--ac); border-radius:20px}
.acc{font-size:13px; color:var(--sub); margin-top:.4em}
b{color:var(--ink)}
@media (max-width:720px){ .svc{grid-template-columns:1fr} }
</style>

<header>
    <a class="logo" href="#top"><i></i><span>Alter Design<small>consulting</small></span></a>
    <nav><ul>
      <li><a href="#philosophy">企業理念</a></li><li><a href="#services">サービス</a></li><li><a href="#company">会社概要</a></li><li><a href="#ai-policy">AIポリシー</a></li><li><a href="#contact">お問い合わせ</a></li>
    </ul></nav>
  </header>

<section id="top" class="o top"><div class="pad"><div class="in">
    <h1 data-c="catch"></h1>
    <p data-c="lead"></p>
    <div id="news"></div>
  </div></div></section>
<section id="philosophy" class="o alt philo"><div class="pad"><div class="in">
    <p class="kick">PHILOSOPHY</p>
    <h2 data-c="philosophy.title"></h2>
    <h3 data-c="philosophy.head"></h3>
    <p data-c="philosophy.body"></p>
  </div></div></section>
<section id="services" class="o"><div class="pad"><div class="in">
    <p class="kick">SERVICE</p>
    <h2 data-c="servicesTitle"></h2>
    <ul class="svc" id="svc"></ul>
  </div></div></section>
<section id="company" class="o alt"><div class="pad"><div class="in">
    <p class="kick">COMPANY</p>
    <h2>会社概要</h2>
    <div id="co"></div>
  </div></div></section>
<section id="ai-policy" class="o"><div class="pad"><div class="in">
    <p class="kick">AI POLICY</p>
    <h2 data-c="aiPolicy.title"></h2>
    <p data-c="aiPolicy.body"></p>
  </div></div></section>
<section id="contact" class="o alt"><div class="pad"><div class="in">
    <p class="kick">CONTACT</p>
    <h2>お問い合わせ</h2>
    <p data-c="contact.body"></p>
    <a class="btn" id="mail"></a>
  </div></div></section>

<footer><a id="privacy" target="_blank" rel="noopener"></a><small data-c="copyright"></small></footer>

<script src="../content.js"></script>
<script>
/* 中身は ../content.js から（どの案も同じ文を使う） */
(function(){
  var A = window.ADC;
  function get(path){ return path.split('.').reduce(function(o, k){ return o[k]; }, A); }
  [].forEach.call(document.querySelectorAll('[data-c]'), function(e){ e.innerHTML = get(e.getAttribute('data-c')); });
  document.getElementById('news').innerHTML = A.news.map(function(n){ return '<p class="news"><time>' + n.date + '</time><span class="k">' + n.kind + '</span><a href="' + n.href + '" target="_blank" rel="noopener">' + n.title + '</a></p>'; }).join('');
  document.getElementById('svc').innerHTML = A.services.map(function(s){ return '<li><h3>' + s.title + '</h3><p>' + s.body + '</p></li>'; }).join('');
  document.getElementById('co').innerHTML = A.company.map(function(r){ return '<dl><dt>' + r[0] + '</dt><dd>' + r[1] + (r[0] === '所在地' ? '<p class="acc">【アクセス】<br>' + A.access.join('<br>') + '</p>' : '') + '</dd></dl>'; }).join('');
  var m = document.getElementById('mail'); m.href = A.contact.href; m.textContent = A.contact.button;
  var pv = document.getElementById('privacy'); pv.href = A.privacy.href; pv.textContent = A.privacy.label;
})();
</script>
</html>
