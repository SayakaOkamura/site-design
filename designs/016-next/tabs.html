<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>株式会社アルターデザインコンサルティング</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{ --ink:#1d1526; --sub:#6d6478; --ac:#654087; --h:0px }
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%; overflow:hidden}
body{background:#fbfafc; color:var(--ink); font-family:"Zen Kaku Gothic New",sans-serif}

/* ===== 見た目を変えるボタン（どの見た目でも左下） ===== */
#all{position:fixed; left:clamp(16px,3vw,32px); bottom:clamp(16px,3vw,32px); z-index:30; display:flex; align-items:center; gap:10px; padding:11px 18px 11px 12px; border:1px solid rgba(255,255,255,.6); border-radius:40px; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); color:var(--ink); font:700 13px "Zen Kaku Gothic New",sans-serif; letter-spacing:.08em; cursor:pointer; box-shadow:0 6px 20px rgba(29,21,38,.18)}
#all b{position:relative; width:26px; height:18px}
#all b i{position:absolute; top:0; width:14px; height:18px; border-radius:4px; background:var(--c); box-shadow:0 0 0 1.5px #fff; transition:transform .3s}
#all b i:nth-child(1){left:0} #all b i:nth-child(2){left:6px} #all b i:nth-child(3){left:12px}
#all:hover b i:nth-child(1){transform:translateX(-3px) rotate(-8deg)} #all:hover b i:nth-child(3){transform:translateX(3px) rotate(8deg)}
#all:focus-visible{outline:3px solid var(--ac); outline-offset:3px}
body.grid #all{background:var(--ink); color:#fff; border-color:var(--ink)}
#ttl{position:fixed; left:0; right:0; top:0; z-index:5; padding:22px clamp(16px,4vw,48px) 0; color:#fff; font-size:13px; font-weight:700; letter-spacing:.16em; opacity:0; pointer-events:none; transition:opacity .3s}
body.grid.shown #ttl{opacity:.7}

/* ===== 画面 ===== */
#view{position:fixed; left:0; right:0; top:var(--h); bottom:0; overflow:hidden}
body.grid #view{overflow-y:auto; background:#2a2233}
#lay{position:relative}
.win{position:absolute; left:0; top:0; transform-origin:0 0; background:#fff; visibility:hidden; transition:transform .55s cubic-bezier(.3,.7,.2,1), border-radius .55s, box-shadow .55s}
.win iframe{display:block; width:100%; height:100%; border:0}
.win.on{visibility:visible; z-index:2}
body.grid .win{visibility:visible; cursor:pointer; border-radius:calc(10px / var(--s)); overflow:hidden; box-shadow:0 0 0 calc(1px / var(--s)) rgba(255,255,255,.12), 0 calc(10px / var(--s)) calc(30px / var(--s)) rgba(0,0,0,.4)}
body.grid .win iframe{pointer-events:none}
body.grid .win:hover,body.grid .win:focus-visible{box-shadow:0 0 0 calc(3px / var(--s)) #ffd23f, 0 calc(10px / var(--s)) calc(30px / var(--s)) rgba(0,0,0,.4); outline:none}
body.grid .win.on{z-index:1}
.cap{position:absolute; left:0; color:#fff; font-size:13px; white-space:nowrap; overflow:hidden; font-weight:700; letter-spacing:.06em; opacity:0; transition:opacity .3s; pointer-events:none; display:flex; align-items:center; gap:8px}
.cap i{width:12px; height:12px; border-radius:4px; background:var(--c)}
body.grid.shown .cap{opacity:1}
body.moving .win{visibility:visible}

@media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>

<div id="view"><div id="lay"></div></div>
<p id="ttl">見た目を選ぶ</p>
<button id="all" type="button" aria-pressed="false"><b><i></i><i></i><i></i></b><span>見た目を変える</span></button>

<script>
(function(){
var SITES = [
  ['futsu.html',                    '普通のサイト',           '#654087'],
  ['bodoge.html',                   'ボードゲームの卓',       '#7a5c3a'],
  ['kumikae.html',                  '英字が組み替わる誌面',   '#1d1526'],
  ['window.html',                   '時間で変わる作業部屋',   '#9bd34a'],
  ['hodoku.html',                   '整理できるダサいサイト', '#a678de'],
  ['reversible.html',               '裏返せるサイト',         '#ffd23f'],
  ['../015-directions/shop.html',   'ゲームのお店',           '#ff7ab6'],
  ['../015-directions/site.html',   'ミニゲーム付きのサイト', '#8fd0ff'],
  ['../015-directions/ikaga.html',  'いかがでしたかブログ',   '#ff9a3c'],
  ['../015-directions/rosen.html',  '伸びていく路線図',       '#2f9e6e'],
  ['../015-directions/status.html', 'RPG のステータス画面',   '#3a4fd0']
];
var B = document.body, lay = document.getElementById('lay'), view = document.getElementById('view');
var all = document.getElementById('all'), W = [], C = [], cur = 0, grid = false, timer;

SITES.forEach(function(s, i){
  var w = document.createElement('div'); w.className = 'win'; w.tabIndex = -1; w.setAttribute('aria-label', s[1]);
  w.addEventListener('click', function(){ if (grid) pick(i); });
  w.addEventListener('keydown', function(e){ if (grid && (e.key === 'Enter' || e.key === ' ')){ e.preventDefault(); pick(i); } });
  lay.appendChild(w); W.push(w);
  var c = document.createElement('div'); c.className = 'cap'; c.style.setProperty('--c', s[2]); c.innerHTML = '<i></i><span></span>'; c.querySelector('span').textContent = s[1];
  lay.appendChild(c); C.push(c);
});
/* 開いたことのある見た目だけ読み込む（並べたときは全部） */
function load(i){ if (W[i].firstChild) return; var f = document.createElement('iframe'); f.src = SITES[i][0]; f.title = SITES[i][1]; W[i].appendChild(f); }

/* 並べたときの、それぞれの四角 */
function slots(){
  var vw = view.clientWidth, vh = innerHeight, n = SITES.length;
  var cols = vw > 1300 ? 4 : vw > 860 ? 3 : 2;
  var M = Math.max(16, Math.min(48, vw * .04)), G = Math.max(16, Math.min(32, vw * .025)), CAP = 30, TOP = 44;
  var sw = (vw - M * 2 - G * (cols - 1)) / cols, s = sw / vw, sh = vh * s, out = [];
  for (var i = 0; i < n; i++){
    var c = i % cols, r = Math.floor(i / cols);
    out.push({ x:M + c * (sw + G), y:TOP + M + CAP + r * (sh + CAP + G), s:s, w:sw });
  }
  lay.style.height = (TOP + M * 2 + Math.ceil(n / cols) * (sh + CAP + G)) + 'px';
  return out;
}
function size(){
  var vw = view.clientWidth, vh = innerHeight;
  W.forEach(function(w){ w.style.width = vw + 'px'; w.style.height = vh + 'px'; });
}
function place(){
  size();
  if (!grid){
    lay.style.height = '100%';
    W.forEach(function(w, i){ w.style.transform = 'none'; w.style.setProperty('--s', 1); w.classList.toggle('on', i === cur); });
    return;
  }
  var S = slots();
  W.forEach(function(w, i){ var p = S[i]; w.style.transform = 'translate(' + p.x + 'px,' + p.y + 'px) scale(' + p.s + ')'; w.style.setProperty('--s', p.s); });
  C.forEach(function(c, i){ var p = S[i]; c.style.transform = 'translate(' + p.x + 'px,' + (p.y - 26) + 'px)'; c.style.width = p.w + 'px'; });
}
/* ボタンの三枚の色：いまの見た目と、その次の二つ */
function mark(){
  [].forEach.call(all.querySelectorAll('b i'), function(el, k){ el.style.setProperty('--c', SITES[(cur + 2 - k) % SITES.length][2]); });
  all.querySelector('span').textContent = grid ? 'もどる' : '見た目を変える';
}

/* タブを押す：その見た目に切り替える（並べていたら、選んだものが大きくなる） */
function pick(i){
  cur = i; load(i); mark();
  if (grid){ toggle(false); return; }
  W.forEach(function(w, j){ w.classList.toggle('on', j === cur); });
}
/* 並べる／戻す */
function toggle(on){
  clearTimeout(timer);
  grid = on; all.setAttribute('aria-pressed', String(on)); mark();
  if (on){
    SITES.forEach(function(s, i){ load(i); });
    B.classList.add('grid', 'moving'); W.forEach(function(w){ w.tabIndex = 0; });
    place();
    var S = slots(), y = S[cur].y - innerHeight * .3;
    view.scrollTop = Math.max(0, y);
    timer = setTimeout(function(){ B.classList.add('shown'); }, 350);
  } else {
    var top = view.scrollTop;
    B.classList.remove('shown'); W.forEach(function(w){ w.tabIndex = -1; });
    /* 選んだものを、いま見えている位置から画面いっぱいへ */
    var S = slots(), p = S[cur];
    W[cur].style.transform = 'translate(' + p.x + 'px,' + (p.y - top) + 'px) scale(' + p.s + ')';
    B.classList.remove('grid', 'moving'); view.scrollTop = 0;
    void W[cur].offsetWidth;
    W.forEach(function(w, j){ w.classList.toggle('on', j === cur); });
    W[cur].style.transform = 'none'; W[cur].style.setProperty('--s', 1);
    timer = setTimeout(place, 560);
  }
}
all.addEventListener('click', function(){ toggle(!grid); });
addEventListener('keydown', function(e){ if (e.key === 'Escape' && grid) toggle(false); });
addEventListener('resize', place);

load(cur); mark(); place();
})();
</script>
</html>
