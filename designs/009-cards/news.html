<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>お知らせ｜株式会社アルターデザインコンサルティング</title>

<!-- 009 カード ─ お知らせ（記事）
     ================================================================
     **一覧はカードの中、中身はページ。**
     本人（2026-09-07）：「お知らせはカードで内容はページでよくない？」

     一覧の中で開かせると、開いた一件が下を押し下げるので、
     **次の一件を見るのに毎回スクロールすることになる。**
     一行ずつのまま並べておいて、押したらここへ来る。一覧の高さは変わらない。

     **5枚 HTML を作らず、1ファイルで URL で出し分ける。**
     `news.html#2026-08-20`。一件を人に送れるのは変わらない。

     戻りは上と下に同じカード。行き先は `./#news` なので、
     **戻ると一覧が開いた状態で始まる**（印は入口側の show が残している）。
     社名は頭の帯が持つ。**枠（頭と足）は入口と同じ。**

     **中身は仮。**実際のお知らせではないことを画面にも出している。
================================================================ -->

<style>
:root{
  --bg:   #e8ebee;
  --card: #ffffff;
  --tint: #f2f4f6;
  --ink:  #16191d;
  --sub:  #5b626b;
  --go:   #0e6b58;
  --frame:#d9dee3;   /* 枠（頭と足）。入口と同じ */

  --lift1: 0 1px 2px rgba(20,26,32,.06), 0 3px 8px rgba(20,26,32,.07);
  --lift2: 0 2px 4px rgba(20,26,32,.07), 0 10px 24px rgba(20,26,32,.10);
  --lift0: 0 1px 1px rgba(20,26,32,.10);

  --r: 10px;
  --ease: cubic-bezier(.2,.7,.3,1);
}

*{box-sizing:border-box}
html{height:100%; scrollbar-gutter:stable}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",
              system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}

/* ─ 枠。頭と足。入口と同じ（線は引かない。沈んだ面で枠にする）───── */
.in,.sheet{width:100%; max-width:908px; margin:0 auto; padding:0 24px}
.sheet{padding:40px 24px}

.top,.foot{flex:none; background:var(--frame)}
.top{height:56px; display:flex; align-items:center}
.mark{font-size:13.5px; font-weight:700; letter-spacing:.02em; color:var(--ink)}

.foot .in{padding:30px 24px 34px}
.foot p{margin:0; font-size:12px; color:var(--sub); line-height:1.85}
.foot .fn{font-size:13px; font-weight:700; color:var(--ink)}
.foot .fa{margin-top:7px}
.foot .fc{margin-top:22px; font-size:11.5px}
.foot .fw{margin-top:9px; font-size:11.5px}

/* ─ 戻りのカード。上と下に同じものを置く（新しい部品を足さない）───── */
.back{
  display:block; margin-top:16px; padding:22px 26px;
  font-size:14px; font-weight:700; text-decoration:none; color:inherit;
  background:var(--card); border-radius:var(--r); box-shadow:var(--lift1);
  transition:transform .16s var(--ease), box-shadow .16s ease;
}
.back:hover{transform:translateY(-3px); box-shadow:var(--lift2)}
.back:active{transform:translateY(2px); box-shadow:var(--lift0)}
.back:focus-visible{outline:2px solid var(--go); outline-offset:3px}
.sheet>.back:first-child{margin-top:0; animation-delay:0s}

/* ─ 記事 ─────────────────────────────────────────────── */
.art{
  margin-top:16px; background:var(--card); border-radius:var(--r);
  box-shadow:var(--lift1); padding:38px 40px 40px;
}
.art .d{margin:0; font-size:12.5px; font-weight:600; color:var(--sub);
        font-variant-numeric:tabular-nums; letter-spacing:.02em}
.art h1{margin:12px 0 0; font-size:clamp(19px,2.6vw,25px); font-weight:700; line-height:1.5}
.art .b{margin:24px 0 0; font-size:14px; line-height:2.05}

/* 中身が仮であることの断り。押せないので影は落とさない */
.todo{margin:16px 0 0; background:var(--tint); border-radius:8px; padding:20px 22px;
      font-size:12.5px; color:var(--sub); line-height:1.9}
.todo b{color:var(--ink)}

@keyframes drop{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.art,.back{animation:drop .42s var(--ease) backwards}
.art{animation-delay:.06s}
.back{animation-delay:.10s}
@media (prefers-reduced-motion:reduce){ .art,.back{animation:none} }

@media (max-width:520px){
  .art{padding:28px 24px 30px}
  .back{padding:20px 22px}
}
</style>
</head>
<body>

<!-- 頭。社名だけ。押せるものは置かない（入口と同じ）-->
<header class="top">
  <div class="in"><span class="mark">株式会社アルターデザインコンサルティング</span></div>
</header>

<main class="sheet">

  <!-- 一覧へ戻る。読む前でも読み終わってからでも選べるように、上と下に同じものを置く。
       `#news` 付きなので、一覧が開いた状態で戻る -->
  <a class="back" href="./#news">お知らせの一覧へ</a>

  <article class="art">
    <p class="d" id="d"></p>
    <h1 id="t"></h1>
    <p class="b" id="b"></p>
  </article>

  <p class="todo">これは<b>仮の中身</b>です。実際のお知らせではありません。</p>

  <a class="back" href="./#news">お知らせの一覧へ</a>

</main>

<!-- 足。入口と同じ -->
<footer class="foot">
  <div class="in">
    <p class="fn">株式会社アルターデザインコンサルティング</p>
    <p class="fa">東京都港区西新橋3-23-5 ANYZ304（御成門郵船ビル）</p>
    <p class="fc">© 2025 株式会社アルターデザインコンサルティング</p>
    <p class="fw">これは案です。上のお知らせは仮の中身で、実際のお知らせではありません。会社の言葉として出しているのは社名と所在地だけです（alt-dsgn.co.jp、2026年9月3日に確認）。実装は AI（Claude）が行いました。</p>
  </div>
</footer>

<script>
/* 記事は1ファイル。URL の印で出し分ける。
   5枚 HTML を作らなくても、一件ごとに URL を持てる。 */
var NEWS = {
  '2026-08-20': ['2026.08.20', '夏季休業のお知らせ',
    '8月13日から8月16日まで、夏季休業とさせていただきます。期間中にいただいたお問い合わせは、8月17日以降に順次ご返信いたします。ご不便をおかけしますが、何卒よろしくお願い申し上げます。'],
  '2026-06-02': ['2026.06.02', 'オフィス移転のお知らせ',
    'このたびオフィスを移転いたしました。電話番号に変更はございません。移転に伴う業務の停止はございません。今後ともよろしくお願い申し上げます。'],
  '2026-04-10': ['2026.04.10', 'コーポレートサイトを公開しました',
    'コーポレートサイトを公開しました。事業内容とお問い合わせ先を掲載しています。今後、お知らせもこちらに掲載してまいります。'],
  '2025-12-26': ['2025.12.26', '年末年始の休業について',
    '12月27日から1月4日まで休業いたします。期間中のお問い合わせは、1月5日以降に順次ご対応いたします。'],
  '2025-06-30': ['2025.06.30', '会社設立のお知らせ',
    '株式会社アルターデザインコンサルティングを設立いたしました。']
};

function draw(){
  var k = location.hash.slice(1);
  var n = NEWS[k];
  if (!n){                                   /* 印が無い・知らない印なら、いちばん新しいもの */
    k = Object.keys(NEWS)[0];
    n = NEWS[k];
    history.replaceState(null, '', '#' + k);
  }
  document.getElementById('d').textContent = n[0];
  document.getElementById('t').textContent = n[1];
  document.getElementById('b').textContent = n[2];
  document.title = n[1] + '｜株式会社アルターデザインコンサルティング';
}
draw();
window.addEventListener('hashchange', draw);
</script>

</body>
</html>
