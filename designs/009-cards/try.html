<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>見直してみる｜株式会社アルターデザインコンサルティング</title>

<!-- 009 カード ─ 見直してみる（体験）
     ================================================================
     **粗い一枚。**字の大きさも間もまだ詰めていない。

     話し合いで決まっていること（NOTES.md が正）
     - 思わせたいのは **「この方がいいな」**。発見（できるのか）ではなく選好
     - だから **比較が要る。重い側は省略できない**
     - 重い側は「無理」ではなく **「やってられない」**。読めば分かる。ただ多い
     - 量は減らないが、**それは売りではない**。値打ちは読みやすさ・決めやすさ・関係が見えること
     - **重い側では決めさせない。**決めやすさは軽い側だけのものにする
     - カード化の値打ちは、**関係が見えること**（被っている／これのために要る／決まっていない）
     - 三択が押せるのは、**関係が見えているから**
     - **増えるのは自分が押した側（台帳）**
     - 快感は物理から。点数も演出も足さない
     - **できない指示を出さない。**押すところは下の帯に一つだけ

     **カードになったらスクロールさせない**（本人 2026-09-07）：
     > カードになった時スクロールしたくないかも。順繰りで出てきて、
     > 終わったらたまっていく感じにできないか

     一枚ずつ手前に出て、押したら下（台帳）へ落ちる。束の厚みは後ろに見えている。
     **判断が一度に一つしか目に入らない**——「一枚に判断が一つ」がここで形になる。

     背景は、重い側がいちばん暗い。カードになると明るくなる。入口がいちばん明るい。

     **中身は仮。**会社について何も主張しない言葉だけにしてある。
================================================================ -->

<style>
:root{
  --bg:   #e8ebee;
  --card: #ffffff;
  --tint: #f2f4f6;
  --ink:  #16191d;
  --sub:  #5b626b;
  --go:   #0e6b58;

  --dark:     #171b22;
  --dark-ink: #99a3b2;

  --lift1: 0 1px 2px rgba(20,26,32,.06), 0 3px 8px rgba(20,26,32,.07);
  --lift2: 0 2px 4px rgba(20,26,32,.07), 0 10px 24px rgba(20,26,32,.10);
  --lift3: 0 8px 16px rgba(20,26,32,.10), 0 28px 56px rgba(20,26,32,.16);
  --lift0: 0 1px 1px rgba(20,26,32,.10);

  --r: 10px;
  --ease: cubic-bezier(.2,.7,.3,1);
  --snap: cubic-bezier(.16,1,.3,1);   /* 前へ出るとき。速く動いて素早く止まる */
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%; scrollbar-gutter:stable}
body{
  min-height:100%; margin:0; color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",
              system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:32px 24px 120px;
  background:var(--dark);
  transition:background .55s var(--ease);
}
body[data-stage="cards"],body[data-stage="end"]{background:var(--bg)}
body[data-stage="cards"]{overflow:hidden}   /* 束のあいだはスクロールさせない */

.sheet{width:100%; max-width:860px; margin:0 auto}

/* ─ 頭 ───────────────────────────────────────────────── */
.top{margin:0 2px 20px; color:var(--dark-ink); transition:color .55s var(--ease)}
body[data-stage="cards"] .top,body[data-stage="end"] .top{color:var(--sub)}
.top h1{margin:0; font-size:clamp(16px,2.2vw,20px); font-weight:700; line-height:1.5;
        color:#e7ebf0; transition:color .55s var(--ease)}
body[data-stage="cards"] .top h1,body[data-stage="end"] .top h1{color:var(--ink)}
.top p{margin:10px 0 0; font-size:13px; line-height:1.8}
.top .n{font-variant-numeric:tabular-nums; font-weight:700}

/* ─ 重い側：詰まった行 ───────────────────────────────── */
.stack{list-style:none; margin:0; padding:0; display:grid; gap:0}
.stack li{
  color:var(--dark-ink); border-radius:8px; padding:2px 10px;
  font-size:12.5px; line-height:1.75;
}
.stack li .no{display:inline-block; min-width:2.4em; color:#5d6675;
              font-variant-numeric:tabular-nums}
.rel,.pick,.mark{display:none}

/* ─ 軽い側：一枚ずつ手前に出る束 ─────────────────────────
   後ろの厚みが見えているので、量が減った気にならない。
   **判断が一度に一つしか目に入らない。** */
/* 一枚が広すぎると板に見える。カードらしい幅に締めて、真ん中に置く */
body[data-stage="cards"] .stack,body[data-stage="end"] .stack{
  display:block; position:relative; min-height:320px;
  max-width:520px; margin:40px auto 0;
}
body[data-stage="cards"] .stack li,body[data-stage="end"] .stack li{
  position:absolute; left:0; right:0; top:0;
  background:var(--card); color:var(--ink); box-shadow:var(--lift3);
  border-radius:var(--r); padding:32px 32px 28px;
  font-size:15.5px; line-height:1.8; min-height:200px;
  display:flex; flex-direction:column;
  transform:translateY(calc(var(--i) * 8px)) scale(calc(1 - var(--i) * .028));
  z-index:calc(60 - var(--i));
  transition:transform .2s var(--snap), opacity .16s ease, box-shadow .2s ease;
}
body[data-stage="cards"] .stack li .no,body[data-stage="end"] .stack li .no{color:var(--sub)}

/* 後ろの札は、下の縁だけ見せる */
.stack li[data-back]{box-shadow:var(--lift1)}
.stack li[data-hide]{opacity:0; pointer-events:none}
.stack li[data-back] .rel,.stack li[data-back] .pick{visibility:hidden}

/* 押したら**選んだ山へ飛ぶ**（行き先は JS が inline transform で入れる）。
   見届けさせない——次の一枚は待たずに前へ出す。 */
.stack li.out{
  z-index:70; pointer-events:none; opacity:0;
  transition:transform .3s cubic-bezier(.4,0,1,1), opacity .26s ease-in;
}

body[data-stage="cards"] .rel,body[data-stage="end"] .rel{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
/* 三択はカードの下端に寄せる。**押す場所が毎回同じ**になるので、手が迷わない */
body[data-stage="cards"] .pick,body[data-stage="end"] .pick{
  display:flex; flex-wrap:wrap; gap:8px; margin-top:auto; padding-top:22px}

.rel b{font-size:11.5px; font-weight:700; line-height:1; padding:7px 10px; border-radius:999px;
       background:var(--tint); color:var(--sub)}
.rel b.dup{background:#fdeceb; color:#a3352c}
.rel b.needs{background:#e9f2ff; color:#22528f}
.rel b.open{background:#fff4e2; color:#8a5a12}

.pick button{
  -webkit-appearance:none; appearance:none; border:0; font:inherit; cursor:pointer;
  font-size:13px; font-weight:700; padding:12px 18px; border-radius:8px;
  background:var(--tint); color:var(--ink); box-shadow:var(--lift1);
  transition:transform .14s var(--ease), box-shadow .14s ease;
}
.pick button:hover{transform:translateY(-2px); box-shadow:var(--lift2)}
.pick button:active{transform:translateY(1px); box-shadow:var(--lift0)}
.pick button:focus-visible{outline:2px solid var(--go); outline-offset:2px}
.pick button i{font-style:normal; color:var(--sub); font-size:11px; margin-left:7px}

/* ─ 下の帯。押すところは常にここ。あとで台帳になる ───────────── */
.book{
  position:fixed; left:0; right:0; bottom:0; z-index:80;
  background:var(--card); box-shadow:0 -2px 4px rgba(20,26,32,.06), 0 -12px 32px rgba(20,26,32,.10);
  padding:14px 24px;
}
.book .in{max-width:860px; margin:0 auto; display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.ledger{display:none; align-items:flex-end; gap:22px; flex-wrap:wrap}
body[data-stage="cards"] .ledger,body[data-stage="end"] .ledger{display:flex}
.book .t,.book .rest{padding-bottom:2px}
.book .t{font-size:12.5px; font-weight:700}
.book .c{font-size:12.5px; color:var(--sub); font-variant-numeric:tabular-nums}
.book .c b{color:var(--ink); font-size:15px; margin-right:3px}
.book .rest{font-size:12px; color:var(--sub)}

/* 台帳は三つの山。**押したカードはその山へ飛んでいく。**
   細い線が一本増えるだけでは「たまっていく」が出なかった。 */
.piles{display:flex; gap:26px; align-items:flex-end}
.heap{display:flex; flex-direction:column; align-items:center; gap:7px; min-width:74px}
.heap .stackbars{display:flex; flex-direction:column-reverse; justify-content:flex-end;
                 gap:2px; height:34px; width:56px}
.heap .stackbars i{display:block; height:3px; border-radius:2px; background:var(--sub); opacity:.32}
@keyframes land{from{transform:translateY(-10px) scaleX(.8); opacity:0} to{transform:none; opacity:.32}}
.heap .stackbars i:first-child{animation:land .2s var(--snap)}
.heap .nm{font-size:11.5px; font-weight:700; color:var(--sub); white-space:nowrap}
.heap .nm b{color:var(--ink); font-size:14px; margin-right:4px; font-variant-numeric:tabular-nums}

.go{
  -webkit-appearance:none; appearance:none; border:0; font:inherit; cursor:pointer;
  margin-left:auto; text-align:left;
  background:var(--go); color:#fff; border-radius:9px; box-shadow:var(--lift1);
  padding:14px 22px; font-size:14px; font-weight:700; line-height:1.4;
  transition:transform .16s var(--ease), box-shadow .16s ease;
}
.go:hover{transform:translateY(-2px); box-shadow:var(--lift2)}
.go:active{transform:translateY(1px); box-shadow:var(--lift0)}
.go:focus-visible{outline:2px solid var(--go); outline-offset:3px}
.go span{display:block; margin-top:4px; font-size:11.5px; font-weight:500; color:rgba(255,255,255,.76)}
body[data-stage="wall"] .go{margin-left:0}

/* ─ 終わり ───────────────────────────────────────────── */
.end{display:none; background:var(--card); border-radius:var(--r); box-shadow:var(--lift1);
     padding:40px; margin-bottom:16px}
body[data-stage="end"] .end{display:block}
body[data-stage="end"] .stack{display:none}
.end h2{margin:0; font-size:clamp(19px,3vw,27px); font-weight:700; line-height:1.55}
.end p{margin:20px 0 0; font-size:13.5px; color:var(--sub); line-height:1.95}

.back{
  display:block; text-decoration:none; color:inherit; margin-top:16px;
  background:var(--card); border-radius:var(--r); box-shadow:var(--lift1);
  padding:22px 26px; font-size:14px; font-weight:700;
  transition:transform .16s var(--ease), box-shadow .16s ease;
}
.back:hover{transform:translateY(-3px); box-shadow:var(--lift2)}
body[data-stage="cards"] .back,body[data-stage="cards"] .note{display:none}

.note{margin:22px 2px 0; font-size:11.5px; line-height:1.9; color:var(--dark-ink);
      transition:color .55s var(--ease)}
body[data-stage="end"] .note{color:var(--sub)}

@media (max-width:520px){
  body{padding:24px 16px 130px}
  .end{padding:28px 24px}
  body[data-stage="cards"] .stack li,body[data-stage="end"] .stack li{padding:24px 22px; font-size:14px}
}
</style>
</head>
<body data-stage="wall">

<main class="sheet">

  <div class="top">
    <!-- **できない指示を出さない。**事実だけ置いて、押すところは下の帯に一つ。 -->
    <h1 id="h">社内の取り決め　<span class="n" id="n">0</span> 件</h1>
    <p id="p">一行ずつは読めます。<b>どれとどれが被っているかは、見えません。</b></p>
  </div>

  <!-- 終わり。理念はここで初めて出す（通り終わってから名前が付く） -->
  <div class="end">
    <h2>経営の力で「遊ぶように働く世界」をデザインする</h2>
    <p>読める形にして、一枚ずつ決める。押したものは台帳に積まれています。</p>
  </div>

  <ul class="stack" id="stack"></ul>

  <p class="note">これは仮の中身です。実際の社内規程ではありません。会社の言葉として出ているのは、終わりに出る理念だけです（alt-dsgn.co.jp、2026年9月3日に確認）。</p>

  <a class="back" href="./">入口へ戻る</a>

</main>

<div class="book">
  <div class="in">
    <span class="ledger">
      <span class="t">台帳</span>
      <span class="piles">
        <span class="heap" id="h0"><span class="stackbars"></span><span class="nm"><b>0</b>要る</span></span>
        <span class="heap" id="h1"><span class="stackbars"></span><span class="nm"><b>0</b>要らない</span></span>
        <span class="heap" id="h2"><span class="stackbars"></span><span class="nm"><b>0</b>もうやった</span></span>
      </span>
      <span class="rest" id="rest"></span>
    </span>
    <button class="go" id="go">カードにする<span>一枚ずつ、押して仕分けられます</span></button>
  </div>
</div>

<script>
/* 中身は仮。どの会社にもある形の取り決めだけ。業種を選ばない言葉にしてある。
   dup … 被っている相手／need … これのために要る相手／open … まだ決まっていない */
var RULES = [
  ['申請は、所属長の承認を受けてから処理する'],
  ['所属長が不在のときは、代理の者が承認する'],
  ['代理の者は、あらかじめ各部署で定めておく', {need:2}],
  ['承認された申請は、その日のうちに担当へ回す'],
  ['担当は、受け取った申請を3営業日以内に処理する'],
  ['処理が遅れる場合は、申請者に理由を伝える', {need:5}],
  ['月次の報告は、翌月5営業日までに提出する'],
  ['月次報告の提出期限は、翌月の第5営業日とする', {dup:7}],
  ['報告の様式は、共有の場所に置いてあるものを使う'],
  ['様式を変更するときは、事前に周知する', {need:9}],
  ['締めは、月末の翌3営業日までに行う'],
  ['締めの前に、未処理の申請がないか確認する', {need:11}],
  ['未処理の申請があるときは、担当と所属長の双方に連絡する', {need:12}],
  ['連絡は、記録が残る方法で行う'],
  ['記録は、1年間保管する'],
  ['保管期間を過ぎた記録は、担当が廃棄する', {need:15}],
  ['廃棄したことは、記録に残す'],
  ['引き継ぎは、書面で行う'],
  ['引き継ぎ書面には、未処理の件を必ず含める', {need:18}],
  ['引き継ぎの完了は、所属長が確認する'],
  ['新しい取り決めは、決めた日から適用する'],
  ['取り決めを変えたときは、古いものを残しておく'],
  ['古い取り決めをいつまで残すかは、定めていない', {open:1}],
  ['例外を認めるときは、所属長の判断による'],
  ['例外を認めた場合は、記録に残す', {need:24}],
  ['例外が続いたときの扱いは、定めていない', {open:1}],
  ['点検は、四半期ごとに行う'],
  ['点検の結果は、次の会議で共有する', {need:27}],
  ['会議に出られなかった者には、後で共有する'],
  ['共有の方法は、担当に任せる'],
  ['問い合わせは、受けた者が最後まで対応する'],
  ['対応できないときは、分かる者に引き継ぐ'],
  ['引き継いだ後も、受けた者が結果を確認する', {need:31}],
  ['期限のない依頼は、受けない'],
  ['期限を延ばすときは、依頼した者の合意を得る'],
  ['合意が得られないときの扱いは、定めていない', {open:1}],
  ['報告の提出先は、所属長とする'],
  ['月次の報告は、所属長に提出する', {dup:37}],
  ['届出は、変更が生じた日から5日以内に行う'],
  ['届出が遅れたときの扱いは、定めていない', {open:1}]
];

var PICKS = ['要る', '要らない', 'もうやった'];
var SHOW  = 7;                    /* 後ろに見せる厚み */

var stack = document.getElementById('stack'),
    go    = document.getElementById('go'),
    lis   = [],
    counts = [0, 0, 0],
    done = 0;

RULES.forEach(function(r, i){
  var n = i + 1, rel = r[1] || {};
  var li = document.createElement('li');

  var t = document.createElement('div');
  t.innerHTML = '<span class="no">' + n + '</span>';
  t.appendChild(document.createTextNode(r[0]));
  li.appendChild(t);

  /* 関係。**カードになって初めて見える。**詰まっているあいだは見えない */
  if (rel.dup || rel.need || rel.open){
    var rb = document.createElement('div');
    rb.className = 'rel';
    if (rel.dup)  rb.innerHTML += '<b class="dup">' + rel.dup + '番と被っている</b>';
    if (rel.need) rb.innerHTML += '<b class="needs">' + rel.need + '番のために要る</b>';
    if (rel.open) rb.innerHTML += '<b class="open">決まっていない</b>';
    li.appendChild(rb);
  }

  var pk = document.createElement('div');
  pk.className = 'pick';
  PICKS.forEach(function(name, k){
    var b = document.createElement('button');
    b.innerHTML = name + '<i>' + (k + 1) + '</i>';
    b.onclick = function(){ sort(li, k, name); };
    pk.appendChild(b);
  });
  li.appendChild(pk);

  stack.appendChild(li);
  lis.push(li);
});

document.getElementById('n').textContent = RULES.length;
tally();

function live(){ return lis.filter(function(l){ return !l.dataset.gone; }); }

/* 手前から順に番号を振り直す。0 が手前の一枚 */
function restack(){
  live().forEach(function(l, i){
    l.style.setProperty('--i', i);
    if (i === 0){ delete l.dataset.back; } else { l.dataset.back = '1'; }
    if (i >= SHOW){ l.dataset.hide = '1'; } else { delete l.dataset.hide; }
  });
}

/* 仕分ける。**待たせない。**押した瞬間に次の一枚が前へ出て、
   押された一枚は**選んだ山へ飛んでいく**（見届けさせない）。 */
function sort(li, k, name){
  if (li.dataset.gone) return;

  /* 行き先＝その山。カードの今いる場所との差を測って、そこへ投げる */
  var a = li.getBoundingClientRect(),
      b = document.getElementById('h' + k).getBoundingClientRect();
  li.style.transform =
    'translate(' + Math.round(b.left + b.width / 2 - (a.left + a.width / 2)) + 'px,'
                 + Math.round(b.top + b.height / 2 - (a.top + a.height / 2)) + 'px) scale(.12)';

  li.dataset.gone = '1';
  li.classList.add('out');
  counts[k]++; done++;

  restack();                       /* 次が前へ出るのは、飛ぶのを待たない */
  tally();

  setTimeout(function(){ li.hidden = true; }, 320);

  /* **勝手に終わらせない。**終わるのは「ここまでにする」を押したときか、
     束を全部やり切ったときだけ。リズムが出てきたところで止めない。 */
  if (!live().length) setTimeout(finish, 380);
}

function tally(){
  counts.forEach(function(c, k){
    var heap = document.getElementById('h' + k);
    heap.querySelector('.nm b').textContent = c;
    var bars = heap.querySelector('.stackbars'), want = Math.min(c, 9);
    while (bars.children.length > want) bars.removeChild(bars.lastChild);
    while (bars.children.length < want) bars.insertBefore(document.createElement('i'), bars.firstChild);
    /* 幅を少しずつ変えて、紙が揃っていない感じにする */
    [].forEach.call(bars.children, function(i, n){ i.style.width = (44 + (n % 3) * 5) + 'px'; });
  });
  document.getElementById('rest').textContent = '残り ' + live().length + ' 件';
}

/* 重い側の一手 → 束へ。背景も同時に明るくなる */
go.onclick = function(){
  if (document.body.dataset.stage === 'wall'){
    document.body.dataset.stage = 'cards';
    restack();
    document.getElementById('h').textContent = RULES.length + ' 件を、一枚ずつ';
    document.getElementById('p').innerHTML =
      '一枚ずつ出てきます。<b>被っているもの・何かのために要るもの・まだ決まっていないもの</b>に印が付いています。'
      + '<br>見えていれば、押せます（キーの <b>1 2 3</b> でも）。';
    /* 抜け口は最初から出しておく。いつやめてもいい */
    go.innerHTML = 'ここまでにする<span>いつでも抜けられます</span>';
    window.scrollTo(0, 0);
    return;
  }
  finish();
};

function finish(){
  document.body.dataset.stage = 'end';
  document.getElementById('h').textContent = '見直したもの';
  document.getElementById('p').innerHTML =
    '押した ' + done + ' 件が台帳に入りました。残りも同じ形で片付きます。';
  go.hidden = true;
  window.scrollTo(0, 0);
}

/* マウスが無くても押せるように。1 2 3 で三択 */
document.addEventListener('keydown', function(e){
  if (document.body.dataset.stage !== 'cards') return;
  var k = '123'.indexOf(e.key);
  if (k < 0) return;
  var top = live()[0];
  if (!top) return;
  e.preventDefault();
  sort(top, k, PICKS[k]);
});
</script>

</body>
</html>
