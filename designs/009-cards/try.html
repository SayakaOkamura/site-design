<!-- 009 デモ ─ **ざっくり版**（2026-09-08 に組み直した）
     ================================================================
     **NOTES.md の「この案のコア」を先に読む。**ここはその型の一発目で、
     詰めていないところが三つある（下の「仮」を参照）。

     コア：**制約の中の自由・不自由。**縛るのは量ではなく形。
       生の文＝自由（何でも書ける。だから手がつかない）
       カード＝不自由（一枚に一つ、書式が決まっている。だから動ける）

     型（感情の順）：**あるなあ → 一瞬の不快 → 快 → 自分ごと**
       ① 種        **一つだけ聞く**（何件溜まってる？）。②の量が自分の申告のぶんになる
       ② 不快      同じものが量の中に埋もれる。**無理だと分からせる（やらせない）**
       ③ 快        横長のカードが一列一個。一覧に**ボタンは無い**（題とカードだけ）。
                  **まとまりは三段：断片 → 言い方 → 件。**同じ言い方は一枚にまとめて
                  「n か所」と出す。押すと**右の帯**に AI の要約と、まとめる前の全部。
                  そこで三択。**見る → 決める**の順
       ④ 名前      通り終わったところに理念と、**仕分けの答え**
                  （「402 枚ありました。やることは 5 件です」）
     **「あるなあ」は③の題で起きる**（12 個・短い・太い）。
     生の文は読まれない前提で組んである（本人 2026-09-08）。

     分担：**見抜くのは機械、決めるのは人。**分類と AI 要約は機械の仕事で、
     **要約は帯にだけ載る**（カードには推論を載せない。§2）。三択を押すのは人。
     **分担がそのまま手順になっている**——帯で読んで、帯で決める。

     出さないもの：点数・レベル・達成演出・音・**実測秒数**（「体感で」）。
     足すもの：重さ、影、押したときのずれ、片付いた束の厚み。

     ここが仮 ──────────────────────────────────────────────
     1. ①の問いの言葉と四択の刻み（36／120／402／数えたことがない）
     2. ②の問いが二行ある（分ける前に、同じ件がいくつあるか）。まだ長い
     3. ③の三択は分類まるごとだけ（帯の中）。「この一枚だけ」は出していない
     4. 押した先を戻す手が無い（間違えたら「もう一度」からやり直し）
     件数は本人が①で答えたもの（`N`）。**何件でも群は 12、カードは 60、手数は 12。**
     変わるのは枚数だけ（36／120／402）——**量は数字として残る。**

<style>
:root{
  --bg:   #e8f0f8;
  --card: #ffffff;
  --tint: #eff5fb;
  --ink:  #251f45;
  --sub:  #5c6288;
  --go:   #6354e0;
  --frame:#d8e5f1;
  /* ④の面。**index の社名カードと同じ値**（2026-09-09）。
     前はグラデーション（水色→紫）。**同じ名前の色が二つの意味になる**ので揃えた。
     紫（--go）は「飛ぶ」の印なので、ここにも使わない */
  --face: #251f45;

  --lift1: 0 1px 2px rgba(31,25,64,.07), 0 3px 8px rgba(31,25,64,.08);
  --lift2: 0 2px 4px rgba(31,25,64,.08), 0 10px 24px rgba(31,25,64,.12);
  --lift0: 0 1px 1px rgba(31,25,64,.12);
  --lift3: 0 8px 16px rgba(31,25,64,.12), 0 28px 56px rgba(31,25,64,.18);

  /* **等幅は残す。**「まだ形が付いていない」の印であって、端末の意匠ではない。
     暗い地と緑の字（--crt-*）は**捨てた**——本人 2026-09-08：
     「デモの色があれである意味がもうないな」「コンセプト絞ったならもうそこに
     完全にかじきろう。あとは捨てよう」。あれは 006／008 から持ってきた
     「難解さ」の借り物で、いまのコアからは一行も出ていなかった。 */
  --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,
          "Liberation Mono","Courier New",monospace;

  /* ②の山だけが使う字面。**出どころごとに字面が違う**のが「揃っていない」の芯。
     ゴシック（メール・チャット・議事録）／明朝（文書・PDF）／等幅（表）。
     **意匠は借りない**——製品の色や記号は使わない。字面と作法だけ */
  --sans: "Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",
          system-ui,-apple-system,"Segoe UI",sans-serif;
  --mincho: "Hiragino Mincho ProN","Yu Mincho","YuMincho","MS PMincho",serif;

  --r: 10px;
  --ease: cubic-bezier(.2,.7,.3,1);
  --snap: cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html{height:100%; scrollbar-gutter:stable}
body{
  min-height:100%; margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",
              system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column;
}

/* ─ 分け方は**色ではなく面。**ここがコアに直結している ──────────
   生の文 ＝ **面が無い。**掴む所がないので手がつかない（自由）
   カード ＝ **面と影がある。**掴める（不自由が動きを生む）
   地は最初から最後まで同じ。**暗転もしない。**
   変わるのは「面があるかないか」だけ——それが「縛るのは形」の見た目。 */

/* **中身と同じ幅。**908 はホームの寸法をそのまま持ってきていたもので、
   ここの中身は 1180。**頭の戻る道が、一覧の左端より 200px 内側に浮いていた**
   （本人 2026-09-08：「位置が変だよ」）。左端を揃える。 */
.in{width:100%; max-width:1180px; margin:0 auto; padding:0 24px}
.wrap{flex:1 0 auto; width:100%; max-width:1180px; margin:0 auto; padding:34px 24px 40px}

/* ─ 頭。戻る道を常設する（009 の決めごと）─
   **戻る道が分かりにくかった**（本人 2026-09-08：「戻る動線がずっと
   わかりにくいかも」）。原因は三つあって、全部直した：

   1. **影が無かった。**009 は「影が付いているものだけ押せる」なので、
      薄い字だけの「もどる」は**押せるものに見えていなかった**
   2. **行き先を言っていなかった。**「もどる」だけでは、ブラウザの戻るなのか
      デモの前の段なのか分からない。**行き先は言葉に出す**（他の一手と同じ）
   3. **社名の隣にあった。**間が 16px しかなくて、社名の一部に見えていた */
/* **頭を貼りつける。**これが「戻る道が分かりにくい」の本体だった——
   一覧は 5,500px あるので、少し送ると**頭ごと画面の外**へ行っていた
   （実測：2,500px 送った時点で戻る道は -2,489px）。**常設と言えていなかった。**
   ホームは短いので問題にならないが、ここは長い。 */
.top{flex:none; position:sticky; top:0; z-index:5; height:60px;
     display:flex; align-items:center; background:var(--frame)}
.top .in{display:flex; align-items:center; gap:28px}
.back{
  flex:none; text-decoration:none;
  padding:9px 15px; border-radius:7px;
  background:var(--card); color:var(--ink); box-shadow:var(--lift1);
  font-size:12.5px; font-weight:700; white-space:nowrap;
  transition:transform .16s var(--ease), box-shadow .16s ease;
}
.back:hover{transform:translateY(-2px); box-shadow:var(--lift2); color:var(--go)}
.back:active{transform:translateY(1px); box-shadow:var(--lift0)}
.back:focus-visible{outline:2px solid var(--go); outline-offset:3px}
.back i{font-style:normal; margin-right:7px; color:var(--sub)}
.mark{font-size:13.5px; font-weight:700; letter-spacing:.02em; min-width:0;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

/* ─ ② **課題管理表そのもの**（2026-09-10）────────────────────────
   > この形さ、**ユーザが見ることないじゃん。だから親近感がない。
   > ないもののボタンを押してる**（本人 2026-09-10）

   そのとおりで、**メール・チャット・議事録・表を一列に混ぜた画面はどこにも無い。**
   メールは受信箱で、チャットはスレッドで、議事録はファイルで見る。
   **一箇所に集まって見えるのは、課題管理表だけ。**しかも見慣れている。

   痛みもそこにある——**表は開けるのに、表を見ても決まらない。**
   状態が「要確認」「調査中」、担当が空欄、備考が「別紙による」「議事録参照」で、
   **表の外へ飛ばされる。**

   09-07 に一度「表は整理済みに見える」で外している。あのとき出していたのは
   **題が付いた綺麗な表**で、いまのは逆——**行がびっしりあって、状態と担当が
   埋まっていない表。**そこが同じ穴に落ちていないかは、見て確かめる。 */
/* **列の幅は `.sheet` に置く**——見出し行と行の両方から参照するので、
   `.pile` に置くと見出しが列を作れず縦積みになった（画面で見つけた）*/
/* ─ タブ＝**出どころ**（2026-09-10）──────────────────────────────
   > 私の言ってるタブ分けは、**チャットとか仕様書とか全部どこ参照したっていうのが
   > 一つの表にまとまってるのが本来不思議だよね**って意味ね（本人 2026-09-10）

   そのとおりで、備考に「チャット参照」と書いてある表は**もう集まっている。**
   実際はチャットはチャットに、議事録は議事録にある。**別の場所にある。**
   だからタブで分ける——**タブの枚数が「散らばっている」で、
   タブを押すたびに出てくる別の 70 行が「量」。**

   数字（402）では量が実感できない（本人：「こんだけ件数作っておいて
   ろくに見られないだろう」——画面に出るのは 13 行）。**手で見に行ける形にした。** */
.tabs{display:flex; flex-wrap:wrap; gap:4px; margin:0 0 -1px; padding:0}
.tb{
  -webkit-appearance:none; appearance:none; border:0; font:inherit; cursor:pointer;
  font-family:var(--mono); font-size:12px; line-height:1;
  padding:9px 14px; border-radius:6px 6px 0 0;
  background:rgba(255,255,255,.5); color:var(--sub);
  transition:background-color .14s ease, color .14s ease;
}
.tb:hover{background:rgba(255,255,255,.85); color:var(--ink)}
/* 選んでいるタブは**箱と同じ白**。紙が一枚手前に来ている形（下の線を消す）*/
.tb.on{background:var(--card); color:var(--ink); font-weight:700;
       border:1px solid var(--rule); border-bottom-color:var(--card);
       padding:8px 13px; position:relative; z-index:1}
.tb:focus-visible{outline:2px solid var(--go); outline-offset:2px}
.tb em{font-style:normal; margin-left:9px; color:var(--sub); font-weight:400}
.tb.on em{color:var(--ink)}
/* 表のときだけ、列の見出しが出る */
.sheet:not(.grid) .hd{display:none}

/* ─ 出どころごとの形。**借りるのは作法だけ**——メールは件名が上に付く、
   議事録は中点で始まる、表はセルに番地が付く。**意匠は借りない**
   （表計算の緑やメールの青は使わない）*/
.pile .m{font-family:var(--sans); font-size:12.5px; line-height:1.7;
         border-left:2px solid #cdd8ea; padding-left:10px}
.pile .m b{display:block; font-size:11px; font-weight:700; color:var(--sub); letter-spacing:.02em}
.pile .c{font-family:var(--sans); font-size:12px; line-height:1.55;
         margin-left:20px; color:rgba(37,31,69,.66)}
.pile .g{font-family:var(--sans); font-size:12.5px; line-height:1.7}
.pile .d{font-family:var(--mincho); font-size:14px; line-height:1.8}
.pile .p{font-family:var(--mincho); font-size:11.5px; line-height:1.6;
         border:1px solid #d5deec; padding:4px 9px; border-radius:2px}

/* ─ **表が細い**（本人 2026-09-10）─────────────────────────────
   罫線が下線だけ・列が四つ・字が薄い、で**表というより一覧**に見えていた。
   1132px のうち 700px が件名の空きで、**痩せて見えていた。**

   直したのは三つ——**縦の罫線を入れた**（升目になる）、
   **列を二つ足した**（起票日・分類。**どちらも半分は空欄**なので、
   埋まっていない列が四つに増える）、**行を詰めた**（26px → 22px。
   同じ窓で 13 行 → 16 行見える＝「多い」が強くなる）。

   **備考の列は戻さない**——「チャット参照」が表に書いてあるのが
   そもそもおかしい、が指摘の中身だった（タブに分けた時点で参照先は別の場所）。 */
.sheet{
  --cols:34px 46px 84px 62px minmax(0,1fr) 72px 78px 62px;
  --rule:#ccd6e6;                    /* 升目の線。**紙の罫より少し濃い** */
  font-family:var(--mono); font-size:11.5px; line-height:1.45;
}
/* **overflow は触らない。**囲んだ箱に overflow:hidden を付けたら、
   その箱が巻き取る場所になって、**貼りつく見出しが箱の上 60px に居座り、
   一行目がその裏に隠れた**（画面で見つけた。§ホームの採寸と同じ罠）*/
.sheet.grid{background:var(--card); border:1px solid var(--rule)}
/* 見出しの行。**貼りつく**——送っても列が何か分かる */
/* **帯の下に貼りつく。**60px 固定にしていたら、題の帯と重なった */
.sheet .hd{
  position:sticky; top:var(--stick,140px); z-index:2;
  display:grid; grid-template-columns:var(--cols);
  gap:0; padding:0; background:#dbe4f2; border-bottom:1px solid var(--rule);
  font-size:10.5px; font-weight:700; color:var(--sub); letter-spacing:.02em;
}
.sheet .hd > span{
  padding:6px 8px; border-right:1px solid var(--rule);
  min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.sheet .hd > span:last-child{border-right:0}
.sheet:not(.grid){padding:0 10px}
.pile{list-style:none; margin:0; padding:0; columns:auto}
.pile li{
  padding:5px 0; margin:0;
  border-bottom:1px solid rgba(37,31,69,.07);
  color:rgba(37,31,69,.82); cursor:pointer;
  transition:background-color .12s ease, opacity .2s ease;
}
.sheet.grid .pile li{
  display:grid; grid-template-columns:var(--cols); gap:0;
  padding:0; margin:0; border-radius:0;
  border-bottom:1px solid #e4eaf3;
}
.sheet.grid .pile li > span{padding:3px 8px; border-right:1px solid #eaeff6}
.sheet.grid .pile li > span:last-child{border-right:0}
/* **一行おきに薄く敷く。**表計算の作法（意匠は借りない——色は地の色のまま）*/
.sheet.grid .pile li:nth-child(even){background:rgba(37,31,69,.025)}
.sheet.grid .pile li:hover{background:rgba(99,84,224,.11)}
.pile li:hover{background:rgba(99,84,224,.09)}

.pile li > span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* **セルの class は `c-` で始める。**`.st` は段（`.st-a`／`.st-b`）の class と
   ぶつかって、`[data-stage] .st{display:none}` で**状態の列が丸ごと消えていた**
   （画面で見つけた。列が一つぶんずれて見えた）*/
.pile .c-no{color:#98a2bd}
.pile .c-ti{color:var(--ink)}
/* **埋まっていないところが、そのまま見える。**空欄に印は打たない */
.pile .c-st,.pile .c-pi,.pile .c-dl,.pile .c-up,.pile .c-kd{color:var(--sub)}
/* ─ チェック欄。**押すものの顔をしていなかった**（本人 2026-09-10：
   「クリックしなきゃいけないっていうのもわかりにくい」）。
   文字の □ は**書いてあるだけ**に見える。**升目にして、指を乗せると光る。** */
.pile .c-ck{font-size:0; text-align:center}
.pile .c-ck::before{
  content:''; display:inline-block; width:12px; height:12px; vertical-align:middle;
  border:1.5px solid #a9b5cd; border-radius:2px; background:#fff;
  transition:border-color .12s ease, background-color .12s ease, box-shadow .12s ease;
}
.pile li:hover .c-ck::before{border-color:var(--go); box-shadow:0 0 0 3px rgba(99,84,224,.16)}
.pile .c-ck.on::before{background:var(--go); border-color:var(--go)}
/* **最初の一行だけ、脈を打つ。**教えるのは一度だけ（押したら止まる）*/
.pile li.pick .c-ck::before{border-color:var(--go); animation:tap 1.7s ease-in-out infinite}
@keyframes tap{
  0%,100%{box-shadow:0 0 0 0 rgba(99,84,224,.4)}
  55%    {box-shadow:0 0 0 6px rgba(99,84,224,0)}
}
/* 未読の印。**通知の顔**。付いていない行にも同じ場所を空けておく（行頭が揃う）*/
.pile .dot{
  display:inline-block; width:6px; height:6px; border-radius:50%;
  background:var(--go); margin-right:8px; vertical-align:middle;
}
.pile .dot.off{background:none}
/* 番号。**どの出どころにも出す**——辿る先を番号で呼ぶので、無いと探せない */
.pile .rid{font-style:normal; font-family:var(--mono); font-size:10.5px;
           color:#9aa6c2; margin-right:9px; letter-spacing:0}

/* ─ まとまる動き（②→③のあいだ）── **③の実物へ着地させる**（2026-09-10）───
   前は画面の真ん中に 12 個の点を置いて、そこへ寄せてから③へ切り替えていた。
   **着いた先と③の並びが別物**だったので、寄せた意味が無かった：

   > せっかくまとめるモーション作ったのに 3 の画面で下に行ってるから役立ってなくない？
   > **もはや図にしてもいいまである**（本人 2026-09-10）

   そのとおりで、あれは③と繋がっていない**絵**だった。
   いまは**③を先に描いて、12 件の実際の位置を測り、そこへ寄せる。**
   着いたところが、そのまま③の一覧になる。

   **枠は動かさない。**動くのは写した行だけ（§「ジェットコースターにしない」の
   基準は画面酔い。カメラ・送り・寄り引きはしない）。 */
/* 写した行を載せる固定の層。**②の山そのものは動かさない**——
   402 行に transform を掛けると、二段組の再計算で固まる。
   **見えている行だけを写して**、その写しを飛ばす */
.flylayer{position:fixed; inset:0; z-index:6; pointer-events:none}
.fc{
  white-space:nowrap; overflow:hidden;
  font-family:var(--mono); font-size:12px; line-height:1.6;
  color:rgba(37,31,69,.82); padding:4px 3px;
  transition:transform .8s var(--snap), opacity .42s ease .34s;
}
/* ③は透明で待っていて、行が着くころに出る。**題が付くのはここ**——
   寄せるのはコード、題を付けるのは AI。順番で分かる（言葉で説明していない）*/
body.landing .gset{opacity:0}
/* **出るのは transition ではなく animation。**クラスを外して 0 → 1 に流す作りは、
   遅延を付け外しすると `currentTime` 0 のまま止まった（画面で見つけた）。
   `both` の animation なら、遅延のあいだ 0 で待って、終わったら 1 で残る */
.gset.up{animation:rise .36s var(--ease) both}
.pile i{font-style:normal; color:#98a2bd; margin-right:8px}
/* ─ 山。**押せない。見るだけ**（2026-09-10）────────────────────
   一度は「押させる」、次は「五行から選ばせる」にしていた。どちらも外した：

   > 「見覚えあるものありますか〜」から選ばせるのもちょっと違う気がしてる。
   > 選択肢が見にくい割に、**フォーマット統一された状態でみんな持ってるわけじゃない**
   > から**どれも違う、になる可能性の方が高い。**
   > **不快要素は「うわ…多いな…」と思わせるだけでも行ける**と思うよ（本人 2026-09-10）

   **②の仕事は「多いな」だけ。**選ばせない、押させない、仕分けさせない。
   山は量の側で、見えていればいい。**押せる姿を持つものは②に一つも無い**
   （一手のボタンを除いて）。 */
/* **どの行も押せる。**ただしボタンの見た目にするのは一行だけ（下の `.pick`）——
   402 行ぜんぶを押せる姿にすると、詰めた一覧が台帳＝仕事に見える */
.pile li{padding:4px 3px; margin:0 -3px; border-radius:3px;
         white-space:nowrap; overflow:hidden; cursor:pointer;
         transition:background-color .12s ease, opacity .2s ease}
.pile li:hover{background:rgba(99,84,224,.1)}

/* ─ 一行だけ押せる（出し切ったあと）─────────────────────────
   **もう全部ある**ものを一つ片付けても減らない、を一手で出す。
   押すのは一回きり——09-09 は八歩押させて、**行き止まりまで着かれなかった。**

   **自分のせいにしない。**402 行は来る前からあるもので、
   押したから増えるのではない（本人 2026-09-10：「一手打って増える、は
   その人のせいになっちゃいそう」）。 */
/* ─ 合図の置き場所。**右端は遠すぎた**（本人 2026-09-10：「片付ける表記が端すぎる」）。
   1132px の表で、チェック欄（左端）と「片付ける」（右端）が
   **1100px 離れていた**——どっちを押すのか分からない。

   **右端の枠ごと捨てて、押す場所そのものに寄せた**——表の上の一行（下の .how）で
   一度だけ言葉にして、あとは**チェックが脈を打つ**。 */
.sheet.grid .pile li.pick{background:rgba(99,84,224,.07)}
.sheet:not(.grid) .pile li.pick{background:var(--card); box-shadow:var(--lift1)}
/* 抜けるところ。**一行ぶんしか動かない**——それが「効かない」の中身 */
.pile li.gone{
  opacity:0; transform:translate(14px,-4px);
  transition:opacity .22s ease, transform .26s var(--ease);
}


/* 問い。**答えさせない。**見て「無理」と分かった時点で先へ行ける */
.ask{margin:0 0 18px; font-size:15px; font-weight:700; line-height:1.8}
.ask .sub{display:block; min-height:1.8em; font-size:13px; font-weight:500; color:var(--sub)}
/* ─ **何をしている画面か**（本人 2026-09-10：「何してる画面かがわからない」）。
   題は「ある会社の、課題まわりです」だけで、**タブが何か・押していいのか**を
   どこにも書いていなかった。**表のすぐ上、左端**——チェック欄の真上に置く。 */
.how{
  flex:1 0 100%; margin:0; font-size:12px; line-height:1.7; color:var(--sub);
  font-family:var(--sans);
}
.how b{color:var(--go); font-weight:700}
/* 辿ってきた道。**何か所目かが見えていないと、ただ動かないに見える** */
.how .tr{font-family:var(--mono); font-weight:700; color:var(--ink)}
/* 見に行く。**紫は「飛ぶ」の印**（§色の決め） */
.how .jump{
  -webkit-appearance:none; appearance:none; border:0; font:inherit; cursor:pointer;
  margin-left:10px; padding:5px 12px; border-radius:6px;
  background:var(--go); color:#fff; font-size:11.5px; font-weight:700;
  box-shadow:var(--lift1); transition:transform .16s var(--ease), box-shadow .16s ease;
}
.how .jump:hover{transform:translateY(-1px); box-shadow:var(--lift2)}
.how .jump:active{transform:translateY(1px); box-shadow:var(--lift0)}
.how .jump:focus-visible{outline:2px solid var(--go); outline-offset:3px}

/* ─ 引っかかっている行 ── **色は足さない**（§捨てた --crt-*）。
   **手は付けた、でも止まっている**を、灰で埋めたチェックと薄い地で出す。
   紫にしないのは、紫が「進む・飛ぶ」の印だから */
.pile li.wait,
.sheet.grid .pile li.wait{background:rgba(37,31,69,.075)}
.pile li.wait .c-ck::before{background:#c3cadb; border-color:#a9b5cd}
/* いま見に行く先。**脈を打つ**——探させない */
.pile li.aim,
.sheet.grid .pile li.aim{background:rgba(99,84,224,.14)}
.pile li.aim .c-ck::before{border-color:var(--go); animation:tap 1.2s ease-in-out infinite}
/* **一手は問いの隣に置く。**下端に貼りつけていたら、**山の上に浮いて**
   問いからも離れていた（本人 2026-09-08：「同じ件をまとめる、のボタンの
   位置もちょっと不思議だな」）。**答える相手のすぐ横にある**のが素直。
   山はその下に、証拠として続く。 */
/* ─ **問いは貼りつく。**山を送っても、答えられていない問いが目の前に残る。
   （前は山の上に置いていた。下に置いたときは山を越えないと問いに届かなかった）*/
.ask2{
  position:sticky; top:60px; z-index:3;             /* 頭の下 */
  display:flex; align-items:center; column-gap:26px; row-gap:9px; flex-wrap:wrap;
  margin:0 0 14px; padding:14px 0 14px; background:var(--bg);
}
/* **問いの幅に蓋をする。**flex の折り返しは中身の max-content で決まるので、
   注記が一行入っただけで問いが広がり、**一手が次の行へ落ちた**——そこから下が
   まるごと 76px 下がって、②の「片付ける」が動いた（2026-09-09、560px で数えた）。
   蓋をすれば折り返しは起きない。広い窓では中身のほうが短いので見た目は変わらない */
.ask2 .ask{margin:0; max-width:calc(100% - 200px)}
.ask2 .one{margin-top:0; flex:none}
/* ─ **行き先は、壁に当たってから出す。**
   本人 2026-09-08：「同じのまとめるってもう見えてるしなあ」。
   最初から出ていたので、**一枚ずつ押す理由が無かった**——答えが先に置いてあった。
   出るのは、**押してみたか、山の底まで見たか**のどちらか。
   どちらも「壁に当たった」——やって諦めるのと、見て諦めるのは別のこと（前の節）*/
/* **場所は最初から取っておく**（2026-09-09。狭い窓で、この一手が出た瞬間に
   行が折れて、②の「片付ける」が 79px 下へ逃げた。画面で数えた）。
   `hidden` で消すと折り返しが変わるので、**見えないだけにする** */
#go-c{visibility:hidden}
#go-c.on{visibility:visible; animation:rise .28s var(--ease) both}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}

/* ─ 一手。**行き先が言葉に出ている** ─ */
.one{
  -webkit-appearance:none; appearance:none; border:0; font:inherit; cursor:pointer;
  margin-top:26px; padding:15px 26px; border-radius:8px;
  background:var(--go); color:#fff; font-size:14px; font-weight:700;
  box-shadow:var(--lift1); transition:transform .16s var(--ease), box-shadow .16s ease;
}
.one:hover{transform:translateY(-2px); box-shadow:var(--lift2)}
.one:active{transform:translateY(1px); box-shadow:var(--lift0)}
.one:focus-visible{outline:2px solid #fff; outline-offset:3px}
body[data-stage="c"] .one:focus-visible{outline-color:var(--ink)}

/* ─ ③ ── **同じ山が、群ごとに固まっている**（2026-09-10 に作り直した）───
   ここまでに六度作り直している。前の形は 12 枚のカードの一覧で、
   押すと右に帯が開き、三択でその件が抜けた。**一件あたり二手・通しで 25 手前後。**

   > **12 手も操作されないでしょ、そもそも**
   > **別に気持ちよくないよ、今のデモ**（本人 2026-09-10）

   気持ちよくなかった原因は**一手で動く量。**カード一枚を押してカード一枚が消えるので、
   動くのは 60px ぶん。②で 402 行を見せておいて③で動くのがそれでは、落差が出ない。

   だから**行そのものを、そのまま置いておく。**③は②と同じ山で、
   違うのは**群ごとに固まって、題が付いている**ことだけ。題を押すと**群ぜんぶが抜ける。**
   一手目（②）で片付くのは一行、二手目（③）で片付くのは数十行。
   **押し方も、押す相手も、動詞も同じ。変わるのは材料の形だけ。**

   **全部は片付けさせない。**一手で出口を出して、残りは盤面に残したまま送る
   （§「出口の感情」——ゴールは「これならちょっとずつでもできるかも」。
   一気に終わるところを見せると、量が多い人ほど遠ざかる）。 */
.bar{
  position:sticky; top:60px; z-index:4;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap;
  /* **12 件を一画面に収める**（2026-09-10）。まとめた結果が折り目の下に
     はみ出したら、まとめた意味が見えない。頭も一行も詰めた */
  margin:0 0 14px; padding:11px 0 12px; background:var(--bg);
}
.bar h1{margin:0; font-size:clamp(15px,2vw,19px); font-weight:700; line-height:1.5}
.bar .one{margin-top:0; flex:none; margin-left:auto}

/* 群。**器は面を持たない。**面を持つのは題だけ——
   §「面があるものだけ掴める」をそのまま使う。行は材料のまま地の上にいる */
/* 一件ぶんの器。**12 件が一画面に収まる詰め**（2026-09-10）——
   まとめた結果が折り目の下へはみ出したら、まとめた意味が見えない */
.gset{margin:0 0 4px}
/* ③だけ上を詰める。**12 件が折り目の上に収まるかどうか**の 14px */
body[data-stage="c"] .wrap{padding-top:20px}
/* 一件の札。**面と影を持つ＝押せる**（§「面と影があるものだけ掴める」）。

   一度は押せなくした（2026-09-10：「片付けるところは入れなくていい。意味ないから」）。
   **あのときは②に体験があった**ので、③にもあると二重だった。
   **②をデモ側に寄せたので、③に戻した**（本人 2026-09-10：「体験の側面を 3 に寄せて、
   2 をデモに近くするか」）。

   **ゴールは「これならちょっとずつでもできるかも」。**402 行で手を動かしても
   出るのは「できない」だけで、**手が付く実感は 12 件の側でしか起きない。** */
.gitem{
  -webkit-appearance:none; appearance:none; border:0; font:inherit; cursor:pointer;
  display:flex; align-items:baseline; gap:14px; width:100%; text-align:left;
  padding:8px 16px; border-radius:7px;
  background:var(--card); color:var(--ink); box-shadow:var(--lift1);
  transition:transform .16s var(--ease), box-shadow .16s ease;
}
.gitem:hover{transform:translateY(-2px); box-shadow:var(--lift2)}
.gitem:active{transform:translateY(1px); box-shadow:var(--lift0)}
.gitem:focus-visible{outline:2px solid var(--go); outline-offset:3px}
/* 動詞は②と同じ「片付ける」。**変わったのは相手の形だけ**だと言葉でも揃える */
.gv{margin-left:8px; font-size:12.5px; font-weight:700; color:var(--go); white-space:nowrap}

/* ─ 抜ける ─────────────────────────────────────────────
   **押した札が右へ抜けて、下が詰まる。**空きが残ると「減った」、
   詰まると「片付いた」。**点数・演出・音は足さない**（§5）*/
.gset.out .gitem{transform:translate(18px,-4px); opacity:0;
                 transition:transform .26s var(--ease), opacity .22s ease}
.gset.shut{
  overflow:hidden; opacity:0;
  transition:max-height .42s var(--snap), margin-bottom .42s var(--snap), opacity .24s ease;
}
.gt{font-size:14px; font-weight:700; min-width:0; flex:1 1 auto;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
/* 行数。**点数ではない**——材料の量。この題が何行ぶんか */
.gn{font-family:var(--mono); font-size:12px; color:var(--sub); white-space:nowrap;
    flex:none; min-width:96px; text-align:right}
/* ─ 内訳の四角。**②のタブと同じ並び**——塗ってあるところに、この件の行がある。
   **色は足さない**（§捨てた --crt-*）。濃さだけで「ある／ない」*/
/* **題が余白を全部取る。**auto の余白を二つ置くと分け合って、
   四角の位置が題の長さでずれた（画面で見つけた）*/
.gsq{
  align-self:center; flex:none;
  display:grid; grid-template-columns:repeat(6, 44px);
  justify-items:center; align-items:center;
}
.gsq .sq{
  width:9px; height:9px; border-radius:2px;
  background:none; border:1px solid rgba(37,31,69,.22);
}
.gsq .sq.on{background:rgba(37,31,69,.5); border-color:rgba(37,31,69,.5)}
/* ─ 名前の段。**札と同じ骨格**（.gitem）で作って、面と影だけ外す。
   見えない題・行数・「片付ける」が、そのまま列の位置を決める */
.gsq .sn{
  font-style:normal; font-size:9.5px; line-height:1.2; color:var(--sub);
  white-space:nowrap; letter-spacing:.01em;
}
.ghd{
  background:none; box-shadow:none; cursor:default;
  padding-top:0; padding-bottom:6px;
}
.ghd:hover{transform:none; box-shadow:none}

/* ─ 内訳は右 ── **12 件の並びを崩さない**（2026-09-10）─────────────
   > 12 件、片づけるよりクリックで内訳見せるとか、いかがか
   > ── この**内訳の出し方を右に出すやつ**にするか（本人 2026-09-10）

   一度は行の直下に開いた。**開くたびに 12 件の並びが動く**——
   「せっかく 12 件にまとめたのに下に行っちゃって見えない」（09-10）と同じ形。
   **③の要は 12 件が並んだ姿**なので、そこを動かさない側を取った。

   **§「開いた中身は行の直下に」（三度外した）には触っている。**
   あれは**並びが動く一覧**での話で、③は 12 件が固定。条件が違うので右に出した。
   狭い窓では下へ回るので、そのときは押した先へ送る。 */
.two-col{display:grid; grid-template-columns:minmax(0,1fr) 400px; gap:26px; align-items:start}
/* 一件も残っていないとき。**中身の無い枠は畳む** */
.two-col.empty{grid-template-columns:minmax(0,1fr); gap:0}
.two-col.empty .side, .two-col.empty .ghd{display:none}
.side{position:sticky; top:76px}
.sidein{
  background:var(--card); border-radius:var(--r); box-shadow:var(--lift1);
  padding:20px 22px 22px;
}
.sempty{margin:0; font-size:12.5px; line-height:1.9; color:var(--sub)}
.sempty b{color:var(--ink)}
.sh{margin:0; font-size:15px; font-weight:700; line-height:1.5}
.sn2{margin:4px 0 10px; font-family:var(--mono); font-size:11.5px; color:var(--sub)}
/* 選ばれている札。**面を持ち上げない**——右と繋がっているので動かさない */
.gset.on .gitem{background:rgba(99,84,224,.09); box-shadow:var(--lift2)}
.gset.on .gitem:hover{transform:none}
.glist{list-style:none; margin:0; padding:0}
.glist li{
  display:grid; grid-template-columns:78px minmax(0,1fr); gap:0 12px;
  padding:9px 0; border-top:1px solid rgba(37,31,69,.08);
}
/* 出どころ。**②のタブと同じ言葉** */
.gs{font-family:var(--mono); font-size:11px; color:var(--sub); padding-top:2px}
.gx{min-width:0}
/* 生の一行。**そのまま**——直していない、が分かるように等幅で薄く */
.gq{display:block; font-family:var(--mono); font-size:11.5px; line-height:1.6;
    color:rgba(37,31,69,.62)}
/* 読み解き。**書かれていないものが書いてある**（AI の仕事）*/
.gp{display:block; margin-top:3px; font-size:12.5px; line-height:1.65; color:var(--ink)}
.gp::before{content:'→ '; color:var(--go); font-weight:700}
.gmore{margin:10px 0 0; font-size:11.5px; color:var(--sub)}
/* 決めるのは人。**見てから押す** */
.one.small{margin-top:14px; padding:9px 18px; font-size:12.5px}
/* 見出しの下の一行。**数字は一度だけ**——一件ごとの内訳を読ませると表に戻る */
.csub{margin:-6px 0 16px; font-size:12.5px; line-height:1.8; color:var(--sub)}
.csub b{color:var(--ink)}
.csub .lg{display:block; font-size:11.5px; color:var(--sub); opacity:.9}
.csub .lg b{color:var(--sub); font-weight:700}


/* ③の下に出る。**段を分けない**（2026-09-10）——
   前は面ごと切り替わっていたので、**12 件が画面から消えてから**出口が出ていた */
.end{max-width:760px; margin-top:34px}
.end .face{
  background:var(--face); color:#fff; border-radius:var(--r); box-shadow:var(--lift2);
  padding:40px 34px; animation:rise .6s var(--ease) both;
}
.end h2{margin:0; font-size:clamp(18px,2.6vw,26px); font-weight:700; line-height:1.5}
.end .said{margin:18px 0 0; font-size:13.5px; line-height:2; color:rgba(255,255,255,.78)}
.end .said b{color:#fff; font-size:15px}
/* 二つの手数を並べる。**同じ押すの重さが違う** */
.end .cmp{display:block; margin-top:14px; padding-top:14px;
          border-top:1px solid rgba(255,255,255,.22); font-size:13px}
.end .again{margin-top:22px; display:flex; gap:12px; flex-wrap:wrap}
/* 出口が出たら「最後に」は要らない。**場所は残す**（消すと題が動く）*/
.one.gone{visibility:hidden; pointer-events:none}

.foot{flex:none; background:var(--frame)}
.foot .in{padding:22px 24px 26px}
.note{margin:0; font-size:11.5px; line-height:1.85; color:var(--sub)}
[data-stage] .st{display:none}
body[data-stage="b"] .st-b,
body[data-stage="c"] .st-c{display:block}
/* 狭い窓。**②の問いと一手だけ。**蓋をやめて、一手を必ず次の行に置く
   （場所は最初から取ってあるので、出ても位置は動かない）。
   `.work`／`.tap`／`body.stuck` は 2026-09-10 に消えた——
   ②が「辿る」をやめて「一行押して止まる」になったので、器そのものが無い */
@media (max-width:620px){
  .ask2 .ask{max-width:none}
  #go-c{flex:0 0 100%}
  .ask .sub{min-height:3.6em}
}

@media (max-width:760px){ .pile{columns:1} }
/* 狭い窓では四角を畳む。**題と行数が先** */
@media (max-width:1080px){ .two-col{grid-template-columns:minmax(0,1fr)} .side{position:static} }
@media (max-width:820px){ .gsq{display:none} .gn{min-width:0} .ghd{display:none} }
/* 狭い窓では、足した二列を畳む。**升目が潰れると「多い」より「読めない」になる** */
@media (max-width:860px){
  .sheet{--cols:32px 44px minmax(0,1fr) 70px 76px 58px}
  .sheet .hd > span:nth-child(3), .sheet .hd > span:nth-child(4),
  .pile .c-up, .pile .c-kd{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important; transition:none !important}
}
</style>
</head>
<body data-stage="a">

<header class="top">
  <div class="in">
    <a class="back" href="index.html"><i>←</i>会社のページへもどる</a>
    <span class="mark">株式会社アルターデザインコンサルティング</span>
  </div>
</header>

<main class="wrap">

  <!-- ② **多いな、だけ。**（2026-09-10。本人：「不快要素は『うわ…多いな…』と
       思わせるだけでも行ける」）。選ばせない・押させない・仕分けさせない。
       前は「辿る」——文の中の曖昧な語を突いて、行き先にまた曖昧な語があって、
       最後は「無い」で終わる（語 52・行き止まり 10）。**八歩ほど押させる前提**だった。
       本人 2026-09-10：「12 手も操作されないでしょ、そもそも」。②も同じで、
       **行き止まりまで着かれない。着かれない場所を六度作り直していた。**

       いまは一手だけ。**読める五行から、見覚えのあるものを一つ選ぶ → その瞬間に
       残り 397 行が落ちてくる → 選んだ件が山じゅうに散らばっているのが見える
       → そこで止まる。**押し続けさせない。
       ここで光った行が、③で一手ぜんぶ抜ける。**出したものと消すものが同じ。** -->
  <section class="st st-b">
    <!-- **問いは貼りつく。**山を送っても、答えられていない問いが目の前に残る -->
    <div class="ask2">
      <p class="ask">ある会社に、たまっている課題です。<br>
        <span class="sub" id="hint"></span></p>
      <!-- **「まとめてもらう」をやめた**（本人 2026-09-10：「まとめてもらう、って文言
           変えたい」→「整理する、とかにしたい」）。**デモの中でここだけ〜てもらう**で、
           ほかは全部言い切り（片付ける／〜を見る →／最後に／もう一度）。
           しかも理念（「楽をすることではなく」「やらされるでなくやりたい」）と

       （本人 2026-09-10：「メールも何かしら相談してる感じにするとか、
       通知のアイコンを通知っぽくするとか」）。
       中身は足していない——**印だけ。** */
    var un = (c.n % 3 === 0) ? '<i class="dot"></i>' : '<i class="dot off"></i>';
    if (c.src === 'mail')   return '<div class="m"><b>' + un + id + SUBJ[c.n % 3] + '</b>' + t + '</div>';
    if (c.src === 'chat')   return '<div class="c">' + un + id + t + '</div>';
    if (c.src === '議事録') return '<div class="g">' + id + '・' + t.replace(/^・/, '') + '</div>';
    if (c.src === 'pdf')    return '<div class="p">' + id + t + '</div>';
    return '<div class="d">' + id + t + '</div>';   /* docx：明朝のべた書き */
  }
  function rowHTML(c){
    var i = c.n;
    return '<span class="c-ck"></span>'
         + '<span class="c-no">' + no(c) + '</span>'
         + '<span class="c-up">' + UP[(i + 3) % 8] + '</span>'
         + '<span class="c-kd">' + KND[(i + 5) % 8] + '</span>'
         + '<span class="c-ti">' + esc(c.raw) + '</span>'
         + '<span class="c-st">' + ST[i % 8] + '</span>'
         + '<span class="c-pi">' + PIC[i % 8] + '</span>'
         + '<span class="c-dl">' + DUE[i % 8] + '</span>';
  }

  /* ─ ② **山は最初からそこにある。触るのは人のほう**（2026-09-10）───────
     頭を三度動かして、三度とも別の読まれ方をした：
     **一気に出す →「え？」／少しずつ足す →「なんでこんなに増えた？」／
     一度にどん →「何が起こってるんだろう」。**
     共通しているのは**人が頼む前に画面が動いている**こと。頼んでいない動きは
     意図が伝わらない。**頼む前は止まっている、頼んだら動く**に一本化した
     （寄せる動きは「整理する」を押したあとなので、一度も引っかかっていない）。

     滞在時間は**一手のほうが持つ**（本人 2026-09-10：「そうするならせめて
     見えてる状態で何かする→片付け、にしないと」）。

     **押せるのは、見えている行ぜんぶ。**ただし**ボタンの見た目にするのは一行だけ**——
     402 行ぜんぶを押せる姿にすると、詰めた一覧が台帳＝仕事に見える（§で二度捨てている）。
     一行だけ立たせて指す。**教えるのは一度だけ。** */
  var waitT = 0, picked = false, gone = 0;

  function paintPile(){
    clearTimeout(waitT);
    picked = false;
    var hint = document.getElementById('hint'),
        go   = document.getElementById('go-c');
    hint.textContent = '課題管理表・メール・チャット・議事録・仕様書・別紙に散らばって、'
                     + 'ぜんぶで ' + N + ' 行。状態も担当も、埋まっていません。';
    gone = 0; trail = []; stuck = null;
    go.classList.remove('on');
    tab = 'xlsx';
    paintTabs();
    paintRowsOf(tab);
    sayHow();   /* **tab を決めたあと**——先に呼ぶと前のタブの言い方が残る */
    stick();
    /* **押さない人を塞がない。**待っても行き先は出る */
    waitT = setTimeout(function(){ go.classList.add('on'); }, 9000);
  }

  /* 貼りつく帯の高さを測って、表の見出しをその下に貼る。
     **60px 固定にしていたら題の帯と重なった**（帯は折り返しで高さが変わる）*/
  function stick(){
    var a = document.querySelector('.ask2');
    if (!a) return;
    document.documentElement.style.setProperty('--stick', (60 + a.offsetHeight) + 'px');
  }
  addEventListener('resize', stick);

  /* 表の上の一行。**押す場所のすぐ上で、一度だけ言う。**
     片付けたあとは引き算に入れ替わる（下の clearOne）*/
  function sayHow(){
    var el = document.getElementById('how');
    if (!el || gone) return;
    el.innerHTML = 'タブを押すと、その出どころが見られます。'
      + '<b>' + (tab === 'xlsx' ? '行の左のチェック' : '行') + 'を押すと、'
      + 'その行を片付けにいけます。</b>';
    stick();
  }

  /* タブ。**枚数が「散らばっている」、件数が「量」** */
  function paintTabs(){
    var box = document.getElementById('tabs');
    if (!box) return;
    box.innerHTML = TABS.map(function(t){
      var k = shown().filter(function(c){ return c.src === t[0]; }).length;
      return '<button class="tb' + (t[0] === tab ? ' on' : '') + '" data-s="' + esc(t[0]) + '">'
           + esc(t[1]) + '<em>' + k + '</em></button>';
    }).join('');
  }

  /* いま見ている出どころの行だけ出す。**表のときだけ格子** */
  function paintRowsOf(src){
    var pile = document.getElementById('pile'),
        sheet = document.getElementById('sheet');
    if (!pile) return;
    sheet.classList.toggle('grid', src === 'xlsx');
    pile.innerHTML = shown().filter(function(c){ return c.src === src; })
      .map(function(c){
        /* 辿った行は**止まったまま残る**、追いかけている先は**脈を打つ**。
           タブを跨いで描き直すので、印は札のほうから引く */
        var cl = trail.indexOf(c) >= 0 ? ' class="wait"' : (stuck === c ? ' class="aim"' : '');
        return '<li' + cl + ' data-k="' + c.k + '" data-i="' + c.n + '">'
             + (src === 'xlsx' ? rowHTML(c) : srcHTML(c)) + '</li>';
      }).join('');
    /* 合図。**一行だけ、チェックが脈を打つ**（押せるのは全部）。
       **右端の「片付ける」は捨てた**——チェック欄から 1100px 離れていた
       （本人 2026-09-10：「片付ける表記が端すぎる」）。言葉は表の上に一度だけ */
    if (!picked){
      var first = pile.querySelector('li');
      if (first) first.classList.add('pick');
    }
  }

  document.addEventListener('click', function(e){
    if (document.body.dataset.stage !== 'b' || !e.target.closest) return;
    var b = e.target.closest('.tb');
    if (!b) return;
    tab = b.dataset.s;
    paintTabs(); paintRowsOf(tab); sayHow();
  });

  /* ─ 引っかかる ── **押しても、そのままは通らない**（2026-09-10）──────────
     > **でも全部ストレートに片付きはするんだ**（本人 2026-09-10）
     >
     > 押してみたら**これ引っかかってる**ってなって、それ押しに行ったら
     > **また引っかかって、それでやっと通る**、みたいな体験でもさせたら（同）

     どの行を押しても同じように消えていたので、**手でも普通にさばける、
     ただ数が多いだけ**の画面になっていた。実際の課題管理表は逆で、
     **開いても片付かない行のほうが多い**——担当が空欄、状態が「要確認」、
     期限が「次回」。片付けるには**別紙を見に行くか、前任者に聞くしかない。**

     **引っかかり先は、必ず別のタブ。**そこが要で、「散らばっている」が
     言葉ではなく**足で分かる**——表の一行を片付けるのに議事録を開き、
     その議事録がチャット待ちになっている。

     **賽の河原（09-09 に捨てた形）とは別物。**あれは**押しても何も起きない。**
     これは**毎回ちがう場所へ進んで、2〜3 か所で必ず通る。**
     出るのは「終わらねえ」ではなく「**1 件にこれだけかかるのか**」。

     通ると**鎖ごと片付く**——3 行が 1 件だった。
     **③の「402 行は、12 件でした」の前振りになっている。** */
  var NAME = {xlsx:'課題管理表', mail:'メール', chat:'チャット',
              '議事録':'議事録', docx:'仕様書', pdf:'別紙'};
  /* 止まっている理由は、**その場所の言い方**で言う */
  var WHY  = {xlsx:'と同じ件です。先にそちらから',
              mail:'の返信待ちです', chat:'で確認中です',
              '議事録':'の決定待ちです', docx:'の記載待ちです',
              pdf:'を見ないと分かりません'};
  var trail = [], stuck = null, need = 0;

  function label(c){ return NAME[c.src] + ' #' + no(c); }
  function findCard(num){
    for (var i = 0; i < CARDS.length; i++) if (CARDS[i].n === num) return CARDS[i];
    return null;
  }
  /* 引っかかり先。**必ず別のタブ**から、まだ辿っていないものを選ぶ */
  function nextBlock(c){
    if (!CARDS.length) return null;
    for (var t = 1; t <= 60; t++){
      var b = CARDS[(c.n * 7 + t * 31) % CARDS.length];
      if (!b || b === c) continue;
      /* **まだ行っていない出どころ**から選ぶ——同じタブへ戻ると
         「3 か所」と言いながら 2 か所しか回っていないことになる（画面で見つけた）*/
      if (trail.some(function(x){ return x.src === b.src; })) continue;
      if (b.src === c.src || trail.indexOf(b) >= 0) continue;
      return b;
    }
    return null;
  }

  /* 辿っている途中を、表の上に出す。**何か所目かが見えていないと、ただ動かないに見える** */
  function showTrail(){
    var el = document.getElementById('how');
    if (!el || !stuck) return;
    el.innerHTML = '<span class="tr">' + esc(trail.map(label).join(' → ')) + '</span> は、'
      + '<b>' + esc(label(stuck)) + '</b>' + WHY[stuck.src] + '。'
      + '<button class="jump" id="jump">' + esc(label(stuck)) + ' を見る →</button>';
    stick();
  }

  /* 通った。**鎖ごと片付く**——辿った 3 行は、もともと 1 件だった */
  function through(){
    var k = trail.length, nums = trail.map(function(c){ return c.n; });
    nums.forEach(function(num){
      var el = document.querySelector('#pile li[data-i="' + num + '"]');
      if (!el) return;
      el.classList.remove('wait','aim','pick');
      var ck = el.querySelector('.c-ck'); if (ck) ck.classList.add('on');
      el.classList.add('gone');
    });
    trail = []; stuck = null;
    setTimeout(function(){
      nums.forEach(function(num){
        for (var i = 0; i < CARDS.length; i++)
          if (CARDS[i].n === num){ CARDS.splice(i, 1); break; }
      });
      N = CARDS.length; gone += k;
      /* **回数は言わない**（本人 2026-09-10：「終わらねえ〜はベクトルがちょっと違う」）。
         言うのは**一件にかかった手数**と、引き算そのもの */
      document.getElementById('how').innerHTML =
        '<b>' + k + ' か所たどって、やっと 1 件。</b>' + MAX + ' → ' + N + ' 行。';
      stick();
      document.getElementById('hint').textContent =
        '課題管理表・メール・チャット・議事録・仕様書・別紙に散らばって、'
        + 'ぜんぶで ' + N + ' 行。状態も担当も、埋まっていません。';
      document.getElementById('go-c').classList.add('on');
      paintTabs(); paintRowsOf(tab);
    }, 320);
  }

  function press(li){
    if (!li || li.classList.contains('gone')) return;
    var c = findCard(+li.dataset.i);
    if (!c) return;
    picked = true; clearTimeout(waitT);
    var pk = document.querySelector('#pile li.pick');
    if (pk) pk.classList.remove('pick');

    /* 追いかけている先を押したら鎖が伸びる。**別の行を押したら、そこから鎖を引き直す** */
    if (stuck && stuck === c) trail.push(c);
    /* **3〜4 か所で通る。**
       2〜3 では「引っかかった」で終わって、**辿らされている**まで行かなかった
       （本人 2026-09-10：「2 のとこもっと辿ってほしい」）。
       4〜5 にしたら**押す回数が最大 9 回**になって、今度は長すぎた
       （同：「なんかめっちゃ長くなってない！？**辿るの 2 桁ないくらいがちょうどいい**かも」）。

       **数えるのは「か所」ではなく、押す回数。**一か所進むのに二回押す
       （行を押す → 「見る →」を押す）ので、**か所 × 2 − 1** が手数。
       3〜4 か所＝**5〜7 回**——2 桁の手前に余裕がある。
       上限は 6（出どころの数）——辿った出どころは避けるので、それ以上は伸びない */
    else { trail = [c]; need = 3 + (c.n % 2); }

    if (trail.length >= need){ through(); return; }
    var b = nextBlock(c);
    if (!b){ through(); return; }
    stuck = b;
    li.classList.remove('aim');   /* 追いついた印は消す。**次の先へ移る** */
    li.classList.add('wait');
    showTrail();
  }

  document.addEventListener('click', function(e){
    if (document.body.dataset.stage !== 'b' || !e.target.closest) return;
    /* 見に行く。**タブが替わって、その行が真ん中に来る**（探させない）*/
    if (e.target.closest('#jump')){
      if (!stuck) return;
      tab = stuck.src; paintTabs(); paintRowsOf(tab);
      var t = document.querySelector('#pile li.aim');
      if (t) t.scrollIntoView({block:'center', behavior: slow ? 'auto' : 'smooth'});
      return;
    }
    var li = e.target.closest('#pile li');
    if (li) press(li);
  });

  /* ─ まとまる ── **②から③へ渡る一瞬。行が寄って、題が付く** ─────────
     **③の実物へ着地させる**（2026-09-10）。前は画面の真ん中に 12 個の点を置いて、
     そこへ寄せてから③に切り替えていた——**着いた先と③の並びが別物**だったので、
     寄せた意味が無かった（本人：「もはや図にしてもいいまである」）。

     手順は四つ。
       1. **見えている行だけ**を、その場の座標で固定の層に写す（山そのものは動かさない）
       2. ③を描いて（**何も開かない。12 件が一行ずつ並ぶだけ**）、位置を測る。中身は透明
       3. 写した行を、**自分の件の行き先**へ寄せて消す
       4. 行が着いたころに③が出て、そのあと**一件目が開く**
     **枠は動かさない。**動くのは写した行だけ。 */
  function gather(){
    var pile = document.getElementById('pile');
    if (slow || !pile){ stage('c'); return; }
    clearTimeout(waitT);
    document.getElementById('go-c').classList.remove('on');   /* 二度押させない */

    /* 1. 写す。**窓の中だけだと 13 行しか飛ばなかった**（画面で数えた）。
       402 行が 12 件になるところで 13 行しか動かないのは嘘になるので、
       **折り目の下 700px ぶんまで写す**——下から画面に入ってきて、そのまま列に着く。
       写すのは実在する行だけ（作らない）。上限は 90 枚（それ以上は重くなる）*/
    var vh = innerHeight;
    var layer = document.createElement('div');
    layer.className = 'flylayer';
    var clones = [];
    [].forEach.call(pile.querySelectorAll('li'), function(li){
      if (clones.length >= 90) return;
      var r = li.getBoundingClientRect();
      if (r.width <= 0 || r.top < 66 || r.top > vh + 700) return;
      var d = document.createElement('div');
      d.className = 'fc';
      /* **飛ばすのは件名だけ。**表の格子ごと写すと、飛んでいる途中で列が崩れる */
      d.textContent = (li.querySelector('.c-ti') || li).textContent;
      d.style.left = r.left + 'px'; d.style.top = r.top + 'px';
      d.style.width = r.width + 'px'; d.style.position = 'fixed';
      layer.appendChild(d);
      clones.push({ el:d, k:+li.dataset.k, x:r.left, y:r.top });
    });
    document.body.appendChild(layer);

    /* 2. ③を描く。**開かない**ので 12 件が一行ずつ並ぶ＝着地点そのもの */
    stage('c');
    document.body.classList.add('landing');
    var target = {};
    [].forEach.call(document.querySelectorAll('#sets .gset'), function(g, i){
      var r = g.getBoundingClientRect();
      target[+g.dataset.k] = r;
      g.style.animationDelay = (i * 35) + 'ms';    /* **一つの波に見せる** */
    });

    /* 3. 寄せる */
    void layer.offsetWidth;
    clones.forEach(function(c){
      var t = target[c.k];
      if (!t){ c.el.style.opacity = 0; return; }
      c.el.style.transform = 'translate(' + (t.left + 16 - c.x) + 'px,'
                           + (t.top + 9 - c.y) + 'px) scale(.92)';
      c.el.style.opacity = 0;
    });

    /* 4. 着いたころに③が出て、そのあと一件目が開く */
    setTimeout(function(){
      [].forEach.call(document.querySelectorAll('#sets .gset'), function(g){
        g.classList.add('up');
      });
      document.body.classList.remove('landing');
    }, 620);
    /* **着いた形のまま置く**（2026-09-10。本人：「せっかく 12 件にまとめたのに
       それが下に行っちゃって見えない」「モーションで出たときと形変わるし」）。
       着地の直後に一件目を開けていたので、**12 件が並んだ絵が 0.5 秒で崩れて、
       11 件が折り目の下へ押し出されていた。**まとめた結果が見えない。
       いまは開けない——**12 件が並んだまま残る。** */
    setTimeout(function(){
      layer.remove();
      [].forEach.call(document.querySelectorAll('#sets .gset'), function(g){
        g.classList.remove('up'); g.style.animationDelay = '';
      });
      var f = document.getElementById('go-d');
      if (f) f.focus({ preventScroll:true });
    }, 1560);
  }

  /* ─ ③ **二手目** ────────────────────────────────────
     同じ山が、群ごとに固まっている。題を押すと**群ぜんぶが抜ける。**
     **②で押した件を先頭に置く**——追いかけたものが、そのまま次に押す相手になる。
     対象も動作も同じで、変わるのは材料の形だけ。

     **行を出すのは、いま押せる一群だけ**（2026-09-10、画面で見つけた）。
     12 群ぜんぶの行（402 行）を段組で並べたら**描画が止まった**——
     多段組を 12 個積むのは重い。**押せるものだけ面を持つ**は 009 の決めごとなので、
     待っている群は**面も行も持たない一段**にする。中身は押せるようになってから出す。
     残りが題と行数で並んでいるのが、そのまま「残りも同じ一手」の見た目になる。 */
  var setsEl = null, order = [], byG = null, leftG = 0, firstCleared = null, cleared = 0;

  /* 一件。**押せない。**面はあるが影は無い——§「面と影があるものだけ掴める」。
     整った札に見えて、触るものではない。

     **「片付ける」は外した**（2026-09-10。本人：「この方針で行くなら
     片付けるところは入れなくていい。意味ないから」）。
     ②で選ばせず、③でも仕分けさせないなら、**片付けの一手だけ残しても処理でしかない。** */
  /* ─ 内訳 ── **この一件が、どこから来たのか**（2026-09-10）─────────
     > これがこうなった**内訳とかパッと見でわかる**といいかもね（本人 2026-09-10）

     ②で 1 件を辿るのに 3 か所まわった。**③はそれが 12 件ぶん並んでいる**のに、
     画面には「25 行」としか出ていなかった。**どこに散っていたかが消えていた。**

     **四角は②のタブと同じ並び**（課題管理表・メール・チャット・議事録・仕様書・別紙）。
     塗ってあるところに、この件の行がある。**数は出さない**——
     パッと見で要るのは「**どれも 4〜6 か所にまたがっている**」だけで、
     一件ごとの内訳の数字は、読ませると表に戻る。 */
  function places(k){
    var by = {};
    byG[k].forEach(function(c){ by[c.src] = (by[c.src] || 0) + 1; });
    return by;
  }
  function item(k){
    var by = places(k), cnt = 0;
    var sq = TABS.map(function(t){
      var v = by[t[0]] || 0;
      if (v) cnt++;
      return '<i class="sq' + (v ? ' on' : '') + '" title="'
           + esc(t[1]) + ' ' + v + ' 行"></i>';
    }).join('');
    return '<button class="gitem" data-k="' + k + '">'
      +   '<span class="gt">' + esc(GROUPS[k].t) + '</span>'
      +   '<span class="gsq" aria-hidden="true">' + sq + '</span>'
      +   '<span class="gn">' + byG[k].length + ' 行 ／ ' + cnt + ' か所</span>'
      + '</button>';
  }

  /* ─ 内訳を開く ── **押すと中身が出る**（2026-09-10）──────────────
     > 12 件、**片づけるよりクリックで内訳見せる**とか、いかがか（本人 2026-09-10）

     ②を長くした（4〜5 か所）ぶん、**③は見る側に寄せた。**
     四角は「どこに散っていたか」までしか言わない。**押すと、その一件が
     どの一行から来たのかが出る**——生の一行と、機械が付けた読み解きが並ぶ。
     「題を付けたのは AI」を、**言葉ではなく現物で**見せる場所。

     **「片付ける」は開いた中に残す。**③の分担は「見抜くのは機械、決めるのは人」
     （C 案・2026-09-08 合意）。**見てから決める**でないと、決める場所が無い。

     **畳まない**——ほかの件を開いても閉じない（§「開いた中身は行の直下に」）。
     **出すのは群の生の一行だけ**（5〜6 行）。402 行ぜんぶ出すと描画が止まる（09-10） */
  function detHTML(k){
    var g = GROUPS[k], rest = byG[k].length - g.raw.length;
    /* **並びは四角と同じ**（②のタブ順）——上の升と下の一覧で順が違うと、
       同じものを二度読むことになる */
    var ord = TABS.map(function(t){ return t[0]; });
    var rows = g.raw.slice().sort(function(a, b){
      return ord.indexOf(a[0]) - ord.indexOf(b[0]);
    });
    /* **か所は出どころの数。**生の一行の数ではない——同じ出どころに二行あることがある
       （画面で見つけた。札は 4 か所、内訳は 5 か所と出ていた）*/
    var seen = {}, cnt = 0;
    rows.forEach(function(q){ if (!seen[q[0]]){ seen[q[0]] = 1; cnt++; } });
    return '<h2 class="sh">' + esc(g.t) + '</h2>'
      + '<p class="sn2">' + byG[k].length + ' 行 ／ ' + cnt + ' か所</p>'
      + '<ul class="glist">'
      + rows.map(function(p){
          return '<li>'
            +   '<span class="gs">' + esc(NAME[p[0]] || p[0]) + '</span>'
            +   '<span class="gx"><span class="gq">' + esc(p[1]) + '</span>'
            +     '<span class="gp">' + esc(p[2]) + '</span></span>'
            + '</li>';
        }).join('')
      + '</ul>'
      + (rest > 0 ? '<p class="gmore">同じ話が、ほかに ' + rest + ' 行。</p>' : '')
      + '<button class="one small gdo" data-k="' + k + '">片付ける</button>';
  }

  /* 何も選んでいないとき。**空の箱を置かない**——何をすればいいかだけ書く */
  var EMPTY = '<p class="sempty">件を押すと、<b>その一件がどの一行から来たのか</b>が出ます。</p>';

  function select(k){
    var set = setsEl && setsEl.querySelector('.gset[data-k="' + k + '"]');
    var box = document.getElementById('sidein');
    if (!set || !box || set.classList.contains('going')) return;
    /* もう一度押したら閉じる（選び直しは付け替えるだけ）*/
    if (set.classList.contains('on')){
      set.classList.remove('on'); box.innerHTML = EMPTY; return;
    }
    [].forEach.call(setsEl.querySelectorAll('.gset.on'), function(g){ g.classList.remove('on'); });
    set.classList.add('on');
    box.innerHTML = detHTML(k);
    /* 狭い窓では右が下へ回る。**押した先が画面の外にあると気づかれない** */
    if (!slow && innerWidth <= 1000) box.scrollIntoView({block:'nearest', behavior:'smooth'});
  }

  function paintRows(){
    setsEl = document.getElementById('sets');

    /* **出ている札だけで数える。**つまみで 20 行にすれば、出てこない件もある */
    byG = GROUPS.map(function(){ return []; });
    shown().forEach(function(c){ byG[c.k].push(c); });

    /* **並びは題のまま。**②で選ばせなくなったので、先頭に置く「選んだ件」が無い。
       **一行も無い件は出さない**（つまみを絞ると 12 件に満たない）*/
    order = GROUPS.map(function(g, k){ return k; })
                  .filter(function(k){ return byG[k].length > 0; });

    /* **12 件が並んだ状態が、まとめる動きの着地点であり、③の姿。**
       開かない。崩さない。押させない */
    /* **四角だけでは分からない**（本人 2026-09-10：「それ四角だけだとたぶん
       わかんないな」）。名前を上に一段置く——**札とまったく同じ骨格**で作って、
       見えない中身（題・行数・片付ける）で幅を揃える。
       別の組み方で並べると、窓の幅が変わった瞬間に列がずれる */
    setsEl.innerHTML =
      '<div class="gitem ghd" aria-hidden="true">'
      +   '<span class="gt"></span>'
      +   '<span class="gsq">' + TABS.map(function(t){
            return '<i class="sn">' + esc(t[1]) + '</i>';
          }).join('') + '</span>'
      +   '<span class="gn"></span>'
      + '</div>'
      + order.map(function(k){
          return '<div class="gset" data-k="' + k + '">' + item(k) + '</div>';
        }).join('');

    /* **②の量に対する返事。**説明ではない */
    document.getElementById('c-h1').textContent =
      N + ' 行は、' + order.length + ' 件でした';
    /* **散らばりの幅を、数字で一度だけ。**②で辿ったのは 1 件ぶん、
       ここに並んでいるのは同じことが 12 件ぶん */
    var lo = 9, hi = 0;
    order.forEach(function(k){
      var c = 0, by = places(k);
      TABS.forEach(function(t){ if (by[t[0]]) c++; });
      if (c < lo) lo = c; if (c > hi) hi = c;
    });
    document.getElementById('c-sub').innerHTML =
      'どれも <b>' + (lo === hi ? lo : lo + '〜' + hi) + ' か所</b>にまたがっていました。'
      /* **何がやって、誰が**（本人 2026-09-10：「ただ整理するだけを
         何がやって誰が、っていうのも見せたいか？」）。**③で一行だけ。**
         ②で言うと押す前の種明かしになる（09-08「同じのまとめるってもう見えてるしなあ」）。
         結果を見たあとなら「これは魔法ではない」が効く。
         **footer の楽屋に落ちていた事実を、一行だけ引き上げた。**

         「塗ってあるところに〜」は捨てた——**列に名前が付いたので、見れば分かる。** */
      + '<span class="lg">寄せたのは決まった処理、<b>題を付けたのは AI</b> です。</span>';
    leftG = order.length; firstCleared = null; cleared = 0;
    var side = document.getElementById('sidein');
    if (side) side.innerHTML = EMPTY;
    var tc = document.querySelector('.two-col');
    if (tc) tc.classList.remove('empty');
    var box = document.getElementById('end');
    if (box) box.hidden = true;
    var fin = document.getElementById('go-d');
    if (fin) fin.classList.remove('gone');
  }

  /* 片付ける。**押した札が抜けて、下が詰まる。**
     ②で 401 回だったものが、③では 12 回。**同じ「片付ける」の重さが違う。** */
  function clearGroup(k){
    if (!setsEl) return;
    var set = setsEl.querySelector('.gset[data-k="' + k + '"]');
    if (!set || set.classList.contains('going')) return;
    set.classList.add('going');
    if (!firstCleared) firstCleared = GROUPS[k].t;
    leftG--; cleared++;

    function done(){
      if (set.classList.contains('on')){
        var box = document.getElementById('sidein');
        if (box) box.innerHTML = EMPTY;
      }
      set.classList.remove('on'); set.innerHTML = '';
      /* **一件も残っていないなら、名前の段と右の箱も畳む。**
         中身の無い枠が残ると、出口の隣に空箱が並ぶ（画面で見つけた）*/
      if (leftG <= 0){
        var tc = document.querySelector('.two-col');
        if (tc) tc.classList.add('empty');
        finish();
      }
    }
    if (slow){ set.style.display = 'none'; done(); return; }

    set.style.maxHeight = set.scrollHeight + 'px';
    void set.offsetWidth;
    set.classList.add('out');
    setTimeout(function(){
      set.classList.add('shut');
      void set.offsetWidth;
      set.style.maxHeight = '0px'; set.style.marginBottom = '0px';
      setTimeout(function(){ set.style.display = 'none'; done(); }, 420);
    }, 260);
  }

  document.addEventListener('click', function(e){
    if (document.body.dataset.stage !== 'c' || !e.target.closest) return;
    /* 中の「片付ける」が先。**札の押しは開け閉め** */
    var d = e.target.closest('.gdo');
    if (d){ clearGroup(+d.dataset.k); return; }
    var b = e.target.closest('.gitem');
    if (b && !b.classList.contains('ghd')) select(+b.dataset.k);
  });

  /* ─ ④ ── **出口の三段をそのまま置く**（2026-09-10。本人：「出口は変える気ない」）。
       驚き　　　　　402 行が 12 件になった
       打ち消さない　減らしたのではなく、形を変えただけ（**面倒は消えない**）
       着地　　　　　**一つずつなら、手が付けられる**
     **落差は体で感じさせて、名前は理念が付ける**——④は名前を付ける場所なので、
     ここだけは言葉で言っていい。

     （前の記録）**診断をやめた**（2026-09-10）。
     前は②の答えを受けて「決まったことは 0 件」「探しているものがありませんでした」
     ——**穴の指摘**で、向きが「あなたはここができていない」。
     ゴールは「これならちょっとずつでもできるかも」なので、**逆を向いていた。**

     いま返すのは出口の三段そのまま：
       驚き　　　　　一手で N 行が片付いた
       打ち消さない　減らしたのではなく、形を変えただけ（**面倒は消えない**）
       着地　　　　　**残りも、同じ一手** */
  /* 出口。**③の下に出す**（2026-09-10。本人：「最後のカードいる？もう合体させたら」）。
     段を切り替えていたので、**12 件が消えてから**出口が出ていた——
     09-10 の「せっかく 12 件にまとめたのに下に行っちゃって見えない」と同じ形。
     いまは**残っている件が見えたまま**、その下に出る。

     **一行目（「N 行が、12 件になりました」）は落とした。**すぐ上の見出しが
     「N 行は、12 件でした」と言っているので、同じ画面に二度は要らない。
     残るのは**言い足りていない二行**だけ。 */
  function finish(){
    var box = document.getElementById('end'),
        el  = document.getElementById('said'),
        f   = document.getElementById('go-d');
    if (!box || !el || !box.hidden) return;
    el.innerHTML =
      '減らしたのではなく、形を変えただけです。<br>'
      + '<b>一つずつなら、手が付けられます。</b>';
    box.hidden = false;
    if (f) f.classList.add('gone');           /* 行き先が出たら「最後に」は要らない */
    if (!slow) box.scrollIntoView({block:'end', behavior:'smooth'});
  }

  /* ─ 段 ───────────────────────────────────────────── */
  function stage(s){
    document.body.dataset.stage = s;
    scrollTo(0, 0);
    if (s === 'b') paintPile();
    if (s === 'c') paintRows();   /* 12 件を並べるだけ。開かない */
  }

  /* **やり直すと札も作り直す**——②で一行抜いてあるので、`build()` を通さないと
     402 行に戻らない */
  function start(){ build(); N = CARDS.length; stage('b'); }
  start();

  document.getElementById('go-c').addEventListener('click', gather);
  document.getElementById('go-d').addEventListener('click', finish);
  document.getElementById('again').addEventListener('click', function(){
    start(); scrollTo(0, 0);
  });

})();
</script>

</body>
