<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>007 注文どおり — アルターデザインコンサルティング</title>
<link rel="stylesheet" href="../../assets/css/reset.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- =====================================================================
     007 注文どおり — Claude Code そのもの

     一言：「あそこのサイト、Claude Code なんですよ。
             開くと、うちへの注文がそのまま流れてる」

     **サイトがまるごと Claude Code のセッション。**会社概要も理念もサービスも、
     全部このセッションの中で出てくる。別に用意した「ふつうのサイト」は無い。

     ── 外した縛り（2026-09-02、本人の指示）────────────────────────
     「最初の話は ClaudeCode 感だから、そっちメイン。
       別に今まで作ったルールも使わなくていい」

     1. **白基調で確定**（002 のターミナル案が「読みにくい」で却下）→ 地を暗くした
     2. **自己言及は却下**（003）→ 自己言及にした。このページ自身が成果物として流れる

     忘れて外したのではなく、言われて外した。**戻すときは 005・006 の NOTES を読む。**

     ── 借りた語彙（2026-09-02 に増やした）────────────────────────
     ⏺ ツールの呼び出し／⎿ その結果／☐ ☒ やることの一覧／行番号つきの diff／
     ✻ 考えている（回る記号＋経過秒＋esc to interrupt）／
     Updated ... with N additions and M removals ／(ctrl+r to expand)／
     Bash の起動ログ／? for shortcuts／Context left until auto-compact。

     **借りるのは語彙だけ。**画面の写しにはしない。文字の大きさと行間と
     対比は読める側に寄せてある（14px / 1.85 / 13:1 / 90ch）。

     ── 残した前提 ────────────────────────────────────────────────
     - **注文どおり。**注文は一行。言われたとおりに作って、動かして見せる
     - **形にする → 足りないところが浮かぶ**（005 と同じ順。逆にしない）
     - 未決の3つは**埋めない**（埋めると「AI が決めた」に戻る）
     - 事例が無いことを隠さない
     - **題材は G・005 と替えてある**（見積もり／値引きの上限・原価の取り方・承認の額）。
       デモで3本続けて見せると、同じ話を3回聞くことになるため
     - 動きを切る指定があるときは流さず全部出す（指針4）
     ===================================================================== -->

<div class="head">
  <span class="dot"></span>
  <b>claude</b>
  <span class="cwd">~/alter-design/mitsumori</span>
  <span class="right">
    <span>opus 4.6</span>
    <span>⏵⏵ auto-accept edits on</span>
  </span>
</div>

<div class="view" id="view">
  <div class="session" id="log">
    <div class="boot">
      <b>✻</b> 株式会社アルターデザインコンサルティング
      <span class="s">経営の力で「遊ぶように働く世界」をデザインする。／2025年6月設立</span>
    </div>
  </div>
</div>

<div class="foot">
  <div class="box">
    <span class="p">&gt;</span>
    <span class="typed" id="typed"></span><span class="cur" id="cur"></span>
  </div>
  <div class="hint">
    <span><b>enter</b> 送る</span>
    <span><b>esc</b> 最後まで</span>
    <span class="r"><button id="again" type="button">最初から</button></span>
  </div>
  <!-- 実物の下2行。**意味は無いが、これがあると Claude Code に見える。**
       残りの割合は流れに合わせて減らす（減らないと、動いていないものに見える）。 -->
  <div class="meta">
    <span>? for shortcuts</span>
    <span class="r">Context left until auto-compact: <span id="ctx">78</span>%</span>
  </div>
</div>

<script>
/* =====================================================================
   セッションの中身。**流れは1本。**枝分かれは作らない。

   種類
     you   人の行（> で始まる）        下の枠に打ってから log へ送る
     say   Claude の地の文             1文字ずつ出す
     tool  ⏺ ツールの呼び出し
     res   ⎿ その結果（exp:true で (ctrl+r to expand) を付ける）
     bash  ⏺ Bash(...) と、その出力
     todo  ⏺ Update Todos と ☐ / ☒ の一覧
     diff  ⏺ Update(path) と、まとめ行と、行番号つきの diff
     file  ⏺ Write(...) と、書き出したファイル
     think ✻ 考えている（回る記号・経過秒・esc to interrupt）
   ===================================================================== */
const S = [

  /* 1. 注文。**一行しかない。**これが後半の論拠になる。
     **題材は見積もり。**G（経費申請）と 005 と替えてある。
     デモで3本続けて見せると、同じ話を3回聞くことになるため（2026-09-02）。 */
  { t:'you',  x:'見積もりを出すのに、毎回3日かかる' },
  { t:'think', x:'どこで止まっているかを見ます' },
  { t:'say',  x:'承知しました。まず、直近の見積もりを読みます。' },

  /* 2. 聞いて回らない。現物を読む。**3日の内訳が出るのが効く** */
  { t:'tool', x:'Read', a:'直近の見積もり 12件・原価表・見積後のやりとり' },
  { t:'res',  x:'12件を読みました', exp:true },
  { t:'res',  x:'3日のうち、<span class="a">2日は社内の確認待ち</span>でした。' },
  { t:'res',  x:'原価表は Excel で、値引きは案件ごとに手で入れています。' },

  /* 3. 注文どおりに作ると宣言する。**勝手に良くしない** */
  { t:'todo', x:[
      ['now','言われたとおりに、見積書を1枚で出せるようにする'],
      ['open','出せるところまで持っていく'],
      ['open','作るのに足りない情報を洗い出す'],
    ]},
  { t:'say',  x:'足す機能はありません。<b>言われたことだけ</b>入れます。' },

  /* 4. 作る。diff で出す。文脈行も薄く出す（実物と同じ見え方） */
  { t:'diff', f:'mitsumori/見積書', at:1, add:5, del:0, l:[
      ['ctx','御見積書'],
      ['add','品目　　　業務システム設計・開発'],
      ['add','数量　　　1'],
      ['add','単価　　　—'],
      ['add','値引き　　—'],
      ['add','合計　　　—'],
    ]},
  { t:'diff', f:'mitsumori/運用', at:8, add:1, del:2, l:[
      ['del','原価表.xlsx を開く → 手で転記 → 上長に確認 → 送付'],
      ['del','（確認待ち 2日）'],
      ['add','入力 → その場で PDF → 送付'],
    ]},

  /* 5. 動いた、と言い切る。**起動ログで見せる。**
     ここで終われば「注文どおり」で完成している */
  { t:'bash', x:'npm run dev', o:[
      'mitsumori@1.0.0 dev',
      'ready — http://localhost:3000',
      '<b>✓</b> 直近3件で試算しました（合計・税・端数まで一致）',
    ]},
  { t:'todo', x:[
      ['done','言われたとおりに、見積書を1枚で出せるようにする'],
      ['done','出せるところまで持っていく'],
      ['now','作るのに足りない情報を洗い出す'],
    ]},
  { t:'say',  x:'出ています。金額を入れれば、その場で PDF になります。' },
  { t:'say',  x:'入っているのは、言われたことだけです。', dim:true },

  /* 6. ここから先が、うちの仕事。**形にしたから浮かんだ**という順を守る。
     未決の3つは、**画面に空欄があるから出てきたもの。**
     単価・値引き・合計を置いた時点で、埋められないことが分かる */
  { t:'you',  x:'それで足りてる？' },
  { t:'think', x:'形にしたことで、決まっていないところが見えています' },
  { t:'say',  x:'足りていません。<b>作るのに足りない情報が3つ</b>残りました。' },
  { t:'todo', x:[
      ['open','値引きの上限'],
      ['open','原価をどこから取るか'],
      ['open','いくらから承認が要るか'],
    ]},
  { t:'say',  x:'聞いて集めても、これは出てきません。<b>まだ誰も困っていないからです。</b>' },
  { t:'say',  x:'先に形にすると、困る前に出てきます。決めるのは御社の会議です。', dim:true },

  /* 7. 名乗り。**会社概要は成果物として書き出す。**別ページへ逃がさない */
  { t:'you',  x:'あなたたちは？' },
  { t:'file', f:'会社概要.md' },
  { t:'say',  x:'決まっていない状態からで構いません。' },
  { t:'say',  x:'「何を決めればいいか分からない」という相談が、いちばん多いです。' },
  { t:'you',  x:'info@alter-dsgn.co.jp' },
];

const view  = document.getElementById('view');
const log   = document.getElementById('log');
const typed = document.getElementById('typed');
const cur   = document.getElementById('cur');
const again = document.getElementById('again');
const ctxEl = document.getElementById('ctx');

/* 動きを切る指定があるときは、流さずに全部出す（指針4）。
   動かない環境で中身が消えてはいけない。 */
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;

let at = 0, busy = false, done = false;

function el(cls, html){
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  log.appendChild(d);
  return d;
}
function bottom(){ view.scrollTop = view.scrollHeight; }

/* 残りの割合を、進み具合に合わせて減らす。**減らないと動いていないものに見える。**
   数字そのものに意味は無い（78 → 31 まで）。 */
function meter(){
  ctxEl.textContent = Math.round(78 - 47 * (at / S.length));
}

/* 1文字ずつ。**速さは一定。**待たせる間は作らない */
function type(node, text, per, end){
  if (STILL){ node.innerHTML = text; end(); return; }
  let i = 0;
  (function tick(){
    if (text[i] === '<') i = text.indexOf('>', i) + 1;   /* タグは一気に進める */
    else i += 1;
    node.innerHTML = text.slice(0, i);
    bottom();
    if (i < text.length) setTimeout(tick, per); else end();
  })();
}

const ABOUT = [
  ['会社名', '株式会社アルターデザインコンサルティング'],
  ['設立', '2025年6月'],
  ['資本金', '6,000万円'],
  ['代表取締役', '松岡 真功'],
  ['所在地', '東京都港区西新橋3-23-5 ANYZ304'],
  ['事業内容', 'AI技術を活用した組織最適化に関するコンサルティング事業／AIとローコードを組み合わせた次世代型のシステム開発事業'],
  ['株主', '株式会社BlueMeme／株式会社ハイ・アベイラビリティ・システムズ／株式会社サーバーワークス・キャピタル／リックソフト株式会社'],
  ['サービス', '次世代型業務システム開発／AIによる意思決定支援・事業変革／自律共創型の組織デザイン／地域のデジタル格差支援'],
  ['掲載できる事例', 'まだありません（2025年6月に始めた会社です）'],
];

/* 考えている表示。**回る記号と経過秒と esc to interrupt。**
   ここが Claude Code でいちばん特徴的な一行。
   終わったら静かな一行に置き換える（回りっぱなしにしない）。 */
const GLYPH = ['✻','✽','✻','✳','✢','·'];
function think(s, end){
  const n = el('row think', '');
  if (STILL){ n.innerHTML = '✻ ' + s.x + '…'; end(); return; }
  const t0 = Date.now();
  let k = 0, live = true;
  (function tick(){
    if (!live) return;
    const sec = ((Date.now() - t0) / 1000).toFixed(0);
    n.innerHTML = '<span class="g">' + GLYPH[k++ % GLYPH.length] + '</span> ' + s.x + '… ' +
                  '<span class="sec">(' + sec + 's · esc to interrupt)</span>';
    bottom();
    if (Date.now() - t0 < 1500) setTimeout(tick, 120);
    else { live = false; n.innerHTML = '<span class="g">✻</span> ' + s.x + '…'; end(); }
  })();
}

function put(s, end){
  if (s.t === 'you'){
    /* 送るだけ。**打つのは typeYou()。**打ち終わったところで enter を待つ */
    typed.textContent = '';
    el('row you', '<span>&gt;</span> ' + s.x);
    bottom(); end();
    return;
  }

  if (s.t === 'say'){
    const n = el('row say' + (s.dim ? ' dim' : ''), '');
    type(n, s.x, 16, end);
    return;
  }

  if (s.t === 'think'){ think(s, end); return; }

  if (s.t === 'tool'){
    el('row tool', '<span class="b">⏺</span> <span class="nm">' + s.x + '</span>(' + s.a + ')');
    bottom(); setTimeout(end, STILL ? 0 : 240); return;
  }

  if (s.t === 'res'){
    const n = el('row res', '');
    const tail = s.exp ? ' <span class="exp">(ctrl+r to expand)</span>' : '';
    type(n, '  ⎿ <span class="a">' + s.x + '</span>' + tail, 10, end);
    return;
  }

  if (s.t === 'bash'){
    el('row tool', '<span class="b">⏺</span> <span class="nm">Bash</span>(' + s.x + ')');
    const out = el('out', '');
    if (STILL){ out.innerHTML = s.o.join('\n'); bottom(); end(); return; }
    let i = 0;
    (function tick(){
      out.innerHTML = s.o.slice(0, ++i).join('\n');
      bottom();
      if (i < s.o.length) setTimeout(tick, 380); else end();
    })();
    return;
  }

  if (s.t === 'todo'){
    /* 実物は一覧を書き換えるツールとして出る。見出しを付けて、⎿ の下にぶら下げる */
    el('row tool', '<span class="b">⏺</span> <span class="nm">Update Todos</span>');
    el('todo', s.x.map(function(r){
      const m = r[0] === 'done' ? '☒' : '☐';
      const inner = r[0] === 'done' ? '<s>' + r[1] + '</s>' : r[1];
      return '<div class="' + r[0] + '">  ⎿ <span class="mark">' + m + '</span> ' + inner + '</div>';
    }).join(''));
    bottom(); setTimeout(end, STILL ? 0 : 320); return;
  }

  if (s.t === 'diff'){
    /* ⏺ Update(path) → ⎿ Updated ... with N additions and M removals → diff。
       まとめ行の数え方まで実物に合わせる（1件のときは単数）。 */
    el('row tool', '<span class="b">⏺</span> <span class="nm">Update</span>(' + s.f + ')');
    const a = s.add, d = s.del;
    const w = [];
    if (a) w.push('<span class="n">' + a + ' addition' + (a > 1 ? 's' : '') + '</span>');
    if (d) w.push('<span class="m">' + d + ' removal' + (d > 1 ? 's' : '') + '</span>');
    el('row res sum', '  ⎿ Updated ' + s.f + ' with ' + w.join(' and '));
    el('diff',
      s.l.map(function(r, i){
        const sign = r[0] === 'add' ? '+' : r[0] === 'del' ? '−' : ' ';
        return '<div class="l ' + r[0] + '"><span class="n">' + (s.at + i) + '</span>' +
               '<span class="t">' + sign + ' ' + r[1] + '</span></div>';
      }).join(''));
    bottom(); setTimeout(end, STILL ? 0 : 300); return;
  }

  if (s.t === 'file'){
    el('row tool', '<span class="b">⏺</span> <span class="nm">Write</span>(' + s.f + ')');
    el('row res sum', '  ⎿ Wrote ' + ABOUT.length + ' lines to ' + s.f);
    el('file',
      '<div class="f">' + s.f + '</div><div class="body"><dl>' +
      ABOUT.map(function(r){ return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('') +
      '</dl></div>');
    bottom(); setTimeout(end, STILL ? 0 : 300); return;
  }

  end();
}

/* =====================================================================
   進め方。**エンターを押すのは、人の行だけ。**

   前は一手ずつエンターで、26回押すことになっていた。多すぎた。
   いまは Claude 側（ツール・地の文・diff・一覧）が**自動で続けて出る**。
   その turn が終わると、**次の注文が下の枠に打たれて止まる。**
   そこでエンターを押すと送られて、また Claude 側が自動で流れる。押すのは4回。

   自動で流すのは Claude 側だけ。**人の行は自動で送らない。**
   送ってしまうと、読んでいる途中で話が進む。 */
let waiting = false;   // 人の行を打ち終えて、enter を待っている
const hintEl = document.querySelector('.hint');

/* 人の行を、下の枠に打つ。打ち終わったら止まって待つ */
function typeYou(){
  const s = S[at];
  waiting = false;
  if (STILL){ typed.textContent = s.x; waiting = true; mark(); return; }
  let i = 0;
  (function tick(){
    typed.textContent = s.x.slice(0, ++i);
    bottom();
    if (i < s.x.length) setTimeout(tick, 34);
    else { waiting = true; mark(); }
  })();
}

/* 待っているあいだだけ、下の合図を変える */
function mark(){
  hintEl.firstElementChild.innerHTML = waiting
    ? '<b>enter</b> 送る'
    : '<b>enter</b> 進める';
}

/* Claude 側を、止まるまで自動で流す */
function run(){
  if (busy || done) return;
  if (at >= S.length){ finish(); return; }
  if (S[at].t === 'you'){ typeYou(); return; }   // 人の番。ここで止まる
  busy = true;
  put(S[at], function(){
    at += 1; busy = false; meter();
    run();
  });
}

function send(){
  if (!waiting) return;
  waiting = false; mark();
  busy = true;
  put(S[at], function(){
    at += 1; busy = false; meter();
    run();
  });
}

function finish(){
  done = true;
  typed.textContent = '';
  cur.style.display = 'none';
  hintEl.firstElementChild.innerHTML = '<b>おわり</b>';
}

/* esc で最後まで。打つ動きは飛ばして中身だけ置く */
function rest(){
  busy = false; waiting = false;
  while (at < S.length){
    const s = S[at];
    if (s.t === 'you') el('row you', '<span>&gt;</span> ' + s.x);
    else if (s.t === 'say') el('row say' + (s.dim ? ' dim' : ''), s.x);
    else if (s.t === 'think') el('row think', '<span class="g">✻</span> ' + s.x + '…');
    else if (s.t === 'res') el('row res', '  ⎿ <span class="a">' + s.x + '</span>' +
      (s.exp ? ' <span class="exp">(ctrl+r to expand)</span>' : ''));
    else if (s.t === 'bash'){
      el('row tool', '<span class="b">⏺</span> <span class="nm">Bash</span>(' + s.x + ')');
      el('out', s.o.join('\n'));
    }
    else put(s, function(){});
    at += 1;
  }
  meter(); finish(); bottom();
}

addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); send(); }
  if (e.key === 'Escape'){ e.preventDefault(); rest(); }
});
/* 触る操作でも送れる。スマホはキーが無い */
view.addEventListener('click', send);
document.querySelector('.foot').addEventListener('click', function(e){
  if (e.target === again) return;
  send();
});
again.addEventListener('click', function(){ location.reload(); });

/* 開いた瞬間に、最初の注文が打たれる。**送るのは人。**
   ここを自動で送ると、何が起きているのか分からないまま流れていく。 */
meter(); mark();
if (STILL) rest(); else run();
</script>
</body>
</html>
