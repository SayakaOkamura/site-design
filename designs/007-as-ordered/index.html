<!-- =====================================================================
     007 注文どおり — Claude Code そのもの

     一言：「あそこのサイト、Claude Code なんですよ。
             開くと、うちへの注文がそのまま流れてる」

     **サイトがまるごと Claude Code のセッション。**会社概要も理念もサービスも、
     全部このセッションの中で出てくる。別に用意した「ふつうのサイト」は無い。

     ── 外した縛り（2026-09-02、本人の指示）────────────────────────
     「最初の話は ClaudeCode 感だから、そっちメイン。
       別に今まで作ったルールも使わなくていい」

     1. **白基調で確定**（002 のターミナル案が「読みにくい」で却下）→ 地を暗くした
     2. **自己言及は却下**（003）→ 自己言及にした。このページ自身が成果物として流れる

     忘れて外したのではなく、言われて外した。**戻すときは 005・006 の NOTES を読む。**

     ── 借りた語彙（2026-09-02 に増やした）────────────────────────
     ⏺ ツールの呼び出し／⎿ その結果／☐ ☒ やることの一覧／行番号つきの diff／
     ✻ 考えている（回る記号＋経過秒＋esc to interrupt）／
     Updated ... with N additions and M removals ／(ctrl+r to expand)／
     Bash の起動ログ／? for shortcuts／Context left until auto-compact。

     **借りるのは語彙だけ。**画面の写しにはしない。文字の大きさと行間と
     対比は読める側に寄せてある（14px / 1.85 / 13:1 / 90ch）。

     ── 残した前提 ────────────────────────────────────────────────
     - **注文どおり。**注文は一行。言われたとおりに作って、動かして見せる
     - **形にする → 足りないところが浮かぶ**（005 と同じ順。逆にしない）
     - 未決の3つは**埋めない**（埋めると「AI が決めた」に戻る）
     - 事例が無いことを隠さない
     - **題材は G・005 と替えてある**（見積もり／値引きの上限・原価の取り方・承認の額）。
       デモで3本続けて見せると、同じ話を3回聞くことになるため
     - 動きを切る指定があるときは流さず全部出す（指針4）
     ===================================================================== -->

<script>
/* =====================================================================
   セッションの中身。**流れは1本。**枝分かれは作らない。

   種類
     you   人の行（> で始まる）        下の枠に打ってから log へ送る
     say   Claude の地の文             1文字ずつ出す
     tool  ⏺ ツールの呼び出し
     res   ⎿ その結果（exp:true で (ctrl+r to expand) を付ける）
     bash  ⏺ Bash(...) と、その出力
     todo  ⏺ Update Todos と ☐ / ☒ の一覧
     diff  ⏺ Update(path) と、まとめ行と、行番号つきの diff
     file  ⏺ Write(...) と、書き出したファイル
     think ✻ 考えている（回る記号・経過秒・esc to interrupt）
   ===================================================================== */
/* =====================================================================
   話題。**注文の言葉と、左の目次の言葉を同じにしてある**（2026-09-03）

   > ClaudeCodeに投げる質問と横の目次同じでいい気がする。横に合わせて。
   > あとmdって入れるのは露骨すぎる。もっと一般層でも見れるようにして

   目次は**言葉**。**押すと、その言葉に「は？」を付けて送る**（`ask()`）。
   目次は見出しのまま、送るほうは問いになる。**言葉は一つ。**

   言葉は**会社サイトの見出し**（サービス／実績・料金／会社概要／お問い合わせ）。
   一度やわらかく書いたが（できること／相談したい）、**硬めに合わせた。**
   読む人は社長層で、見慣れているのはこちら。

   `.md` は目次から外した。ファイル名が出るのは Claude が読みにいく行のほう
   （`⏺ Read(会社概要.md)`）。**人は言葉で言い、道具はファイルで動く。**

   **読みにいくファイルは、目次の言葉と同じ名前にしてある。**
   1つめだけ `CLAUDE.md` を読んでいたが、
   「このサイト」が `CLAUDE.md` と結びついてしまうのでやめた（2026-09-03）。
   ほかは全部、日本語の名前のファイルを読んでいる。

   **中身は公表情報だけ**（2026-09-03）。`進め方.md` と `やらないこと.md` は
   こちらが書いたものだったので落とした。**会社サイトの見出しを名乗っている
   ところに、こちらの言葉を混ぜない。**落とした文面は NOTES にある。
   ===================================================================== */

/* **「このサイト」は目次のいちばん下。**（2026-09-03）

   > このサイトの分なのに Read になってるから、いきなりサービス？って見える
   > いや、それ自体は何回も開ける必要がある

   目次の**1番**に置くと、そこだけ人の行なしで済んで、1番が黙って終わった
   ように見える。次の `サービスは？` が飛んで見えるのはそのせい。
   目次から**外す**と、今度は開き直せない。
   **順番の外に置いた。**下に一つだけ、区切って並べる。
   - 案内の順は `サービス` から始まる（枠に最初に打たれるのもこれ。揃う）
   - 「このサイト」は**いつでも押せる。**開いた瞬間に一度出ているので ✓ が付く
   - 案内が一周しても、ここへは戻らない（**順番の外**なので） */
const T = [
  { k:'サービス', s:[
      { t:'tool', x:'Glob', a:'サービス/*.md' },
      { t:'res',  x:'Found 4 files', exp:true },
      { t:'list', x:[
          ['次世代型業務システム開発', 'ノーコード／ローコードで業務を再設計'],
          ['AIによる意思決定支援・事業変革', 'データ資産を戦略と予測に変換'],
          ['自律共創型の組織デザイン', '個の自律とチームの協働を両立する構造'],
          ['地域のデジタル格差支援', 'ノーコードとクラウドAI、DX人材の育成'],
        ]},
    ]},

  /* **このサイトで一番変なところ。**無いものが 0件として出る。2つ続けて出す */
  { k:'実績・料金', s:[
      { t:'tool', x:'Glob', a:'事例/**/*.md' },
      { t:'res',  x:'No files found' },
      { t:'say',  x:'掲載できる事例は、<b>まだありません。</b>2025年6月に始めた会社です。' },
      { t:'tool', x:'Read', a:'料金.md' },
      { t:'res',  x:'File does not exist' },
      { t:'say',  x:'料金表は<b>置いていません。</b>' },
    ]},

  /* 会社概要 → 登記・株主 → 理念。**名乗りは最後**（G と同じ） */
  { k:'会社概要', s:[
      { t:'tool', x:'Read', a:'会社概要.md' },
      { t:'md',   f:'会社概要.md', x:[
          '株式会社アルターデザインコンサルティング',
          '代表取締役　松岡 真功',
          '設立　2025年6月／資本金 6,000万円',
          '東京都港区西新橋3-23-5 ANYZ304',
        ]},
      { t:'tool', x:'Read', a:'会社概要.md#登記' },
      { t:'md',   f:'会社概要.md#登記', x:[
          'AI技術を活用した組織最適化に関するコンサルティング事業',
          'AIとローコードを組み合わせた次世代型のシステム開発事業',
          '株主：BlueMeme／ハイ・アベイラビリティ・システムズ／サーバーワークス・キャピタル／リックソフト',
        ]},
      { t:'tool', x:'Read', a:'理念.md' },
      { t:'quote', x:'経営の力で「遊ぶように働く世界」をデザインする。' },
    ]},

  { k:'お問い合わせ', s:[
      { t:'tool', x:'Write', a:'お問い合わせ.md' },
      { t:'md',   f:'お問い合わせ.md', x:[
          'alt-dsgn.co.jp のフォームから',
        ]},
    ]},

  /* **順番の外。**開いた瞬間に流れるぶんで、目次では下に区切って並ぶ */
  { k:'このサイト', s:[
      { t:'think', x:'読んでいます' },
      { t:'tool', x:'Read', a:'このサイト.md' },
      { t:'md',   f:'このサイト.md', x:[
          'ここは会社案内。聞かれたことは、置いてあるファイルで返す',
          '無いものは、無いと返す',
          '読みたいところは、左の一覧を押す。enter でも次へ進む',
        ]},
    ]},
];

/* 案内の順に並んでいるのは、最後の一つを除いたぶん */
const TOUR = T.length - 1;

/* =====================================================================
   開いた時点で出ているもの。**上の2行だけ**（2026-09-03）

   > 一番最初に表示したいようなものを最初から出しておいて、何もクリック
   > しなくても情報自体はあるようにしたいかも。表示したいものでも、
   > このサイトのルールでもいいけど
   > スクロールいらないくらいがいいな。その会社概要と理念だけでいいんじゃない、最初は
   > さっきみたいに上に2行でまとめてるやつだけでいい

   **起動枠の2行が、会社概要と理念をまとめたもの。**
   社名／理念／設立が、押さなくても出ている。それ以上は出さない。

   セッションに中身を置くのは**やめた**（会社概要の札と理念の枠を出していた）。
   同じことが上の2行に書いてあって、社名が二度出ていた。
   ===================================================================== */

const view  = document.getElementById('view');
const log   = document.getElementById('log');
const typed = document.getElementById('typed');
const cur   = document.getElementById('cur');
const again = document.getElementById('again');
const ctxEl = document.getElementById('ctx');
const box   = document.getElementById('box');
const sf    = document.getElementById('sf');

/* 動きを切る指定があるときは、流さずに全部出す（指針4）。
   動かない環境で中身が消えてはいけない。 */
const STILL = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* **間は、ここだけで決める。**「一気に出てくると読みにくい」（2026-09-02）。
   前は地の文 16ms／ツールのあと 240ms／塊のあと 300ms で、
   turn がまるごと数秒で流れ切っていた。読む時間が無い。

   ch    地の文の1文字
   res   ⎿ の1文字（結果は短いので、地の文より少し速い）
   tool  ツールの行を出したあと、結果を出すまで
   block 一覧・diff・ファイルを出したあと
   turn  Claude 側が終わってから、次の注文を打ちはじめるまで
         **ここがいちばん効く。**読み終わる前に次の行が打たれると、目が戻る */
const PACE = { ch:28, res:18, tool:620, block:820, turn:1100 };

/* **開いた瞬間の1回だけ、速さを別にする**（2026-09-03）。
   > ページのロードあるのにここでも初手ロードで待たされるとストレスあるかも。
   > なしで。やるなら1秒以内
   ふつうの速さ（think 1.5s＋tool 620＋1行 300…）だと、出そろうまで 2.5 秒かかる。
   **ここだけ 850ms 前後に詰める。**読ませる間は、送ったあとの turn で取ればいい。
   think 400 ／ tool 150 ／ 1行 60 ／ 塊のあと 60 ／ 次の注文まで 400 */
const RUSH = { think:400, tool:150, line:60, block:60, turn:400 };
let rush = false;

/* esc。**流れている途中を、その場で出しきる。**
   出しきったあとも、途中だった行がゆっくり打ち続けないように */
let flush = false;

/* 進み具合は「聞いた話題の数」で持つ（下の meter）。at / busy / done は使わない */

function el(cls, html){
  const d = document.createElement('div');
  d.className = cls;
  d.innerHTML = html;
  log.appendChild(d);
  return d;
}
function bottom(){ view.scrollTop = view.scrollHeight; }

/* 1文字ずつ。**速さは一定。**待たせる間は作らない */
function type(node, text, per, end){
  if (STILL){ node.innerHTML = text; end(); return; }
  let i = 0;
  (function tick(){
    if (flush){ node.innerHTML = text; end(); return; }
    if (text[i] === '<') i = text.indexOf('>', i) + 1;   /* タグは一気に進める */
    else i += 1;
    node.innerHTML = text.slice(0, i);
    bottom();
    if (i < text.length) setTimeout(tick, per); else end();
  })();
}


/* 考えている表示。**回る記号と経過秒と esc to interrupt。**
   ここが Claude Code でいちばん特徴的な一行。
   終わったら静かな一行に置き換える（回りっぱなしにしない）。 */
const GLYPH = ['✻','✽','✻','✳','✢','·'];
function think(s, end){
  const n = el('row think', '');
  if (STILL){ n.innerHTML = '✻ ' + s.x + '…'; end(); return; }
  const t0 = Date.now();
  let k = 0, live = true;
  (function tick(){
    if (!live) return;
    if (flush){ live = false; n.innerHTML = '<span class="g">✻</span> ' + s.x + '…'; end(); return; }
    const sec = ((Date.now() - t0) / 1000).toFixed(0);
    n.innerHTML = '<span class="g">' + GLYPH[k++ % GLYPH.length] + '</span> ' + s.x + '… ' +
                  '<span class="sec">(' + sec + 's · esc to interrupt)</span>';
    bottom();
    if (Date.now() - t0 < (rush ? RUSH.think : 1500)) setTimeout(tick, rush ? 100 : 120);
    else { live = false; n.innerHTML = '<span class="g">✻</span> ' + s.x + '…'; end(); }
  })();
}

/* 塊の中の行を、1本ずつ出す。**面は先に置く**（面ごと出すと画面が跳ねる）。
   dl は dt と dd を対で出す（片方だけ出ると意味にならない）。 */
function reveal(box, per, end){
  const kids = [].slice.call(box.children);
  box.classList.add('stagger');
  if (STILL){ kids.forEach(function(k){ k.classList.add('in'); }); end(); return; }
  let i = 0;
  (function tick(){
    if (flush){ kids.forEach(function(k){ k.classList.add('in'); }); end(); return; }
    if (i >= kids.length){ setTimeout(end, rush ? RUSH.block : PACE.block / 2); return; }
    kids[i].classList.add('in');
    /* dt のときは dd も一緒に */
    if (kids[i].tagName === 'DT' && kids[i + 1]) kids[++i].classList.add('in');
    i += 1;
    bottom();
    setTimeout(tick, rush ? RUSH.line : per);
  })();
}

function put(s, end){
  if (s.t === 'you'){
    /* 送るだけ。**打つのは write()。**（rest から呼ばれる用） */
    typed.textContent = '';
    el('row you', '<span>&gt;</span> ' + s.x);
    bottom(); end();
    return;
  }

  if (s.t === 'say'){
    const n = el('row say' + (s.dim ? ' dim' : ''), '');
    type(n, s.x, PACE.ch, end);
    return;
  }

  if (s.t === 'think'){ think(s, end); return; }

  if (s.t === 'tool'){
    el('row tool', '<span class="b">⏺</span> <span class="nm">' + s.x + '</span>(' + s.a + ')');
    bottom(); setTimeout(end, STILL ? 0 : (rush ? RUSH.tool : PACE.tool)); return;
  }

  if (s.t === 'res'){
    const n = el('row res', '');
    const tail = s.exp ? ' <span class="exp">(ctrl+r to expand)</span>' : '';
    type(n, '  ⎿ <span class="a">' + s.x + '</span>' + tail, PACE.res, end);
    return;
  }

  if (s.t === 'bash'){
    el('row tool', '<span class="b">⏺</span> <span class="nm">Bash</span>(' + s.x + ')');
    const out = el('out', '');
    if (STILL){ out.innerHTML = s.o.join('\n'); bottom(); end(); return; }
    let i = 0;
    (function tick(){
      if (flush) i = s.o.length - 1;      /* esc。残りを一度に出す */
      out.innerHTML = s.o.slice(0, ++i).join('\n');
      bottom();
      if (i < s.o.length) setTimeout(tick, 520); else end();
    })();
    return;
  }

  if (s.t === 'todo'){
    /* 実物は一覧を書き換えるツールとして出る。見出しを付けて、⎿ の下にぶら下げる */
    el('row tool', '<span class="b">⏺</span> <span class="nm">Update Todos</span>');
    reveal(el('todo', s.x.map(function(r){
      const m = r[0] === 'done' ? '☒' : '☐';
      const inner = r[0] === 'done' ? '<s>' + r[1] + '</s>' : r[1];
      return '<div class="' + r[0] + '">  ⎿ <span class="mark">' + m + '</span> ' + inner + '</div>';
    }).join('')), 240, end);
    return;
  }

  if (s.t === 'diff'){
    /* ⏺ Update(path) → ⎿ Updated ... with N additions and M removals → diff。
       まとめ行の数え方まで実物に合わせる（1件のときは単数）。 */
    el('row tool', '<span class="b">⏺</span> <span class="nm">Update</span>(' + s.f + ')');
    const a = s.add, d = s.del;
    const w = [];
    if (a) w.push('<span class="n">' + a + ' addition' + (a > 1 ? 's' : '') + '</span>');
    if (d) w.push('<span class="m">' + d + ' removal' + (d > 1 ? 's' : '') + '</span>');
    el('row res sum', '  ⎿ Updated ' + s.f + ' with ' + w.join(' and '));
    reveal(el('diff',
      s.l.map(function(r, i){
        const sign = r[0] === 'add' ? '+' : r[0] === 'del' ? '−' : ' ';
        return '<div class="l ' + r[0] + '"><span class="n">' + (s.at + i) + '</span>' +
               '<span class="t">' + sign + ' ' + r[1] + '</span></div>';
      }).join('')), 200, end);
    return;
  }

  if (s.t === 'list'){
    /* Glob の結果。**ファイル名で並べる。**説明は薄い字で右に付ける */
    reveal(el('list', s.x.map(function(r){
      return '<div>  ⎿ <span class="fn">' + r[0] + '</span>' +
             (r[1] ? '<span class="d">' + r[1] + '</span>' : '') + '</div>';
    }).join('')), 220, end);
    return;
  }

  if (s.t === 'md'){
    /* 箇条書きのファイル。**中身をそのまま見せる**（要約しない） */
    const box = el('file',
      '<div class="f">' + s.f + '</div><div class="body md">' +
      s.x.map(function(t){ return '<div>- ' + t + '</div>'; }).join('') +
      '</div>');
    reveal(box.querySelector('.md'), 300, end);
    return;
  }

  if (s.t === 'quote'){
    /* 理念。**枠に入れて、大きめに置く。**ここだけ声の大きさを変える */
    const n = el('quote', '');
    type(n, s.x, 40, end);
    return;
  }


  end();
}

/* =====================================================================
   進み方。**自動で流れるのは Claude 側だけ。**（2026-09-03）

   一手ずつエンターは押す回数が多すぎ（26回）、下に一覧を置いたら読むところが
   狭くなった。そこを直したときに、**注文まで自動で送るようにしてしまった。**
   人の行を機械が送ると、「注文どおりに作る」話が「機械が勝手に進める」話になる。

   - 注文は**枠に打たれて、止まる。**送るのは人（enter／枠を押す）
   - 送ったあとの Claude 側は、最後まで自動で流れる
   - 1つ終わると PACE.turn 待って、**次の注文が枠に打たれる**（送りはしない）
   - 左の目次を押せば、そこへ飛ぶ。**いつでも、何度でも**（押すこと自体が送る動き）
   - 読み終わったものに ✓、いま読んでいるところに縦線
   - log は消さない。上に遡れば、前のものがそのまま残っている
   - esc で流れている途中を最後まで出す
   ===================================================================== */
const tree = document.getElementById('tree');

/* 目次。**押すと、その言葉がそのまま注文になる。**言い方は一つ */
T.forEach(function(t, n){
  const li = document.createElement('li');
  li.innerHTML = '<button type="button" data-n="' + n + '">' +
    '<span class="k">' + (n + 1) + '</span>' +
    '<span class="c">' + t.k + '</span></button>';
  tree.appendChild(li);
});

function btn(n){ return tree.querySelector('button[data-n="' + n + '"]'); }

/* 送る言葉。**目次の見出しに「は？」を付けるだけ。**
   目次は見出しとして読ませ、送るほうは問いにする（2026-09-03） */
function ask(n){ return T[n].k + 'は？'; }

function light(n){
  [].forEach.call(tree.querySelectorAll('button'), function(b){ b.classList.remove('now'); });
  const b = btn(n);
  if (b){ b.classList.add('now'); b.scrollIntoView({ block:'nearest' }); }
}

/* nowAt   いま出している話題
   pending 枠に打ってあって、まだ送っていない話題（-1 は無し）
   tok     打っている途中のもの。別のものを選ばれたら、前のは止まる */
let queue = [], qi = 0, nowAt = -1, busyNow = false, pending = -1, timer = 0, tok = 0;

function state(){
  /* 次の注文を打ちはじめるまでの間は、何も言わない（空にする） */
  const all = tree.querySelectorAll('button.seen').length >= T.length;
  sf.textContent = busyNow      ? '書いています'
                 : pending >= 0 ? 'enter で送ります'
                 : all          ? 'ぜんぶ出ました'
                 :                '';
  box.classList.toggle('ready', pending >= 0 && !busyNow);
}

/* 下の枠に打つ。**送らない。**送るのは人 */
function write(n){
  const t = T[n];
  if (!t) return;
  const my = ++tok;
  pending = n;
  typed.textContent = '';
  state();
  const q = ask(n);
  if (STILL){ typed.textContent = q; return; }
  let i = 0;
  (function tick(){
    if (my !== tok) return;       /* 途中で別のものを選ばれたら、打つのをやめる */
    typed.textContent = q.slice(0, ++i);
    if (i < q.length) setTimeout(tick, 38);
  })();
}

/* 送る。**ここから先が自動** */
function send(){ if (pending >= 0) go(pending); }

/* alone を立てると、人の行を出さずに Claude 側だけ動かす（開いた瞬間の1回） */
function go(n, alone){
  const t = T[n];
  if (!t) return;
  pending = -1; flush = false; rush = !!alone; ++tok;
  if (busyNow) rest();          /* 途中でも選べる。途中のぶんは出しきる */
  clearTimeout(timer);          /* rest が入れた次の予約を消す */
  nowAt = n; busyNow = true;
  light(n); state();
  typed.textContent = '';
  if (!alone) el('row you', '<span>&gt;</span> ' + ask(n));
  bottom();
  queue = t.s.slice(); qi = 0;
  runQueue();
}

/* 目次と数字キー。**押したこと自体が送る動き**なので、打ってから送る */
function jump(n){
  if (!T[n]) return;
  clearTimeout(timer);
  const my = ++tok;
  pending = -1;
  typed.textContent = '';
  state();
  if (STILL){ go(n); return; }
  const q = ask(n);
  let i = 0;
  (function tick(){
    if (my !== tok) return;
    typed.textContent = q.slice(0, ++i);
    if (i < q.length) setTimeout(tick, 30); else go(n);
  })();
}

function runQueue(){
  if (qi < queue.length){
    put(queue[qi++], function(){ meter(); runQueue(); });
    return;
  }
  done();
}

/* ひとつ終わった。**✓ を付けて、次の注文を枠に打つ。**送りはしない */
function done(){
  /* esc のあと、途中だった行が戻ってきて二度呼ばれることがある */
  if (!busyNow) return;
  busyNow = false;
  const b = btn(nowAt);
  if (b) b.classList.add('seen');
  meter(); bottom(); state();
  const n = next();
  if (n >= 0) timer = setTimeout(function(){ write(n); }, STILL ? 0 : (rush ? RUSH.turn : PACE.turn));
  rush = false;                 /* 速いのは開いた瞬間の1回だけ */
}

/* 次に打つ話題。**まだ出していないもの。**目次から先に押されたものは飛ばす。
   終わりまで行ったら頭に戻って、残っているものを拾う */
function next(){
  /* 順番の外（いちばん下の一つ）にいたときは、案内の頭から数える。
     開いた瞬間はそこにいるので、最初に打たれるのは目次の1番になる */
  const from = nowAt >= TOUR ? -1 : nowAt;
  for (let i = 1; i <= TOUR; i++){
    const j = (from + i + TOUR) % TOUR;    /* 順番の外は拾わない */
    const b = btn(j);
    if (b && !b.classList.contains('seen')) return j;
  }
  return -1;
}

/* 流れている途中を、最後まで出す */
function rest(){
  flush = true;                 /* 動いている途中の行も、その場で出しきる */
  while (qi < queue.length){
    const step = queue[qi++];
    if (step.t === 'say') el('row say' + (step.dim ? ' dim' : ''), step.x);
    else if (step.t === 'res') el('row res', '  ⎿ <span class="a">' + step.x + '</span>' +
      (step.exp ? ' <span class="exp">(ctrl+r to expand)</span>' : ''));
    else put(step, function(){});
  }
  done();
}

/* 残りの割合は、読み終わった話題の数で減らす */
function meter(){
  const seen = tree.querySelectorAll('button.seen').length;
  ctxEl.textContent = Math.round(78 - 47 * (seen / T.length));
}

tree.addEventListener('click', function(e){
  const b = e.target.closest('button');
  if (b) jump(+b.dataset.n);
});

/* 枠を押しても送れる。**キーの無い機械のため** */
box.addEventListener('click', send);

addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); send(); return; }
  if (e.key >= '1' && e.key <= '9'){ jump(+e.key - 1); return; }
  if (e.key === 'Escape'){ e.preventDefault(); if (busyNow) rest(); }
});

again.addEventListener('click', function(){ location.reload(); });

/* 開いた瞬間、Claude 側だけが動きはじめる。**注文は置かない。**
   1つめが終わると、次の注文が枠に打たれて止まる（そこからは人が送る） */
meter();
if (STILL){
  T.forEach(function(t, n){
    nowAt = n;
    el('row you', '<span>&gt;</span> ' + ask(n));
    queue = t.s.slice(); qi = 0;
    while (qi < queue.length) put(queue[qi++], function(){});
    const b = btn(n); if (b) b.classList.add('seen');
  });
  typed.textContent = ''; meter(); state();
}
else go(T.length - 1, true);
</script>
</body>
</html>
